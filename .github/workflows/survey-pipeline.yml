name: Survey interchange and numerical verification
on:
  push:
    branches: [main]
    paths: ['tools/survey/**', 'tests/survey/**', '.github/workflows/survey-pipeline.yml']
  pull_request:
    paths: ['tools/survey/**', 'tests/survey/**', '.github/workflows/survey-pipeline.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  survey:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/survey/requirements.txt
      - run: python -m unittest discover -s tests/survey -v
        env:
          PROJ_NETWORK: 'OFF'
