name: TSM Desktop

on:
  workflow_dispatch:
  push:
    branches: [main, Multi-Installer]
    paths:
      - "tsm-console/**"
      - ".github/workflows/tsm-desktop.yml"
  pull_request:
    branches: [main, Multi-Installer]
    paths:
      - "tsm-console/**"
      - ".github/workflows/tsm-desktop.yml"

permissions:
  contents: read

concurrency:
  group: tsm-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tsm-console
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tsm-console/package-lock.json
      - run: npm ci --ignore-scripts --registry=https://registry.npmjs.org
      - run: node scripts/desktop-updater-check.mjs

  windows:
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: tsm-console
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tsm-console/package-lock.json
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - run: cargo install tauri-cli --version 2.11.4 --locked
      - run: npm ci --ignore-scripts --registry=https://registry.npmjs.org
      - run: npm run build
      - name: Validate Windows bundle icons
        shell: pwsh
        run: |
          $png = "src-tauri/icons/icon.png"
          $ico = "src-tauri/icons/icon.ico"
          if (-not (Test-Path $png)) { throw "Required PNG icon missing: $png" }
          if (-not (Test-Path $ico)) { throw "Required ICO icon missing: $ico" }
          $pngBytes = [System.IO.File]::ReadAllBytes($png)
          $icoBytes = [System.IO.File]::ReadAllBytes($ico)
          if ($pngBytes.Length -lt 24) { throw "PNG icon is unexpectedly small: $($pngBytes.Length) bytes" }
          if ($icoBytes.Length -lt 22) { throw "ICO icon is unexpectedly small: $($icoBytes.Length) bytes" }
          if ($icoBytes[0] -ne 0 -or $icoBytes[1] -ne 0 -or $icoBytes[2] -ne 1 -or $icoBytes[3] -ne 0) {
            throw "ICO header is invalid"
          }
          Write-Host "Validated bundle icons: PNG=$($pngBytes.Length) bytes ICO=$($icoBytes.Length) bytes"
      - run: cargo tauri build --bundles msi,nsis
      - name: Verify Windows bundles
        shell: pwsh
        run: |
          if (-not (Get-ChildItem "src-tauri/target/release/bundle/msi/*.msi" -ErrorAction SilentlyContinue)) { throw "MSI missing" }
          if (-not (Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue)) { throw "NSIS EXE missing" }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tsm-windows-installers
          path: |
            tsm-console/src-tauri/target/release/bundle/msi/*.msi
            tsm-console/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  macos:
    needs: validate
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: tsm-console
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tsm-console/package-lock.json
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - run: cargo install tauri-cli --version 2.11.4 --locked
      - run: npm ci --ignore-scripts --registry=https://registry.npmjs.org
      - run: npm run build
      - name: Build macOS DMG
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY || '-' }}
        run: cargo tauri build --bundles dmg
      - name: Verify macOS bundle
        run: test -n "$(find src-tauri/target/release/bundle/dmg -name '*.dmg' -print -quit)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tsm-macos-installer
          path: tsm-console/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  linux:
    needs: validate
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: tsm-console
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tsm-console/package-lock.json
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Install Linux packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: cargo install tauri-cli --version 2.11.4 --locked
      - run: npm ci --ignore-scripts --registry=https://registry.npmjs.org
      - run: npm run build
      - name: Build Linux AppImage and deb
        run: cargo tauri build --bundles appimage,deb
      - name: Verify Linux bundles
        run: |
          test -n "$(find src-tauri/target/release/bundle/appimage -name '*.AppImage' -print -quit)"
          test -n "$(find src-tauri/target/release/bundle/deb -name '*.deb' -print -quit)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tsm-linux-installers
          path: |
            tsm-console/src-tauri/target/release/bundle/appimage/*.AppImage
            tsm-console/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

  integrity:
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: tsm-*-installer
          path: dist
          merge-multiple: true
      - run: find dist -type f -print0 | sort -z | xargs -0 sha256sum > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tsm-desktop-integrity
          path: dist/SHA256SUMS.txt
          if-no-files-found: error
