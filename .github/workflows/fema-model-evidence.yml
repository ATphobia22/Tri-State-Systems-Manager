name: TSM FEMA Model Evidence Applicability
on:
  pull_request:
    paths:
      - 'scripts/governance/fema_model_evidence_gate.py'
      - 'tests/governance/test_fema_model_evidence_gate.py'
      - 'docs/evidence/UPLOADED-FEMA-AND-INDIANA-REFERENCE-AUDIT-2026-11-13.md'
      - '.github/workflows/fema-model-evidence.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publication-evidence-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Compile model-publication evidence gate
        run: python -m py_compile scripts/governance/fema_model_evidence_gate.py
      - name: Guard against unsupported regulatory claims
        run: python -m unittest discover -s tests/governance -p test_fema_model_evidence_gate.py -v
