name: Posey LOMA offline DEM pre-screen
on:
  push:
    branches: [main]
    paths:
      - 'tools/geospatial_exchange/posey_panel_loma_prescreen.py'
      - 'tests/geospatial_exchange/test_posey_panel_loma_prescreen.py'
      - 'tools/geospatial_exchange/requirements-loma.txt'
      - '.github/workflows/posey-loma-dem-prescreen.yml'
  pull_request:
    paths:
      - 'tools/geospatial_exchange/posey_panel_loma_prescreen.py'
      - 'tests/geospatial_exchange/test_posey_panel_loma_prescreen.py'
      - 'tools/geospatial_exchange/requirements-loma.txt'
      - '.github/workflows/posey-loma-dem-prescreen.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: posey-loma-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline-synthetic-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/geospatial_exchange/requirements.txt -r tools/geospatial_exchange/requirements-loma.txt
      - run: python -m pytest -q tests/geospatial_exchange/test_posey_panel_loma_prescreen.py
      - run: python -m compileall -q tools/geospatial_exchange/posey_panel_loma_prescreen.py
