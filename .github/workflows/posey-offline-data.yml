name: Posey County Offline Authoritative Data

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feat/posey-offline-authoritative-data-*'
      - 'fix/posey-complete-acquisition-*'
      - 'fix/posey-bafm-geojson-*'
    paths:
      - 'scripts/posey/**'
      - 'data/posey-county/authoritative-source-requirements-v1.json'
      - 'scripts/geo/validate-exact-county.mjs'
      - '.github/workflows/posey-offline-data.yml'

permissions:
  contents: read

jobs:
  acquire:
    runs-on: windows-2022
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
      - name: Setup Node.js for acquisition contract tests
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Verify ArcGIS GeoJSON acquisition contract
        run: node scripts/posey/acquisition-geojson-contract.test.mjs


      - name: Patch mandatory-source hard-fail (BAFM + parcels)
        shell: pwsh
        run: .\\scripts\\posey\\patch-mandatory-hard-fail.ps1

      - name: Acquire official Posey County source snapshots
        shell: pwsh
        run: .\\scripts\\posey\\download-offline-authoritative-data.ps1

      - name: Validate mandatory authoritative sources and strict county geometry
        shell: pwsh
        run: .\\scripts\\posey\\verify-offline-authoritative-data.ps1

      - name: Generate bundle manifest and SHA-256 inventory
        shell: pwsh
        run: |
          $root = "data\\posey-county\\offline\\2026-09-30"
          Get-ChildItem -Recurse $root -File |
            Get-FileHash -Algorithm SHA256 |
            Select-Object Path,Hash |
            ConvertTo-Json -Depth 5 |
            Set-Content "$root\\sha256-files.json"
          Get-ChildItem -Recurse $root -File | Measure-Object -Property Length -Sum |
            ConvertTo-Json |
            Set-Content "$root\\bundle-size.json"

      - name: Upload complete offline source tree
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: posey-county-offline-authoritative-2026-09-30
          path: data\\posey-county\\offline\\2026-09-30
          if-no-files-found: error
          retention-days: 30

# Fix 2026-10-14: mandatory BAFM/parcels hard-fail (no soft unavailable-igio-outage);
# path filters prevent unrelated main pushes from re-running this long job.
