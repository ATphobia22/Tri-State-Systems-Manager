name: Temporary lockfile repair for hydrology verification

on:
  push:
    branches:
      - fix/hydrology-source-consistency-and-aoi-readiness-20261018

permissions:
  contents: write

concurrency:
  group: tsm-lockfile-repair-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regenerate-lockfile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Pin npm CLI
        run: npm install --global npm@10.9.2 --no-audit --no-fund
      - name: Regenerate lockfile without executing package scripts
        working-directory: tsm-console
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
      - name: Verify clean install against regenerated lockfile
        working-directory: tsm-console
        run: npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
      - name: Commit lockfile repair to this branch only
        run: |
          if git diff --quiet -- tsm-console/package-lock.json; then
            echo "Lockfile is already consistent; no commit required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tsm-console/package-lock.json
          git commit -m "chore: regenerate console package lockfile"
          git push origin "HEAD:${GITHUB_REF_NAME}"
