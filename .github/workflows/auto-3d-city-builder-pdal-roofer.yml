name: Mount Vernon PDAL Roofer reconstruction pilot
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/geospatial/auto-3d-city-builder/src/citybuilder/pdal_roofer.py'
      - 'scripts/geospatial/auto-3d-city-builder/tests/test_pdal_roofer.py'
      - '.github/workflows/auto-3d-city-builder-pdal-roofer.yml'
permissions:
  contents: read
  actions: read
jobs:
  reconstruction:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Test preprocessing and geometry contracts
        run: |
          python -m pip install -e 'scripts/geospatial/auto-3d-city-builder[test]'
          python -m pytest scripts/geospatial/auto-3d-city-builder/tests -q
      - name: Download exact successful COPC review artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: mount-vernon-vertical-reconstruction-review
          path: reviewed
          github-token: ${{ github.token }}
          run-id: 45769088253
      - name: Install PDAL and GDAL CLI in isolated environment
        shell: bash
        run: |
          set -euo pipefail
          CONDA="$(command -v conda || true)"
          if [[ -z "$CONDA" ]]; then CONDA=/usr/share/miniconda/bin/conda; fi
          "$CONDA" create -y -p "$RUNNER_TEMP/tsm-pdal" --override-channels -c conda-forge 'pdal=2.9.3' gdal
          "$CONDA" list -p "$RUNNER_TEMP/tsm-pdal" --explicit > pdal-lock.txt
          "$RUNNER_TEMP/tsm-pdal/bin/pdal" --version
          "$RUNNER_TEMP/tsm-pdal/bin/ogr2ogr" --version
      - name: Install checksum-pinned Roofer v1.0.0 Linux release
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --max-time 240 'https://github.com/3DBAG/roofer/releases/download/v1.0.0/roofer-linux-x86_64-v1.0.0.tar.gz' -o "$RUNNER_TEMP/roofer.tar.gz"
          echo "85834b289467b0e583e2b9c59a725c97ef39dc03c0c0a12417a8a0666e1aa0a1  $RUNNER_TEMP/roofer.tar.gz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/roofer"
          tar -xzf "$RUNNER_TEMP/roofer.tar.gz" -C "$RUNNER_TEMP/roofer"
          ROOFER="$(find "$RUNNER_TEMP/roofer" -type f -name roofer -perm -111 -print -quit)"
          test -n "$ROOFER"
          echo "TSM_ROOFER=$ROOFER" >> "$GITHUB_ENV"
          "$ROOFER" --help
      - name: Run source-linked raster generation and real Roofer LoD2.2 pilot
        env:
          PROJ_NETWORK: "OFF"
        run: |
          python -m citybuilder.pdal_roofer reviewed reconstruction-review --pdal "$RUNNER_TEMP/tsm-pdal/bin/pdal" --ogr2ogr "$RUNNER_TEMP/tsm-pdal/bin/ogr2ogr" --roofer "$TSM_ROOFER"
      - name: Preserve derived rasters, CityJSONSeq and review evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mount-vernon-pdal-roofer-review
          path: |
            pdal-lock.txt
            reconstruction-review/**
            !reconstruction-review/raw/**
            !reconstruction-review/metric.las
          if-no-files-found: warn
          retention-days: 30
