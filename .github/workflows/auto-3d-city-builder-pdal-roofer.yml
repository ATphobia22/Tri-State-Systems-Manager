name: Mount Vernon PDAL Roofer reconstruction pilot
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/geospatial/auto-3d-city-builder/src/citybuilder/pdal_roofer.py'
      - 'scripts/geospatial/auto-3d-city-builder/tests/test_pdal_roofer.py'
      - 'scripts/geospatial/auto-3d-city-builder/tests/test_pdal_binary_smoke.py'
      - 'scripts/geospatial/auto-3d-city-builder/runtime/**'
      - 'scripts/geospatial/auto-3d-city-builder/tests/test_native_runtime.py'
      - '.github/workflows/auto-3d-city-builder-pdal-roofer.yml'
permissions:
  contents: read
  actions: read
jobs:
  reconstruction:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Test preprocessing and geometry contracts
        run: |
          python -m pip install -e 'scripts/geospatial/auto-3d-city-builder[test]'
          python -m pytest scripts/geospatial/auto-3d-city-builder/tests -q
      - name: Download exact successful COPC review artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: mount-vernon-vertical-reconstruction-review
          path: reviewed
          github-token: ${{ github.token }}
          run-id: 45769088253
      - name: Install PDAL and GDAL CLI in isolated environment
        shell: bash
        run: |
          set -euo pipefail
          MM="$RUNNER_TEMP/micromamba"
          curl --fail --location --retry 3 --max-time 180 'https://github.com/mamba-org/micromamba-releases/releases/download/2.3.3-0/micromamba-linux-64' -o "$MM"
          echo "9496f94a8b78c536573c93d946ec9bba74bd9ff79ee55aaa4b546e30db8f511b  $MM" | sha256sum -c -
          chmod 0755 "$MM"
          export MAMBA_ROOT_PREFIX="$RUNNER_TEMP/tsm-mamba"
          "$MM" --version
          "$MM" create -y -p "$RUNNER_TEMP/tsm-pdal" --override-channels -c conda-forge 'pdal=2.9.3' gdal
          "$MM" list -p "$RUNNER_TEMP/tsm-pdal" --explicit > pdal-lock.txt
          export TSM_PDAL_PREFIX="$RUNNER_TEMP/tsm-pdal"
          echo "TSM_PDAL_PREFIX=$TSM_PDAL_PREFIX" >> "$GITHUB_ENV"
          NATIVE="$RUNNER_TEMP/tsm-native"
          mkdir "$NATIVE"
          for name in pdal ogr2ogr projinfo; do
            ln -s "$GITHUB_WORKSPACE/scripts/geospatial/auto-3d-city-builder/runtime/native-tool.sh" "$NATIVE/$name"
          done
          test -s "$TSM_PDAL_PREFIX/share/proj/proj.db"
          sha256sum "$TSM_PDAL_PREFIX/share/proj/proj.db" > proj-database.sha256
          "$NATIVE/projinfo" -s 'EPSG:2968+6360' -t 'EPSG:2793+5703' --summary | tee proj-operation.txt
          "$NATIVE/pdal" --version | tee pdal-version.txt
          grep -F '2.9.3' pdal-version.txt
          "$NATIVE/ogr2ogr" --version | tee gdal-version.txt
          "$NATIVE/pdal" --drivers > pdal-drivers.txt
          for driver in readers.las filters.reprojection filters.expression filters.crop writers.las writers.gdal; do
            grep -F "$driver" pdal-drivers.txt
          done
      - name: Execute real PDAL synthetic preprocessing smoke test
        env:
          PROJ_NETWORK: "OFF"
          TSM_PDAL_SMOKE: ${{ runner.temp }}/tsm-native/pdal
        run: |
          python -m pytest scripts/geospatial/auto-3d-city-builder/tests/test_pdal_binary_smoke.py -q
      - name: Install checksum-pinned Roofer v1.0.0 Linux release
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --max-time 240 'https://github.com/3DBAG/roofer/releases/download/v1.0.0/roofer-linux-x86_64-v1.0.0.tar.gz' -o "$RUNNER_TEMP/roofer.tar.gz"
          echo "85834b289467b0e583e2b9c59a725c97ef39dc03c0c0a12417a8a0666e1aa0a1  $RUNNER_TEMP/roofer.tar.gz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/roofer"
          tar -xzf "$RUNNER_TEMP/roofer.tar.gz" -C "$RUNNER_TEMP/roofer"
          ROOFER="$(find "$RUNNER_TEMP/roofer" -type f -name roofer -perm -111 -print -quit)"
          test -n "$ROOFER"
          echo "TSM_ROOFER=$ROOFER" >> "$GITHUB_ENV"
          "$ROOFER" --help
      - name: Run source-linked raster generation and real Roofer LoD2.2 pilot
        env:
          PROJ_NETWORK: "OFF"
        run: |
          python -m citybuilder.pdal_roofer reviewed reconstruction-review --pdal "$RUNNER_TEMP/tsm-native/pdal" --ogr2ogr "$RUNNER_TEMP/tsm-native/ogr2ogr" --roofer "$TSM_ROOFER"
      - name: Preserve derived rasters, CityJSONSeq and review evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mount-vernon-pdal-roofer-review
          path: |
            pdal-lock.txt
            pdal-version.txt
            gdal-version.txt
            pdal-drivers.txt
            proj-database.sha256
            proj-operation.txt
            reconstruction-review/**
            !reconstruction-review/raw/**
            !reconstruction-review/metric.las
          if-no-files-found: warn
          retention-days: 30
