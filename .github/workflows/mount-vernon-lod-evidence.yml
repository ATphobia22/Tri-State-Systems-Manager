name: Mount Vernon LOD Roof and Indoor Evidence Gate
on:
  push:
    paths:
      - 'scripts/geospatial/mount_vernon_lod_evidence.py'
      - 'tests/test_mount_vernon_lod_evidence.py'
      - 'docs/MOUNT-VERNON-LOD-EVIDENCE.md'
      - '.github/workflows/mount-vernon-lod-evidence.yml'
  pull_request:
    paths:
      - 'scripts/geospatial/mount_vernon_lod_evidence.py'
      - 'tests/test_mount_vernon_lod_evidence.py'
      - 'docs/MOUNT-VERNON-LOD-EVIDENCE.md'
      - '.github/workflows/mount-vernon-lod-evidence.yml'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  lod-evidence-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install pinned geometry test dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.3.5 trimesh==4.11.1
      - name: Validate roof and indoor evidence contracts
        run: python -m unittest discover -s tests -p test_mount_vernon_lod_evidence.py -v
      - name: Syntax check evidence CLI
        run: python -m py_compile scripts/geospatial/mount_vernon_lod_evidence.py
