name: Temporary Lockfile Regeneration

on:
  push:
    branches:
      - fix/ci-lockfile-and-nfip-evidence-2026-09-26

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: tsm-console
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
      - name: Pin npm
        run: npm install --global npm@10.9.2 --no-audit --no-fund
      - name: Regenerate lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
      - name: Commit regenerated lockfile when changed
        working-directory: .
        run: |
          set -euo pipefail
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          if git diff --quiet -- tsm-console/package-lock.json; then
            echo "Lockfile already reproducible."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tsm-console/package-lock.json
          git commit --signoff -m "fix(deps): regenerate lockfile with npm 10.9.2"
          git push origin "HEAD:${GITHUB_REF_NAME}"
