name: Indiana Elevation Registry Source Contract

on:
  push:
    branches: [main]
    paths:
      - "scripts/geospatial/verify_in_elevation_recovery_sources.py"
      - "scripts/geospatial/test_verify_in_elevation_recovery_sources.py"
      - ".github/workflows/in-elevation-source-inventory.yml"
  pull_request:
    paths:
      - "scripts/geospatial/verify_in_elevation_recovery_sources.py"
      - "scripts/geospatial/test_verify_in_elevation_recovery_sources.py"
      - ".github/workflows/in-elevation-source-inventory.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Compile official registry source inventory
        run: python3 -m py_compile scripts/geospatial/verify_in_elevation_recovery_sources.py scripts/geospatial/test_verify_in_elevation_recovery_sources.py
      - name: Test sixteen no-network source and privacy guards
        run: python3 scripts/geospatial/test_verify_in_elevation_recovery_sources.py -v
