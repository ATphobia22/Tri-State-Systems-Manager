name: Offline Asset Chunk Integrity Contract

on:
  pull_request:
    paths:
      - 'scripts/release/chunk_offline_assets.py'
      - 'scripts/release/test_chunk_offline_assets.py'
      - 'docs/release/CHUNKED-OFFLINE-ASSETS.md'
      - '.github/workflows/offline-asset-chunk-contract.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/release/chunk_offline_assets.py'
      - 'scripts/release/test_chunk_offline_assets.py'
      - 'docs/release/CHUNKED-OFFLINE-ASSETS.md'
      - '.github/workflows/offline-asset-chunk-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-chunk-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Compile streaming packer
        run: python3 -m py_compile scripts/release/chunk_offline_assets.py scripts/release/test_chunk_offline_assets.py
      - name: Verify deterministic compression, corruption rejection and exact restoration
        run: python3 -m unittest discover -s scripts/release -p 'test_chunk_offline_assets.py' -v
