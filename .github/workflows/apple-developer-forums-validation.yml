name: Apple Developer Forums Integration Guardrails

on:
  push:
    branches: [main, feat/apple-developer-forums-hardening-20261024]
    paths:
      - 'integrations/apple-platform/apple-developer-forums-findings.json'
      - 'schemas/compass-waypoint.schema.json'
      - 'tests/contracts/apple-developer-forums.test.mjs'
      - 'integrations/apple-shortcuts/tsm-shortcuts-api.json'
      - 'package.json'
      - '.github/workflows/apple-developer-forums-validation.yml'
  pull_request:
    paths:
      - 'integrations/apple-platform/apple-developer-forums-findings.json'
      - 'schemas/compass-waypoint.schema.json'
      - 'tests/contracts/apple-developer-forums.test.mjs'
      - 'integrations/apple-shortcuts/tsm-shortcuts-api.json'
      - 'package.json'
      - '.github/workflows/apple-developer-forums-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4
        with:
          node-version: 22
      - name: Validate Apple platform safety contracts
        run: node --test tests/contracts/apple-developer-forums.test.mjs
