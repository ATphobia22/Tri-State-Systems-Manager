name: Mount Vernon and DoWORC source contracts

on:
  pull_request:
    paths:
      - 'scripts/geo/audit_doworc_native_crs.py'
      - 'scripts/geospatial/tsm_mv_scene_manifest.py'
      - 'tests/test_audit_doworc_native_crs.py'
      - 'tests/test_tsm_mv_scene_contract.py'
      - 'tsm-native/Content/Python/tsm_mv_scene_contract.py'
      - '.github/workflows/recovered-geospatial-source-contracts.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/geo/audit_doworc_native_crs.py'
      - 'scripts/geospatial/tsm_mv_scene_manifest.py'
      - 'tests/test_audit_doworc_native_crs.py'
      - 'tests/test_tsm_mv_scene_contract.py'
      - 'tsm-native/Content/Python/tsm_mv_scene_contract.py'
      - '.github/workflows/recovered-geospatial-source-contracts.yml'

permissions:
  contents: read

jobs:
  source-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: python -m pip install pyproj==3.8.0
      - run: |
          python -m unittest discover -s tests -p test_tsm_mv_scene_contract.py -v
          python -m unittest discover -s tests -p test_audit_doworc_native_crs.py -v
