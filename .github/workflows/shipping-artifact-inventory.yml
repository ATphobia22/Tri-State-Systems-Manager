name: Shipping Artifact Inventory Contract
on:
  pull_request:
    branches: [main]
    paths:
      - scripts/native/audit_shipping_artifacts.py
      - tests/native/test_shipping_artifact_audit.py
      - .github/workflows/shipping-artifact-inventory.yml
  push:
    branches: [main]
    paths:
      - scripts/native/audit_shipping_artifacts.py
      - tests/native/test_shipping_artifact_audit.py
      - .github/workflows/shipping-artifact-inventory.yml
permissions:
  contents: read
jobs:
  inventory-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests/native -p test_shipping_artifact_audit.py -v
