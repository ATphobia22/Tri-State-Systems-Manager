name: Shipping Artifact Inventory Contract
on:
  pull_request:
    branches: [main]
    paths:
      - scripts/native/audit_shipping_artifacts.py
      - tests/native/test_shipping_artifact_audit.py
      - .github/workflows/shipping-artifact-inventory.yml
  push:
    branches: [main]
    paths:
      - scripts/native/audit_shipping_artifacts.py
      - tests/native/test_shipping_artifact_audit.py
      - .github/workflows/shipping-artifact-inventory.yml
permissions:
  contents: read
jobs:
  inventory-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests/native -p test_shipping_artifact_audit.py -v
