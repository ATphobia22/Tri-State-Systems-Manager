name: Temporary SQLFluff Migration Formatting

on:
  push:
    branches:
      - fix/ci-lockfile-and-nfip-evidence-2026-09-26

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install pinned SQLFluff
        run: python -m pip install sqlfluff==4.3.0
      - name: Format migrations
        run: sqlfluff fix db/migrations/ --dialect postgres --exclude-rules RF04,CP03
      - name: Commit formatted migrations
        run: |
          set -euo pipefail
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          if git diff --quiet -- db/migrations; then
            echo "SQL migrations already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add db/migrations
          git commit --signoff -m "style(sql): format migrations with SQLFluff 4.3.0"
          git push origin "HEAD:${GITHUB_REF_NAME}"
