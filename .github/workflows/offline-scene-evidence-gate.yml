name: Offline Scene Evidence Gate
on:
  pull_request:
    paths:
      - 'scripts/geospatial/validate_scene_contract.py'
      - 'backend/tests/test_scene_contract_gate.py'
      - '.github/workflows/offline-scene-evidence-gate.yml'
  push:
    paths:
      - 'scripts/geospatial/validate_scene_contract.py'
      - 'backend/tests/test_scene_contract_gate.py'
      - '.github/workflows/offline-scene-evidence-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s backend/tests -p test_scene_contract_gate.py -v
      - run: python -m py_compile scripts/geospatial/validate_scene_contract.py backend/tests/test_scene_contract_gate.py
