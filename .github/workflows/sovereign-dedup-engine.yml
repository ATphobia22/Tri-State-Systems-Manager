name: Sovereign Deduplication Engine
on:
  pull_request:
    branches: [main]
    paths:
      - 'crates/sovereign-dedup-engine/**'
      - '.github/workflows/sovereign-dedup-engine.yml'
  push:
    branches: [main]
    paths:
      - 'crates/sovereign-dedup-engine/**'
      - '.github/workflows/sovereign-dedup-engine.yml'
permissions:
  contents: read
jobs:
  rust-test:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path crates/sovereign-dedup-engine/Cargo.toml --locked
