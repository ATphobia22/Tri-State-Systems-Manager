name: Sovereign Deduplication Engine
on:
  pull_request:
    branches: [main]
    paths:
      - 'crates/sovereign-dedup-engine/**'
      - '.github/workflows/sovereign-dedup-engine.yml'
  push:
    branches: [main]
    paths:
      - 'crates/sovereign-dedup-engine/**'
      - '.github/workflows/sovereign-dedup-engine.yml'
permissions:
  contents: read
jobs:
  rust-test:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Pin Rust toolchain
        shell: bash
        run: rustup toolchain install 1.85.1 --profile minimal
      - run: cargo test --manifest-path crates/sovereign-dedup-engine/Cargo.toml
