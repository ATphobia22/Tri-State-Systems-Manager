name: Weather Reference and Waypoint Contract Validation

on:
  push:
    branches: [main, feat/weather-provenance-compass-waypoints-20261024]
    paths:
      - 'integrations/weather-provider-reference.json'
      - 'schemas/compass-waypoint.schema.json'
      - 'docs/data-sources/APPLE-WEATHERKIT-AND-COMPASS-INTEGRATION.md'
      - 'tests/contracts/weather-provider-reference.test.mjs'
      - 'package.json'
      - '.github/workflows/weather-reference-validation.yml'
  pull_request:
    paths:
      - 'integrations/weather-provider-reference.json'
      - 'schemas/compass-waypoint.schema.json'
      - 'docs/data-sources/APPLE-WEATHERKIT-AND-COMPASS-INTEGRATION.md'
      - 'tests/contracts/weather-provider-reference.test.mjs'
      - 'package.json'
      - '.github/workflows/weather-reference-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v4
        with:
          node-version: 22
      - name: Validate registry and waypoint contracts
        run: node --test tests/contracts/weather-provider-reference.test.mjs
