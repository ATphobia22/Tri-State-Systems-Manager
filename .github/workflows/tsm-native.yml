name: TSM Native
on:
  push:
    branches: [Multi-Installer]
    paths:
      - "tsm-native/**"
      - "native/archimedes/**"
      - "scripts/native/**"
      - "native/dependencies/**"
      - "scripts/ci/native-runtime-boundary.mjs"
      - "scripts/ci/validate-native-platform-matrix.mjs"
      - "tsm-native/config/platform-build-matrix.json"
      - ".github/workflows/tsm-native.yml"
  pull_request:
    branches: [main, Multi-Installer]
    paths:
      - "tsm-native/**"
      - "native/archimedes/**"
      - "scripts/native/**"
      - "native/dependencies/**"
      - "scripts/ci/native-runtime-boundary.mjs"
      - "scripts/ci/validate-native-platform-matrix.mjs"
      - "tsm-native/config/platform-build-matrix.json"
      - ".github/workflows/tsm-native.yml"
  workflow_dispatch:
    inputs:
      package_windows:
        description: "Run UE5 Windows Shipping packaging on a self-hosted UE5 runner"
        required: true
        default: false
        type: boolean
      package_macos:
        description: "Run UE5 macOS Shipping packaging on a self-hosted UE5 runner"
        required: true
        default: false
        type: boolean
      package_ios:
        description: "Run UE5 iOS Shipping packaging on a self-hosted macOS UE5/iOS runner"
        required: true
        default: false
        type: boolean
      package_android:
        description: "Run UE5 Android Shipping packaging on a self-hosted UE5/Android runner"
        required: true
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: tsm-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Cache vcpkg binary packages
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: tsm-vcpkg-${{ runner.os }}-${{ matrix.triplet }}-${{ hashFiles('native/dependencies/vcpkg.json', 'native/dependencies/vcpkg-configuration.json') }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Native runtime boundary
        run: node scripts/ci/native-runtime-boundary.mjs
      - name: Native platform matrix
        run: node scripts/ci/validate-native-platform-matrix.mjs
      - name: Build and test ArchimedesCore
        run: |
          cmake -S native/archimedes -B native/archimedes/build -DBUILD_TESTING=ON
          cmake --build native/archimedes/build --config Release --parallel
          ctest --test-dir native/archimedes/build --build-config Release --output-on-failure

  data-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Validate native runtime gates
        run: |
          node scripts/ci/native-runtime-boundary.mjs
          node scripts/ci/validate-native-platform-matrix.mjs
      - name: Validate manifest tooling
        run: test -s scripts/native/Verify-NativeDataManifest.ps1

  archimedes-sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Configure ASan/UBSan build
        run: cmake -S native/archimedes -B native/archimedes/build-sanitized -DBUILD_TESTING=ON -DARCHIMEDES_ENABLE_SANITIZERS=ON -DCMAKE_BUILD_TYPE=Debug
      - name: Build sanitized solver
        run: cmake --build native/archimedes/build-sanitized --parallel
      - name: Run sanitized tests
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir native/archimedes/build-sanitized --output-on-failure

  dependency-probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            triplet: x64-linux
          - os: windows-latest
            triplet: x64-windows
          - os: macos-14
            triplet: arm64-osx
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Cache vcpkg binary packages
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: tsm-vcpkg-${{ runner.os }}-${{ matrix.triplet }}-${{ hashFiles('native/dependencies/vcpkg.json', 'native/dependencies/vcpkg-configuration.json') }}
      - name: Bootstrap pinned native dependencies (Unix)
        if: ${{ matrix.os != 'windows-latest' }}
        shell: bash
        run: |
          export VCPKG_BINARY_SOURCES="clear;files,$RUNNER_TEMP/vcpkg-cache,readwrite"
          chmod +x ./scripts/native/Bootstrap-NativeDependencies.sh
          ./scripts/native/Bootstrap-NativeDependencies.sh "${{ matrix.triplet }}"
      - name: Bootstrap pinned native dependencies (Windows)
        if: ${{ matrix.os == 'windows-latest' }}
        shell: pwsh
        env:
          VCPKG_BINARY_SOURCES: "clear;files,${{ runner.temp }}/vcpkg-cache,readwrite"
        run: ./scripts/native/Bootstrap-NativeDependencies.ps1 -Triplet "${{ matrix.triplet }}"
      - name: Verify native dependency manifest
        shell: bash
        run: |
          ROOT="native/dependencies/vcpkg_installed/${{ matrix.triplet }}"
          test -f "$ROOT/include/sqlite3.h"
          test -f "$ROOT/include/spatialite.h"
          if [[ "${{ matrix.triplet }}" == *windows* ]]; then
            find "$ROOT" -type f \( -name "sqlite3.lib" -o -name "mod_spatialite.lib" -o -name "mod_spatialite.dll" \) -print -quit | grep -q .
          elif [[ "${{ matrix.triplet }}" == *osx* ]]; then
            find "$ROOT" -type f \\( -name "libsqlite3.a" -o -name "libsqlite3.dylib" -o -name "mod_spatialite.dylib" \\) -print -quit | grep -q .
          else
            find "$ROOT" -type f \\( -name "libsqlite3.so*" -o -name "libspatialite.so*" \\) -print -quit | grep -q .
          fi

  package-windows:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.package_windows }}
    runs-on: [self-hosted, windows, ue5]
    steps:
      - uses: actions/checkout@v5
      - name: Require UE_ROOT
        shell: pwsh
        env:
          UE_ROOT: ${{ vars.UE_ROOT }}
        run: |
          if (-not $env:UE_ROOT) { throw "UE_ROOT must be configured on the UE5 self-hosted runner." }
      - name: Require Cesium for Unreal 2.29.1
        shell: pwsh
        env:
          UE_ROOT: ${{ vars.UE_ROOT }}
        run: |
          $plugin = Join-Path $env:UE_ROOT "Engine\Plugins\Marketplace\CesiumForUnreal\CesiumForUnreal.uplugin"
          if (-not (Test-Path $plugin)) { throw "Cesium for Unreal is required on the UE5 runner." }
          $manifest = Get-Content "tsm-native\config\native-geospatial-runtime.json" -Raw | ConvertFrom-Json
          if ($manifest.geospatial.pluginVersion -ne "2.29.1") { throw "Unexpected Cesium version contract." }
      - name: Require packaged SpatiaLite
        shell: pwsh
        env:
          TSM_SPATIALITE_DLL: ${{ vars.TSM_SPATIALITE_DLL }}
        run: |
          if (-not $env:TSM_SPATIALITE_DLL) { throw "TSM_SPATIALITE_DLL repository variable is required." }
          if (-not (Test-Path $env:TSM_SPATIALITE_DLL)) { throw "SpatiaLite DLL not found." }
      - name: Build native Windows package
        shell: pwsh
        env:
          UE_ROOT: ${{ vars.UE_ROOT }}
          TSM_SPATIALITE_DLL: ${{ vars.TSM_SPATIALITE_DLL }}
        run: .\scripts\native\Build-TSMNativeWindows.ps1 -UnrealRoot $env:UE_ROOT
      - name: Sign Windows release artifacts
        shell: pwsh
        env:
          TSM_WINDOWS_SIGNING_CERT_SHA1: ${{ secrets.TSM_WINDOWS_SIGNING_CERT_SHA1 }}
          TSM_WINDOWS_TIMESTAMP_URL: ${{ vars.TSM_WINDOWS_TIMESTAMP_URL }}
        run: |
          if (-not $env:TSM_WINDOWS_SIGNING_CERT_SHA1) { throw "TSM_WINDOWS_SIGNING_CERT_SHA1 secret is required for release signing." }
          if (-not $env:TSM_WINDOWS_TIMESTAMP_URL) { throw "TSM_WINDOWS_TIMESTAMP_URL repository variable is required." }
          $signtool = Get-Command signtool.exe -ErrorAction Stop
          $installer = Get-ChildItem "dist/installer" -Filter "TSM-Native-Setup-*-windows-x64.exe" -File | Select-Object -First 1
          if (-not $installer) { throw "Windows installer was not produced." }
          & $signtool.Source sign /sha1 $env:TSM_WINDOWS_SIGNING_CERT_SHA1 /fd SHA256 /tr $env:TSM_WINDOWS_TIMESTAMP_URL /td SHA256 $installer.FullName
          if ($LASTEXITCODE -ne 0) { throw "Windows Authenticode signing failed." }
          & $signtool.Source verify /pa /all $installer.FullName
          if ($LASTEXITCODE -ne 0) { throw "Windows Authenticode verification failed." }
      - uses: actions/upload-artifact@v4
        with:
          name: tsm-native-windows-installer
          path: dist/installer/TSM-Native-Setup-*-windows-x64.exe
          if-no-files-found: error

  package-macos:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.package_macos }}
    runs-on: [self-hosted, macos, ue5]
    steps:
      - uses: actions/checkout@v5
      - name: Require UE_ROOT
        run: test -n "$UE_ROOT"
        env:
          UE_ROOT: ${{ vars.UE_ROOT }}
      - name: Require Cesium for Unreal 2.29.1
        run: |
          test -f "$UE_ROOT/Engine/Plugins/Marketplace/CesiumForUnreal/CesiumForUnreal.uplugin"
          test "$(python3 -c 'import json; print(json.load(open("tsm-native/config/native-geospatial-runtime.json"))["geospatial"]["pluginVersion"])')" = "2.29.1"
        env:
          UE_ROOT: ${{ vars.UE_ROOT }}
      - name: Build ArchimedesCore
        run: |
          cmake -S native/archimedes -B native/archimedes/build
          cmake --build native/archimedes/build --config Release --parallel
      - name: Require packaged SpatiaLite
        run: |
          test -n "$TSM_SPATIALITE_DYLIB"
          test -f "$TSM_SPATIALITE_DYLIB"
        env:
          TSM_SPATIALITE_DYLIB: ${{ vars.TSM_SPATIALITE_DYLIB }}
      - name: Package UE5 macOS application
        run: |
          "$UE_ROOT/Engine/Build/BatchFiles/RunUAT.sh" BuildCookRun \
            -project="$GITHUB_WORKSPACE/tsm-native/TSMNative.uproject" \
            -noP4 -build -cook -stage -pak -package -archive \
            -archivedirectory="$GITHUB_WORKSPACE/dist/tsm-native" \
            -platform=Mac -clientconfig=Shipping -utf8output
      - name: Add SpatiaLite to macOS package
        run: |
          cp "$TSM_SPATIALITE_DYLIB" dist/tsm-native/mod_spatialite.dylib
        env:
          TSM_SPATIALITE_DYLIB: ${{ vars.TSM_SPATIALITE_DYLIB }}
      - name: Sign and notarize macOS release
        shell: bash
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          MACOS_NOTARY_PROFILE: ${{ secrets.MACOS_NOTARY_PROFILE }}
        run: |
          test -n "$MACOS_SIGNING_IDENTITY"
          test -n "$MACOS_NOTARY_PROFILE"
          APP="$(find dist/tsm-native -type d -name '*.app' -print -quit)"
          test -n "$APP"
          codesign --force --options runtime --timestamp --deep --sign "$MACOS_SIGNING_IDENTITY" "$APP"
          codesign --verify --deep --strict "$APP"
          xcrun notarytool submit "$APP" --keychain-profile "$MACOS_NOTARY_PROFILE" --wait
          xcrun stapler staple "$APP"
          spctl --assess --type execute "$APP"
      - uses: actions/upload-artifact@v4
        with:
          name: tsm-native-macos-package
          path: dist/tsm-native/**
          if-no-files-found: error


  package-ios:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.package_ios }}
    runs-on: [self-hosted, macos, ue5, ios]
    steps:
      - uses: actions/checkout@v5
      - name: Require UE_ROOT and Xcode
        shell: bash
        env:
          UE_ROOT: ${{ vars.UE_ROOT }}
        run: |
          test -n "$UE_ROOT"
          xcode-select -p
          xcodebuild -version
      - name: Package UE5 iOS Shipping build
        shell: bash
        env:
          UE_ROOT: ${{ vars.UE_ROOT }}
        run: |
          "$UE_ROOT/Engine/Build/BatchFiles/RunUAT.sh" BuildCookRun             -project="$GITHUB_WORKSPACE/tsm-native/TSMNative.uproject"             -noP4 -build -cook -stage -pak -package -archive             -archivedirectory="$GITHUB_WORKSPACE/dist/tsm-native-ios"             -platform=IOS -clientconfig=Shipping -utf8output
      - name: Verify iOS signing and package output
        shell: bash
        run: |
          test -d dist/tsm-native-ios
          BUNDLE="$(find dist/tsm-native-ios -type d -name '*.app' -print -quit)"
          test -n "$BUNDLE"
          codesign --verify --deep --strict "$BUNDLE"
      - uses: actions/upload-artifact@v4
        with:
          name: tsm-native-ios-package
          path: dist/tsm-native-ios/**
          if-no-files-found: error

  package-android:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.package_android }}
    runs-on: [self-hosted, linux, ue5, android]
    steps:
      - uses: actions/checkout@v5
      - name: Require UE_ROOT and Android toolchain
        shell: bash
        env:
          UE_ROOT: ${{ vars.UE_ROOT }}
        run: |
          test -n "$UE_ROOT"
          test -n "$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          test -n "$ANDROID_NDK_ROOT"
          test -d "$ANDROID_NDK_ROOT"
      - name: Package UE5 Android Shipping build
        shell: bash
        env:
          UE_ROOT: ${{ vars.UE_ROOT }}
        run: |
          "$UE_ROOT/Engine/Build/BatchFiles/RunUAT.sh" BuildCookRun             -project="$GITHUB_WORKSPACE/tsm-native/TSMNative.uproject"             -noP4 -build -cook -stage -pak -package -archive             -archivedirectory="$GITHUB_WORKSPACE/dist/tsm-native-android"             -platform=Android -clientconfig=Shipping -utf8output
      - name: Verify Android package signing
        shell: bash
        run: |
          test -d dist/tsm-native-android
          APK="$(find dist/tsm-native-android -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          APKSIGNER="$(find "$ANDROID_HOME" -type f \( -name apksigner -o -name apksigner.bat \) -print -quit)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: tsm-native-android-package
          path: dist/tsm-native-android/**
          if-no-files-found: error
