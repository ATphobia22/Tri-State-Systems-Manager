name: npm Workspace Dependency Contract

on:
  push:
    branches: [main, feat/apple-developer-forums-hardening-20261024]
    paths:
      - 'apps/**/package.json'
      - 'packages/**/package.json'
      - 'providers/**/package.json'
      - 'plugins/**/package.json'
      - 'tests/contracts/npm-workspace-dependencies.test.mjs'
      - '.github/workflows/npm-workspace-dependency-validation.yml'
  pull_request:
    paths:
      - 'apps/**/package.json'
      - 'packages/**/package.json'
      - 'providers/**/package.json'
      - 'plugins/**/package.json'
      - 'tests/contracts/npm-workspace-dependencies.test.mjs'
      - '.github/workflows/npm-workspace-dependency-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v4
        with:
          node-version: 22
      - name: Validate npm workspace dependency contracts
        run: node --test tests/contracts/npm-workspace-dependencies.test.mjs
