name: Mount Vernon raster gap recovery and terrain contact
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/geospatial/auto-3d-city-builder/src/citybuilder/raster_recovery.py'
      - '.github/workflows/auto-3d-city-builder-raster.yml'
permissions:
  contents: read
  actions: read
jobs:
  raster-review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install and test
        run: |
          python -m pip install -e 'scripts/geospatial/auto-3d-city-builder[test]'
          python -m pytest scripts/geospatial/auto-3d-city-builder/tests -q
      - name: Download exact successful COPC pilot
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: mount-vernon-vertical-reconstruction-review
          path: reviewed
          github-token: ${{ github.token }}
          run-id: 45769088253
      - name: Audit baseline and acquire bounded raster evidence
        run: python -m citybuilder.raster_recovery reviewed raster-review --contact-tolerance-m 0.5
      - name: Retain raster evidence and contact diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mount-vernon-raster-gap-contact-review
          path: raster-review/
          retention-days: 30
          if-no-files-found: warn
