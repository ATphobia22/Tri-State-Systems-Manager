name: Mount Vernon real DEM Transvoxel acceptance
on:
  pull_request:
    paths:
      - 'scripts/geospatial/mount_vernon_multi_dem_camera_sweep.py'
      - 'scripts/geospatial/mount_vernon_dem_transvoxel_gate.py'
      - 'tests/contracts/mount-vernon-dem-manifest.test.mjs'
      - 'docs/evidence/mount-vernon-3dtiles-dem-preview-2026-11-09.json'
      - '.github/workflows/mount-vernon-real-dem-adapter.yml'
      - 'scripts/geospatial/stage_mount_vernon_preview.py'
  push:
    paths:
      - 'scripts/geospatial/mount_vernon_dem_transvoxel_gate.py'
      - 'tests/contracts/mount-vernon-dem-manifest.test.mjs'
      - 'docs/evidence/mount-vernon-3dtiles-dem-preview-2026-11-09.json'
      - '.github/workflows/mount-vernon-real-dem-adapter.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11'}
      - name: Source evidence contract
        run: |
          node --test tests/contracts/mount-vernon-dem-manifest.test.mjs
          python -m py_compile scripts/geospatial/mount_vernon_dem_transvoxel_gate.py
          python -m py_compile scripts/geospatial/stage_mount_vernon_preview.py

  real_dem_transition_pairs:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11'}
      - name: Install geospatial runtime
        run: python -m pip install --disable-pip-version-check 'numpy>=1.26' 'rasterio>=1.3'
      - name: Acquire exact Indiana public DEM objects
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dem results
          for name in IN2020_26700930_12 IN2020_26850945_12; do
            curl --fail --location --retry 4 --retry-delay 5 --connect-timeout 20 --max-time 240 \
              "https://giselevationingov.s3.us-east-2.amazonaws.com/demoptimized/statewide/2020/SPW/2.5ft/${name}.tif" \
              --output "dem/${name}.tiff"
          done
          echo "1a321bc386e0de8b7cca74ec903fb35ea8fb54e8cdd7e835428210562e173ebb  dem/IN2020_26700930_12.tiff" > checksums.sha256
          echo "78f987ad4f93d3680d4500ad0b74542872f83529861b5500863addb61c00d124  dem/IN2020_26850945_12.tiff" >> checksums.sha256
          sha256sum -c checksums.sha256
      - name: Exercise actual production Transvoxel mesher on DEM windows
        shell: bash
        env:
          # Explicit *unverified* source vertical units; preview only.
          TSM_DEM_VERTICAL_UNIT: us-ft
        run: |
          set -euo pipefail
          python scripts/geospatial/mount_vernon_dem_transvoxel_gate.py \
            --raster dem/IN2020_26700930_12.tiff \
            --expected-sha256 1a321bc386e0de8b7cca74ec903fb35ea8fb54e8cdd7e835428210562e173ebb \
            --out results/tile-26700930-transition-pair.json --acknowledge-preview-only
          python scripts/geospatial/mount_vernon_dem_transvoxel_gate.py \
            --raster dem/IN2020_26850945_12.tiff \
            --expected-sha256 78f987ad4f93d3680d4500ad0b74542872f83529861b5500863addb61c00d124 \
            --out results/tile-26850945-transition-pair.json --acknowledge-preview-only
      - name: Sweep production mesher across both DEMs (16 windows each)
        shell: bash
        env:
          TSM_DEM_VERTICAL_UNIT: us-ft
        run: |
          set -euo pipefail
          python scripts/geospatial/mount_vernon_multi_dem_camera_sweep.py --raster dem/IN2020_26700930_12.tiff --sha256 1a321bc386e0de8b7cca74ec903fb35ea8fb54e8cdd7e835428210562e173ebb --grid 4 --output results/tile-26700930-camera-sweep.json --preview-only
          python scripts/geospatial/mount_vernon_multi_dem_camera_sweep.py --raster dem/IN2020_26850945_12.tiff --sha256 78f987ad4f93d3680d4500ad0b74542872f83529861b5500863addb61c00d124 --grid 4 --output results/tile-26850945-camera-sweep.json --preview-only
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: mount-vernon-real-dem-transvoxel-evidence
          path: |
            results/*.json
            checksums.sha256
          if-no-files-found: warn
          retention-days: 30
