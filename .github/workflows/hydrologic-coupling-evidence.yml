name: TSM Hydrologic Coupling Evidence Contract
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/hydrologic_coupling_acceptance.py'
      - 'backend/solver_evidence_adapters.py'
      - 'backend/tests/test_hydrologic_coupling_acceptance.py'
      - 'backend/tests/test_swmm_solver_evidence.py'
      - '.github/workflows/hydrologic-coupling-evidence.yml'
  pull_request:
    paths:
      - 'backend/hydrologic_coupling_acceptance.py'
      - 'backend/solver_evidence_adapters.py'
      - 'backend/tests/test_hydrologic_coupling_acceptance.py'
      - 'backend/tests/test_swmm_solver_evidence.py'
      - '.github/workflows/hydrologic-coupling-evidence.yml'
permissions:
  contents: read
jobs:
  evidence-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pinned
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # pinned
        with:
          python-version: '3.12'
      - name: Install evidence-parsing dependencies
        run: python -m pip install --disable-pip-version-check numpy h5py
      - name: Compile contracts
        run: |
          python -m py_compile backend/hydrologic_coupling_acceptance.py backend/solver_evidence_adapters.py
          python -m py_compile backend/tests/test_hydrologic_coupling_acceptance.py backend/tests/test_swmm_solver_evidence.py
      - name: Run synthetic known-answer and failure-denial suites
        run: |
          python -m unittest backend.tests.test_hydrologic_coupling_acceptance backend.tests.test_swmm_solver_evidence -v
