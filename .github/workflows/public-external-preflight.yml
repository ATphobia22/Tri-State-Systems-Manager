name: Public external source acquisition preflight
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/geospatial/public_external_preflight.py'
      - 'scripts/geospatial/test_public_external_preflight.py'
      - 'scripts/geospatial/external_registry.json'
      - 'scripts/geospatial/pdal_3dep_clip.json'
      - '.github/workflows/public-external-preflight.yml'
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: python -m pip install pyproj==3.7.1 pytest==8.3.5
      - run: python -m pytest scripts/geospatial/test_public_external_preflight.py -q
      - run: python scripts/geospatial/public_external_preflight.py --out public-review
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: public-external-source-preflight
          path: public-review/
          if-no-files-found: error
          retention-days: 30
