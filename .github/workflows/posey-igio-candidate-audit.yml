name: Posey IGIO Candidate Audit Contract

on:
  push:
    branches: [main]
    paths:
      - "scripts/geospatial/audit_posey_igio_candidate.py"
      - "scripts/geospatial/test_audit_posey_igio_candidate.py"
      - ".github/workflows/posey-igio-candidate-audit.yml"
  pull_request:
    paths:
      - "scripts/geospatial/audit_posey_igio_candidate.py"
      - "scripts/geospatial/test_audit_posey_igio_candidate.py"
      - ".github/workflows/posey-igio-candidate-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate-audit-contract:
    name: Candidate source safety and identity (synthetic)
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install pinned geometry dependencies
        run: python -m pip install --disable-pip-version-check --no-input --no-cache-dir "numpy==2.1.3" "shapely==2.0.6"
      - name: Compile audit scripts
        run: python -m py_compile scripts/geospatial/audit_posey_igio_candidate.py scripts/geospatial/test_audit_posey_igio_candidate.py
      - name: Run nine privacy, identity, provenance and geometry smoke tests
        run: python scripts/geospatial/test_audit_posey_igio_candidate.py -v
