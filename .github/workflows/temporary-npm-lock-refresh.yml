name: Temporary npm lockfile refresh

on:
  push:
    branches:
      - fix/maplibre-three-peer-dependency
    paths:
      - 'tsm-console/package.json'
      - '.github/workflows/temporary-npm-lock-refresh.yml'

permissions:
  contents: write

concurrency:
  group: temporary-npm-lock-refresh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org

      - name: Pin npm CLI
        run: npm install --global npm@10.9.2 --no-audit --no-fund

      - name: Regenerate lockfile from supported peer ranges
        working-directory: tsm-console
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org

      - name: Verify locked dependency graph
        working-directory: tsm-console
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
          npm ls three --all

      - name: Publish generated lockfile on repair branch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- tsm-console/package-lock.json; then
            echo "Lockfile already matches package.json."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tsm-console/package-lock.json
          git commit -m "fix(console): regenerate lockfile for Three.js 0.178.0"
          git push origin "HEAD:${GITHUB_REF_NAME}"
