name: Indiana DEM Export Integrity
on:
  pull_request:
    paths:
      - 'scripts/geospatial/acquire_indiana_dem_tiles.py'
      - 'scripts/geospatial/inspect_indiana_dem_export.py'
      - 'tests/geospatial/test_inspect_indiana_dem_export.py'
      - 'docs/geospatial/DEM-ACQUISITION-DATUM-EVIDENCE.md'
      - '.github/workflows/indiana-dem-export-integrity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-elevation-exports:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install raster validator
        run: python -m pip install 'numpy==2.3.4' 'rasterio==1.5.0' 'requests==2.32.5'
      - name: Compile and test raster byte/header/CRS/NoData contract
        run: |
          python -m py_compile scripts/geospatial/acquire_indiana_dem_tiles.py scripts/geospatial/inspect_indiana_dem_export.py
          python -m unittest discover -s tests/geospatial -p test_inspect_indiana_dem_export.py -v
