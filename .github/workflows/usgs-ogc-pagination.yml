name: USGS OGC v1 Pagination & Evidence Contract
on:
  pull_request:
    paths:
      - packages/government/src/adapters/UsgsOgcV1Adapter.ts
      - tests/contracts/usgs-ogc-v1-adapter.test.ts
      - scripts/flood-forecasting/run_all.py
      - scripts/flood-forecasting/tests/test_flood_alert_thresholds.py
      - .github/workflows/usgs-ogc-pagination.yml
  push:
    branches: [main]
    paths:
      - packages/government/src/adapters/UsgsOgcV1Adapter.ts
      - tests/contracts/usgs-ogc-v1-adapter.test.ts
      - scripts/flood-forecasting/run_all.py
      - scripts/flood-forecasting/tests/test_flood_alert_thresholds.py
      - .github/workflows/usgs-ogc-pagination.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paginated-observations:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install pinned root dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
      - name: Test station identity, paging, no partial data and provenance
        run: ./node_modules/.bin/tsx --test tests/contracts/usgs-ogc-v1-adapter.test.ts
      - name: Test station-specific threshold isolation
        run: python3 -m unittest discover -s scripts/flood-forecasting/tests -p 'test_flood_alert_thresholds.py' -v
