name: Posey Government Source and nDHM Candidate QA

on:
  pull_request:
    paths:
      - "scripts/geospatial/audit_igio_ndhm_gap_candidates.py"
      - "scripts/geospatial/test_audit_igio_ndhm_gap_candidates.py"
      - "scripts/geospatial/test_government_source_crosswalk.py"
      - "data/registries/government_source_crosswalk_2026-10-26.json"
      - "docs/evidence/GOVERNMENT-AGENCY-SOURCE-GAP-REVIEW-2026-10-26.md"
      - ".github/workflows/posey-source-and-ndhm-qa.yml"
  push:
    branches: [main]
    paths:
      - "scripts/geospatial/audit_igio_ndhm_gap_candidates.py"
      - "scripts/geospatial/test_audit_igio_ndhm_gap_candidates.py"
      - "scripts/geospatial/test_government_source_crosswalk.py"
      - "data/registries/government_source_crosswalk_2026-10-26.json"
      - ".github/workflows/posey-source-and-ndhm-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  private-evidence-boundaries:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Validate source crosswalk public privacy contract
        run: python3 scripts/geospatial/test_government_source_crosswalk.py -v
      - name: Install deterministic geospatial test dependencies
        run: python3 -m pip install --disable-pip-version-check --no-input --no-cache-dir "numpy==2.1.3" "rasterio==1.4.3" "shapely==2.0.6" "pyproj==3.8.0"
      - name: Parse and test bounded nDHM candidate extraction
        run: |
          python3 -m py_compile scripts/geospatial/audit_igio_ndhm_gap_candidates.py scripts/geospatial/test_audit_igio_ndhm_gap_candidates.py
          python3 scripts/geospatial/test_audit_igio_ndhm_gap_candidates.py -v
