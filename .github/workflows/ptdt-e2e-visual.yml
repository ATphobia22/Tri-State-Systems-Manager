name: PTDT v35 E2E & Visual Regression

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ptdt-e2e-visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-headed-visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: tsm-console

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install Python geospatial dependencies
        run: python -m pip install --disable-pip-version-check --no-input --no-cache-dir "numpy==2.1.3"

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tsm-console/package-lock.json

      - name: Pin npm CLI
        run: npm install --global npm@10.9.2 --no-audit --no-fund

      - name: Verify Node and npm versions
        run: |
          test "$(node --version | cut -d. -f1)" = "v22"
          test "$(npm --version)" = "10.9.2"

      - name: Install locked application dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org

      - name: Parse gate
        run: npm run check:parse

      - name: Typecheck
        run: npm run check:type

      - name: Detect Cypress configuration and specs
        id: cypress
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f cypress.config.ts && ! -f cypress.config.js ]]; then
            echo 'Cypress configuration is absent; this workflow requires a configured E2E suite.' >&2
            exit 1
          fi
          spec_count="$(find cypress/e2e -type f \( -name '*.cy.js' -o -name '*.cy.ts' \) -print | wc -l)"
          if [[ "$spec_count" -lt 1 ]]; then
            echo 'Cypress configuration exists but no E2E specs were found under cypress/e2e.' >&2
            exit 1
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"
          echo "spec_count=$spec_count" >> "$GITHUB_OUTPUT"
          echo "Cypress configuration validated with $spec_count E2E spec(s)."

      - name: Install pinned Cypress runtime
        if: ${{ steps.cypress.outputs.configured == 'true' }}
        run: |
          set -euo pipefail
          npx --no-install cypress install
          npx --no-install cypress verify
          npx --no-install cypress info
          command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser

      - name: Validate committed 3D Tiles payload
        shell: bash
        run: |
          set -euo pipefail
          test -f public/3d-tiles/tileset.json || (echo "Missing tileset.json" && exit 1)
          test -f public/3d-tiles/buildings-3d.json || (echo "Missing buildings-3d.json" && exit 1)
          echo "3D Tiles artifacts present"
      - name: Build production application for browser validation
        if: ${{ steps.cypress.outputs.configured == 'true' }}
        run: npm run build

      - name: Start production preview server
        if: ${{ steps.cypress.outputs.configured == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          nohup npm run preview -- --host 127.0.0.1 --port 5173 > /tmp/tsm-vite-preview.log 2>&1 &
          echo $! > /tmp/tsm-vite-preview.pid
          for attempt in {1..60}; do
            if curl --fail --silent --show-error http://127.0.0.1:5173/Tri-State-Systems-Manager/ >/dev/null; then
              echo 'Vite production preview is ready.'
              exit 0
            fi
            sleep 1
          done
          cat /tmp/tsm-vite-preview.log
          exit 1

      - name: Run headed Chrome visual E2E suite
        if: ${{ steps.cypress.outputs.configured == 'true' }}
        run: |
          set -euo pipefail
          command -v xvfb-run >/dev/null || { echo 'xvfb-run is required on the GitHub runner'; exit 1; }
          # Retry up to 3 times for flaky WebGL/GPU in CI
          for attempt in 1 2 3; do
            echo "=== Cypress attempt $attempt/3 ==="
            if CYPRESS_BASE_URL="http://127.0.0.1:5173/Tri-State-Systems-Manager/" \
              xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
              npx --no-install cypress run --browser chrome --headed \
                --config video=true,screenshotOnRunFailure=true \
                --config-file cypress.config.ts; then
              echo "Cypress passed on attempt $attempt"
              exit 0
            fi
            echo "Cypress failed on attempt $attempt"
            if [[ $attempt -lt 3 ]]; then
              echo "Waiting 30s before retry..."
              sleep 30
            fi
          done
          echo "Cypress failed after 3 attempts"
          exit 1

      - name: Upload Cypress failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cypress-headed-visual-evidence
          path: |
            tsm-console/cypress/snapshots/**/__diff_output__/**
            tsm-console/cypress/screenshots/**
            tsm-console/cypress/videos/**
            /tmp/tsm-vite-preview.log
          if-no-files-found: warn
          retention-days: 14

      - name: Stop preview server
        if: always()
        shell: bash
        run: |
          if [[ -f /tmp/tsm-vite-preview.pid ]]; then
            kill "$(cat /tmp/tsm-vite-preview.pid)" 2>/dev/null || true
          fi
