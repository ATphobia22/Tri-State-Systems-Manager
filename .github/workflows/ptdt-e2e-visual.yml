name: PTDT v35 E2E & Visual Regression

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ptdt-e2e-visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-headless:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tsm-console

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tsm-console/package-lock.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org

      - name: Parse gate
        run: npm run check:parse

      - name: Typecheck
        run: npm run check:type

      - name: Detect Cypress configuration
        id: cypress
        shell: bash
        run: |
          if [ -f cypress.config.ts ] || [ -f cypress.config.js ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache Cypress binary
        if: ${{ steps.cypress.outputs.configured == 'true' && hashFiles('tsm-console/package.json') != '' }}
        uses: actions/cache@v5
        with:
          path: ~/.cache/Cypress
          key: ${{ runner.os }}-cypress-${{ hashFiles('tsm-console/package-lock.json') }}
          restore-keys: ${{ runner.os }}-cypress-

      - name: Run E2E
        if: ${{ steps.cypress.outputs.configured == 'true' }}
        run: |
          if node -e "const p=require('./package.json'); process.exit(p.dependencies?.cypress || p.devDependencies?.cypress ? 0 : 1)"; then
            npx cypress run --browser chrome --headless --config video=false
          else
            echo 'Cypress configuration is present, but Cypress is not declared in package.json; E2E execution is skipped.'
          fi
        env:
          CYPRESS_allowInsecureLocalhost: true
          ELECTRON_ENABLE_LOGGING: "1"

      - name: Report E2E status
        if: ${{ steps.cypress.outputs.configured != 'true' }}
        run: echo 'No Cypress configuration present; parse/typecheck gates remain authoritative.'

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cypress-visual-diff
          path: |
            tsm-console/cypress/snapshots/**/__diff_output__/**
            tsm-console/cypress/screenshots/**
          if-no-files-found: ignore
          retention-days: 7
