name: Tri-State Systems Manager CI Pipeline

on:
  push:
    branches: [main, 'v*']
    paths:
      - 'tsm-console/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tsm-console/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tsm-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: tsm-console

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tsm-console/package-lock.json
          registry-url: https://registry.npmjs.org

      - name: Configure public npm registry
        run: npm config set registry https://registry.npmjs.org

      - name: Verify lockfile registry provenance
        run: |
          node <<'NODE'
          const fs = require('fs');
          const lockfile = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const violations = [];

          for (const [packagePath, metadata] of Object.entries(lockfile.packages ?? {})) {
            if (typeof metadata?.resolved !== 'string') continue;
            try {
              const url = new URL(metadata.resolved);
              if (url.hostname !== 'registry.npmjs.org') {
                violations.push(`${packagePath}: ${metadata.resolved}`);
              }
            } catch {
              violations.push(`${packagePath}: invalid resolved URL ${metadata.resolved}`);
            }
          }

          if (violations.length > 0) {
            console.error('ERROR: package-lock.json contains resolved package URLs outside registry.npmjs.org.');
            for (const violation of violations.slice(0, 20)) console.error(violation);
            process.exit(1);
          }

          console.log('Lockfile provenance check passed: all resolved package URLs use registry.npmjs.org.');
          NODE

      - name: Verify lockfile reproducibility
        run: |
          cp package-lock.json /tmp/tsm-package-lock.before.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
          diff -u /tmp/tsm-package-lock.before.json package-lock.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org

      - name: Parse gate
        run: npm run check:parse

      - name: Repository integrity gate
        run: npm run check:integrity

      - name: Typecheck
        run: npm run check:type

      - name: Test suites
        run: npm run test:all

      - name: Production build
        run: npm run build

      - name: Upload production artifact
        uses: actions/upload-artifact@v4
        with:
          name: tsm-console-dist
          path: tsm-console/dist
          if-no-files-found: error
