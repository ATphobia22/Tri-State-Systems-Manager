name: Tri-State Systems Manager CI Pipeline

on:
  push:
    branches: [main, 'v*']
    paths:
      - 'tsm-console/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tsm-console/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tsm-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: tsm-console

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tsm-console/package-lock.json
          registry-url: https://registry.npmjs.org

      - name: Configure public npm registry
        run: npm config set registry https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify exact commit binding
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          actual_sha="$(git rev-parse HEAD)"
          expected_sha="${GITHUB_SHA}"
          branch_sha="$(git rev-parse refs/remotes/origin/main)"

          test "$actual_sha" = "$expected_sha" || {
            echo "ERROR: checkout SHA $actual_sha does not match GITHUB_SHA $expected_sha" >&2
            exit 1
          }

          test "$actual_sha" = "$branch_sha" || {
            echo "ERROR: checkout SHA $actual_sha does not match origin/main $branch_sha" >&2
            exit 1
          }

          echo "Exact main commit verified: $actual_sha"

      - name: Repository integrity gate
        run: npm run check:integrity

      - name: Geospatial processing contract gate
        run: npm run check:geospatial

      - name: Parse gate
        run: npm run check:parse

      - name: Typecheck
        run: npm run check:type

      - name: Production build
        run: npm run build

      - name: Test suites
        run: npm run test:all

      - name: Upload production artifact
        uses: actions/upload-artifact@v4
        with:
          name: tsm-console-dist
          path: tsm-console/dist
          if-no-files-found: error
