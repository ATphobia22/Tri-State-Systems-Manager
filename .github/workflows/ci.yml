name: Tri-State Systems Manager CI Pipeline

on:
  push:
    branches: [main, 'v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tsm-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      id-token: write
      attestations: write
    defaults:
      run:
        working-directory: tsm-console
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tsm-console/package-lock.json
          registry-url: https://registry.npmjs.org
      - name: Pin npm CLI
        run: npm install --global npm@10.9.2 --no-audit --no-fund
      - name: Verify Node and npm versions
        run: |
          test "$(node --version | cut -d. -f1)" = "v22"
          test "$(npm --version)" = "10.9.2"
      - name: Configure public npm registry
        run: npm config set registry https://registry.npmjs.org
      - name: Install dependencies from lockfile
        run: npm ci --no-audit --no-fund
      - name: Dependency integrity gate
        run: npm run check:dependency-integrity
      - name: npx supply-chain policy gate
        run: npm run check:npx-policy
      - name: Generate SBOM and software provenance
        env:
          GITHUB_SHA: ${{ github.sha }}
          TSM_ARTIFACT_DIR: artifacts
        run: npm run generate:sbom
      - name: npm audit gate
        run: |
          set +e
          npm audit --audit-level=high --json > artifacts/npm-audit.json
          status=$?
          set -e
          cat artifacts/npm-audit.json
          exit "$status"
      - name: npm audit signatures evidence and gate
        run: |
          set +e
          npm audit signatures --json > artifacts/npm-audit-signatures.json
          status=$?
          set -e
          cat artifacts/npm-audit-signatures.json
          node -e "const fs=require('fs'); const r=JSON.parse(fs.readFileSync('artifacts/npm-audit-signatures.json','utf8')); const invalid=Array.isArray(r.invalid)?r.invalid.length:0; const missing=Array.isArray(r.missing)?r.missing.length:0; if(invalid||missing||(${status})!==0){console.error(JSON.stringify({invalid,missing,command_exit:${status}})); process.exit(1)}"
      - name: Verify exact commit binding
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: .
        run: |
          git fetch origin main --depth=1
          actual_sha="$(git rev-parse HEAD)"
          expected_sha="${GITHUB_SHA}"
          branch_sha="$(git rev-parse FETCH_HEAD)"
          if [ "$actual_sha" != "$expected_sha" ] || [ "$actual_sha" != "$branch_sha" ]; then
            echo "Commit mismatch detected!"; echo "HEAD: $actual_sha"; echo "GITHUB_SHA: $expected_sha"; echo "FETCH_HEAD: $branch_sha"; exit 1
          fi
          echo "Exact main commit verified: $actual_sha"
      - name: Capability registry gate
        run: npm run check:capabilities
      - name: Workflow security boundary gate
        run: npm run check:workflow-boundaries
      - name: Shell safety gate
        run: npm run check:shell-safety
      - name: 3D artifact contract gate
        run: npm run check:artifacts
      - name: Quantum isolation gate
        run: npm run check:quantum-boundary
      - name: Repository integrity gate
        run: npm run check:integrity
      - name: Site consistency gate
        run: npm run check:site-consistency
      - name: Geospatial processing contract gate
        run: npm run check:geospatial
      - name: Authoritative source and production-data gate
        run: npm run check:mock-data
      - name: Parse gate
        run: npm run check:parse
      - name: Typecheck
        run: npm run check:type
      - name: Production build
        run: npm run build
      - name: Test suites
        run: npm run test:all
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend engineering dependencies
        working-directory: .
        run: python -m pip install --upgrade pip && python -m pip install -r backend/requirements.txt
      - name: Backend engineering primitive tests
        working-directory: .
        run: python -m unittest backend.engineering.test_engineering_primitives -v
      - name: Validate Alertmanager configuration
        working-directory: .
        run: |
          docker run --rm \
            --entrypoint=/bin/amtool \
            -v "$PWD/ops/alertmanager:/config:ro" \
            prom/alertmanager:v0.34.0@sha256:690c7b525f4367aa91f73e2f91c632206d32e97c6384bdbf2fb7a861b420340d \
            check-config /config/alertmanager.yml --enable-feature=utf8-strict-mode
      - name: Validate Prometheus configuration when present
        working-directory: .
        run: |
          if [ -f ops/prometheus/prometheus.yml ]; then
            docker run --rm \
              --entrypoint=/bin/promtool \
              -v "$PWD/ops/prometheus:/config:ro" \
              prom/prometheus:v3.14.0@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0 \
              check config /config/prometheus.yml
          else
            echo 'No Prometheus runtime configuration committed; exporter contract remains application-owned.'
          fi
      - name: Package production artifact for attestation
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: tar -czf artifacts/tsm-console-dist.tar.gz -C dist .
      - name: Generate GitHub artifact and SBOM attestation
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest@v4
        with:
          subject-path: tsm-console/artifacts/tsm-console-dist.tar.gz
          sbom-path: tsm-console/artifacts/tsm-console-sbom.json
      - name: Upload reliability and supply-chain evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tsm-reliability-evidence
          path: tsm-console/artifacts
          if-no-files-found: warn
      - name: Upload production artifact
        uses: actions/upload-artifact@v7
        with:
          name: tsm-console-dist
          path: tsm-console/dist
          if-no-files-found: error
