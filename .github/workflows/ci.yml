name: Tri-State Systems Manager CI Pipeline

on:
  push:
    branches: [main, 'v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tsm-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    defaults:
      run:
        working-directory: tsm-console
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tsm-console/package-lock.json
          registry-url: https://registry.npmjs.org
      - name: Pin npm CLI
        run: npm install --global npm@10.9.2 --no-audit --no-fund
      - name: Verify Node and npm versions
        run: |
          test "$(node --version | cut -d. -f1)" = "v22"
          test "$(npm --version)" = "10.9.2"
      - name: Configure public npm registry
        run: npm config set registry https://registry.npmjs.org
      - name: Install dependencies from lockfile
        run: npm ci --no-audit --no-fund
      - name: Dependency integrity gate
        run: npm run check:dependency-integrity
      - name: npx supply-chain policy gate
        run: npm run check:npx-policy
      - name: Generate SBOM and software provenance
        env:
          GITHUB_SHA: ${{ github.sha }}
          TSM_ARTIFACT_DIR: artifacts
        run: npm run generate:sbom
      - name: npm audit gate
        run: |
          set +e
          npm audit --audit-level=high --json > artifacts/npm-audit.json
          status=$?
          set -e
          cat artifacts/npm-audit.json
          exit "$status"
      - name: npm audit signatures evidence and gate
        run: |
          set +e
          npm audit signatures --json > artifacts/npm-audit-signatures.json
          status=$?
          set -e
          cat artifacts/npm-audit-signatures.json
          node -e "const fs=require('fs'); const r=JSON.parse(fs.readFileSync('artifacts/npm-audit-signatures.json','utf8')); const invalid=Array.isArray(r.invalid)?r.invalid.length:0; const missing=Array.isArray(r.missing)?r.missing.length:0; const commandExit=${status}; if(invalid || (commandExit!==0 && missing===0)){console.error(JSON.stringify({invalid,missing,command_exit:commandExit})); process.exit(1)}; console.log(JSON.stringify({invalid,missing,command_exit:commandExit,note:missing?'missing attestations are recorded as evidence; invalid signatures remain fail-closed':'all checked signatures valid'}))"
      - name: Verify exact commit binding
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: .
        run: |
          actual_sha="$(git rev-parse HEAD)"
          expected_sha="${GITHUB_SHA}"
          if [ "$actual_sha" != "$expected_sha" ]; then
            echo "Commit mismatch detected!"
            echo "HEAD: $actual_sha"
            echo "GITHUB_SHA: $expected_sha"
            exit 1
          fi
          echo "Exact workflow commit verified: $actual_sha"
      - name: Canonical repository CI gate
        # Keep the workflow aligned with the checked-in CI contract so newly
        # added fail-closed gates (government sources, live fabric, regulatory
        # rules, schemas, build, and bundle-secret checks) cannot silently
        # drift out of GitHub Actions.
        run: npm run ci
      - name: Community engineering boundary gate
        working-directory: .
        run: node scripts/ci/validate-community-engineering-boundaries.mjs
      - name: Reprojection script syntax gate
        working-directory: .
        run: bash -n scripts/reproject_tri_state.sh
      - name: V35.1 strict contract typecheck
        run: npm run check:v35.1
      - name: V35.1 contract tests
        run: npm run test:v35.1
      - name: V35.1 deterministic evidence manifest
        run: |
          mkdir -p artifacts/v35.1
          npm run sign:evidence -- --output artifacts/v35.1/evidence-manifest.json package.json package-lock.json
      - name: Hydrologic ingestion smoke
        run: npm run ingest
      - name: Test suites
        run: npm run test:all
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Detached Ed25519 signer verification
        run: npm run test:evidence-signer
      - name: Signed LOMA packet integration verification
        run: npm run test:loma-signing
      - name: V35.1 deterministic LOMA packet
        run: |
          mkdir -p artifacts/v35.1
          python3 ../tools/build_loma_packet.py --output artifacts/v35.1/loma-evidence.zip package.json package-lock.json
      - name: Install backend engineering dependencies
        working-directory: .
        run: python -m pip install --upgrade pip && python -m pip install -r backend/requirements.txt
      - name: Geospatial Python syntax and CLI gate
        working-directory: .
        run: |
          python -m py_compile tools/geospatial/indiana_elevation.py tools/geospatial/test_indiana_elevation.py tools/validation/validate_fema_panels.py
          python tools/geospatial/indiana_elevation.py --help >/dev/null
          python -m unittest discover -s tools/geospatial -p 'test_*.py' -v
      - name: Backend engineering primitive tests
        working-directory: .
        run: python -m unittest backend.engineering.test_engineering_primitives -v
      - name: OpenMI protobuf/gRPC bridge contract tests
        working-directory: .
        run: python -m unittest backend.test_openmi_service -v
      - name: Posey County WTHGIS source adapter tests
        working-directory: .
        run: python -m unittest backend.test_posey_wthgis -v
      - name: CountyGISMaps Posey source adapter tests
        working-directory: .
        run: python -m unittest backend.test_countygismaps_posey -v
      - name: Secondary Posey GIS source manifest tests
        working-directory: .
        run: python -m unittest backend.test_secondary_posey_sources -v
      - name: Indiana statewide elevation catalog tests
        working-directory: .
        run: python -m unittest backend.test_indiana_elevation_catalog backend.test_open_data_registry -v
      - name: Validate Alertmanager configuration
        working-directory: .
        run: |
          docker run --rm \
            --entrypoint=/bin/amtool \
            -v "$PWD/ops/alertmanager:/config:ro" \
            prom/alertmanager:v0.34.0@sha256:690c7b525f4367aa91f73e2f91c632206d32e97c6384bdbf2fb7a861b420340d \
            check-config /config/alertmanager.yml --enable-feature=utf8-strict-mode
      - name: Validate Prometheus configuration when present
        working-directory: .
        run: |
          if [ -f ops/prometheus/prometheus.yml ]; then
            docker run --rm \
              --entrypoint=/bin/promtool \
              -v "$PWD/ops/prometheus:/config:ro" \
              prom/prometheus:v3.14.0@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0 \
              check config /config/prometheus.yml
          else
            echo 'No Prometheus runtime configuration committed; exporter contract remains application-owned.'
          fi
      - name: Validate Prometheus alerting rules
        working-directory: .
        run: |
          docker run --rm \
            --entrypoint=/bin/promtool \
            -v "$PWD/ops/prometheus:/config:ro" \
            prom/prometheus:v3.14.0@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0 \
            check rules /config/rules/tsm-hydrologic-alerts.yml

      - name: Validate spatial topology contract
        working-directory: .
        run: node scripts/ci/validate-spatial-topology.mjs

      - name: Package production artifact for attestation
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: tar -czf artifacts/tsm-console-dist.tar.gz -C dist .
      - name: Upload reliability and supply-chain evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tsm-reliability-evidence
          path: tsm-console/artifacts
          if-no-files-found: warn
      - name: Upload production artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tsm-console-dist
          path: tsm-console/dist
          if-no-files-found: error


  attest:
    name: Attest production artifact
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download reliability and supply-chain evidence
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: tsm-reliability-evidence
          path: attestation-input
      - name: Verify attestation subjects exist
        shell: bash
        run: |
          set -euo pipefail
          test -s attestation-input/tsm-console-dist.tar.gz
          test -s attestation-input/tsm-console-sbom.json
      - name: Generate GitHub artifact and SBOM attestation
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: attestation-input/tsm-console-dist.tar.gz
          sbom-path: attestation-input/tsm-console-sbom.json
          create-storage-record: false