name: TSM Posey Geospatial Assets

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tsm-console/scripts/geospatial/**'
      - 'tsm-console/src/geospatial/**'
      - 'tsm-console/data/manifests/posey-2020-site-assets.json'
      - 'tsm-console/package.json'
      - 'tsm-console/package-lock.json'
      - '.github/workflows/posey-geospatial-assets.yml'

permissions:
  contents: read

concurrency:
  group: posey-geospatial-assets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  materialize-validate:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: tsm-console
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tsm-console/package-lock.json
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
      # 1024px is validated against di-ingov ImageServer; 2048px exports have produced gateway 504s.
      - run: npm run geospatial:fetch -- --width 1024 --height 1024
      - run: npm run geospatial:validate
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: posey-2020-geospatial-assets-${{ github.sha }}
          path: tsm-console/data/geospatial/cache/posey-2020/
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
