name: Railway Deployment Event Probe

on:
  deployment_status:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Railway deployment metadata
        env:
          EVENT: ${{ toJSON(github.event) }}
        run: |
          node <<'NODE'
          const event = JSON.parse(process.env.EVENT);
          const deployment = event.deployment || {};
          const status = event.deployment_status || {};
          const payload = deployment.payload || {};
          console.log(JSON.stringify({
            status: status.state || null,
            environment: deployment.environment || null,
            ref: deployment.ref || null,
            sha: deployment.sha || null,
            description: deployment.description || null,
            payload_keys: Object.keys(payload),
            payload_service_id: payload.serviceId || payload.service_id || payload.service?.id || null,
            payload_service_name: payload.serviceName || payload.service_name || payload.service?.name || null,
            payload_project_id: payload.projectId || payload.project_id || payload.project?.id || null,
          }, null, 2));
          NODE
