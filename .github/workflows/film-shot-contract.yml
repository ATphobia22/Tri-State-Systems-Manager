name: Film shot contract gate
on:
  pull_request:
    paths:
      - 'data/cinematic/film-shot-plan.v1.json'
      - 'scripts/cinema/validate_film_shots.py'
      - 'scripts/cinema/test_validate_film_shots.py'
      - '.github/workflows/film-shot-contract.yml'
  push:
    branches: [main]
    paths:
      - 'data/cinematic/film-shot-plan.v1.json'
      - 'scripts/cinema/validate_film_shots.py'
      - 'scripts/cinema/test_validate_film_shots.py'
      - '.github/workflows/film-shot-contract.yml'
permissions:
  contents: read
jobs:
  film-shot-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Validate six evidence-gated scenes
        run: |
          python scripts/cinema/validate_film_shots.py
          python -m unittest discover -s scripts/cinema -p 'test_validate_film_shots.py' -v
