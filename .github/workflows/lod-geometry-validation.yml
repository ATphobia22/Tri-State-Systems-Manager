name: LoD geometry diagnostics
on:
  pull_request:
    paths:
      - 'native/archimedes/**'
      - 'scripts/geospatial/validate_lod_alignment.py'
      - 'tests/test_lod_alignment.py'
      - 'tsm-native/Source/TSMNative/TSMSpatialValidator.*'
      - '.github/workflows/lod-geometry-validation.yml'
  push:
    branches: [main]
    paths:
      - 'native/archimedes/**'
      - 'scripts/geospatial/validate_lod_alignment.py'
      - 'tests/test_lod_alignment.py'
      - 'tsm-native/Source/TSMNative/TSMSpatialValidator.*'
      - '.github/workflows/lod-geometry-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  numerical-diagnostics:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install diagnostic dependencies
        run: python -m pip install numpy==2.3.5 rasterio==1.4.3
      - name: Test real affine, nodata, datum and GeoTIFF boundaries
        run: python -m unittest discover -s tests -p test_lod_alignment.py -v
      - name: Configure portable geometry and existing engineering core
        run: cmake -S native/archimedes -B build/lod-diagnostics -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/lod-diagnostics --config Release --parallel
      - name: Test portable geometry and existing engineering core
        run: ctest --test-dir build/lod-diagnostics -C Release --output-on-failure
