name: TSM Production Build & Pages Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  NPM_REGISTRY: https://registry.npmjs.org
  CONSOLE_DIR: tsm-console

jobs:
  build:
    name: Verify and build production console
    runs-on: ubuntu-24.04
    env:
      VITE_TSM_API_BASE_URL: ${{ vars.VITE_TSM_API_BASE_URL }}
    steps:
      - name: Validate public API binding
        if: vars.TSM_PAGES_ENABLED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${VITE_TSM_API_BASE_URL}" ]] || { echo 'Missing VITE_TSM_API_BASE_URL repository variable for live production data.' >&2; exit 1; }
          [[ "${VITE_TSM_API_BASE_URL}" == https://* ]] || { echo 'VITE_TSM_API_BASE_URL must use HTTPS for production Pages deployments.' >&2; exit 1; }
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: ${{ env.NPM_REGISTRY }}
          cache: npm
          cache-dependency-path: ${{ env.CONSOLE_DIR }}/package-lock.json
      - name: Configure public npm registry
        working-directory: ${{ env.CONSOLE_DIR }}
        run: npm config set registry ${{ env.NPM_REGISTRY }}
      - name: Verify lockfile registry provenance
        working-directory: ${{ env.CONSOLE_DIR }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const lockfile = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const violations = [];
          for (const [packagePath, metadata] of Object.entries(lockfile.packages ?? {})) {
            if (typeof metadata?.resolved !== 'string') continue;
            try { const url = new URL(metadata.resolved); if (url.hostname !== 'registry.npmjs.org') violations.push(`${packagePath}: ${metadata.resolved}`); }
            catch { violations.push(`${packagePath}: invalid resolved URL ${metadata.resolved}`); }
          }
          if (violations.length) { console.error('ERROR: package-lock.json contains non-public resolved package URLs.'); for (const violation of violations.slice(0, 20)) console.error(violation); process.exit(1); }
          console.log('Lockfile provenance check passed.');
          NODE
      - name: Verify lockfile reproducibility
        working-directory: ${{ env.CONSOLE_DIR }}
        run: |
          cp package-lock.json package-lock.json.ci-baseline
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --registry=${{ env.NPM_REGISTRY }}
          diff -u package-lock.json.ci-baseline package-lock.json
          rm package-lock.json.ci-baseline
      - name: Install locked dependencies
        working-directory: ${{ env.CONSOLE_DIR }}
        run: npm ci --ignore-scripts --no-audit --no-fund --registry=${{ env.NPM_REGISTRY }}
      - name: Repository integrity gate
        working-directory: ${{ env.CONSOLE_DIR }}
        run: npm run check:integrity
      - name: Parse gate
        working-directory: ${{ env.CONSOLE_DIR }}
        run: npm run check:parse
      - name: TypeScript gate
        working-directory: ${{ env.CONSOLE_DIR }}
        run: npm run check:type
      - name: Test suite
        working-directory: ${{ env.CONSOLE_DIR }}
        run: npm run test:all
      - name: Production Vite build
        working-directory: ${{ env.CONSOLE_DIR }}
        run: npm run build
      - name: Prepare GitHub Pages SPA fallback
        if: vars.TSM_PAGES_ENABLED == 'true'
        working-directory: ${{ env.CONSOLE_DIR }}
        run: cp dist/index.html dist/404.html

      - name: Validate production artifact
        working-directory: ${{ env.CONSOLE_DIR }}
        run: |
          test -f dist/index.html
          if [[ "${{ vars.TSM_PAGES_ENABLED }}" == "true" ]]; then
            test -f dist/404.html
          fi
      - name: Upload production artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tsm-console-production
          path: ${{ env.CONSOLE_DIR }}/dist
          if-no-files-found: error
      - name: Configure GitHub Pages when repository Pages is enabled
        if: vars.TSM_PAGES_ENABLED == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload Pages artifact when repository Pages is enabled
        if: vars.TSM_PAGES_ENABLED == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ env.CONSOLE_DIR }}/dist

  deploy:
    name: Deploy production console
    needs: build
    if: vars.TSM_PAGES_ENABLED == 'true'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
