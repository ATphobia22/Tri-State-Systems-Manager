name: TSM Production Build & Pages Deploy
# Local-first production deployment: API connectivity is optional.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_pages:
        description: "Run the GitHub Pages deployment after production verification"
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-${{ github.sha }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  NPM_REGISTRY: https://registry.npmjs.org
  CONSOLE_DIR: tsm-console
  VITE_PAGES_BASE_PATH: /Tri-State-Systems-Manager/

jobs:
  build:
    name: Verify and build production console
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    env:
      # Optional production API origin (repository variable). The console is
      # local-first and deploys without it; when set it must be HTTPS.
      VITE_TSM_API_BASE_URL: ${{ vars.TSM_API_BASE_URL }}
      # NOTE: VITE_PAGES_BASE_PATH is inherited from workflow-level env automatically.
      # Do NOT re-declare it here as ${{ env.VITE_PAGES_BASE_PATH }} — a job-level
      # env entry that references itself fails GitHub's workflow validation and
      # kills the run before any job starts (observed 2026-09-30).
      # Production 3D terrain: Terrain-RGB tile pyramid committed under
      # tsm-console/public/terrain_3dep/ (Vite copies public/ to dist/) and served
      # by GitHub Pages. The fail-closed validator requires a real https:// URL
      # with {z}/{x}/{y} tokens — never a placeholder.
      VITE_TSM_TERRAIN_RGB_URL_TEMPLATE: https://atphobia22.github.io/Tri-State-Systems-Manager/terrain_3dep/{z}/{x}/{y}.png
      # Posey County parcel geometry for Digital Twin V2 (GeoJSON, EPSG:4326).
      VITE_POSEY_WTHGIS_GEOJSON_URL: https://atphobia22.github.io/Tri-State-Systems-Manager/data/posey-parcels.geojson
    permissions:
      contents: read
      pages: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Validate public API binding
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${VITE_TSM_API_BASE_URL}" ]]; then
            echo 'TSM_API_BASE_URL is not configured; the local-first console deploys without the API (live river data and login are disabled).'
          else
            [[ "${VITE_TSM_API_BASE_URL}" == https://* ]] || { echo 'VITE_TSM_API_BASE_URL must use HTTPS for production Pages deployments.' >&2; exit 1; }
          fi
          [[ "${VITE_TSM_TERRAIN_RGB_URL_TEMPLATE}" == https://* ]] || { echo 'VITE_TSM_TERRAIN_RGB_URL_TEMPLATE must use HTTPS.' >&2; exit 1; }
          case "${VITE_TSM_TERRAIN_RGB_URL_TEMPLATE}" in
            *'{z}'*'{'x'}'*'{'y'}'*) ;;
            *) echo 'VITE_TSM_TERRAIN_RGB_URL_TEMPLATE must contain {z}/{x}/{y} tokens.' >&2; exit 1 ;;
          esac
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate self-hosted CesiumJS and OGC 3D Tiles contract
        run: node scripts/ci/validate-self-hosted-cesium.mjs
      - name: Install pinned geospatial acquisition dependencies
        run: python3 -m pip install --disable-pip-version-check --no-input --no-cache-dir "numpy==2.1.3" "rasterio==1.4.3" "shapely==2.0.6" "laspy==2.6.1" "lazrs==0.7.0" "pyproj==3.8.0"
      - name: Acquire and elevation-join all Posey IGIO building footprints
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/tsm-igio
          python3 scripts/geospatial/acquire-and-enrich-igio-posey-buildings.py \
            --output /tmp/tsm-igio/posey-buildings-igio-enriched.geojson \
            --expected-count 23082
          test "$(python3 -c 'import json; print(len(json.load(open("/tmp/tsm-igio/posey-buildings-igio-enriched.geojson"))["features"]))')" = "23082"
          cp /tmp/tsm-igio/posey-buildings-igio-enriched.geojson tsm-console/public/data/posey-buildings-igio-enriched.geojson
          cp /tmp/tsm-igio/posey-buildings-igio-enriched.geojson.sha256 tsm-console/public/data/posey-buildings-igio-enriched.geojson.sha256
          cp /tmp/tsm-igio/posey-buildings-igio-enriched.geojson.receipt.json tsm-console/public/data/posey-buildings-igio-enriched.geojson.receipt.json

      - name: Acquire and validate Posey parcel snapshot
        shell: bash
        run: |
          set -euo pipefail
          rm -f tsm-console/public/data/posey-parcels.geojson tsm-console/public/data/posey-parcels.geojson.sha256
          python3 scripts/geospatial/acquire-posey-parcels.py             --out tsm-console/public/data/posey-parcels.geojson
          sha256sum tsm-console/public/data/posey-parcels.geojson             > tsm-console/public/data/posey-parcels.geojson.sha256
          test -s tsm-console/public/data/posey-parcels.geojson
          test -s tsm-console/public/data/posey-parcels.geojson.sha256
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("tsm-console/public/data/posey-parcels.geojson")
          payload = json.loads(p.read_text())
          assert payload["type"] == "FeatureCollection"
          assert payload["sourceCrs"] == "EPSG:4326"
          assert payload["humanReviewRequired"] is True
          assert payload["provisional"] is True
          assert payload["features"]
          print(f"Posey parcel snapshot validated: {len(payload['features'])} features")
          PY

      - name: Build deterministic Terrain-RGB MBTiles and 3D Tiles
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tsm-console/public/3d-tiles/terrain-3dep
          python3 scripts/geospatial/pack-terrain-mbtiles.py \
            --tile-dir tsm-console/public/terrain_3dep \
            --out /tmp/tsm-terrain-3dep.mbtiles
          python3 scripts/geospatial/build-terrain-3d-tiles.py \
            --mbtiles /tmp/tsm-terrain-3dep.mbtiles \
            --out-dir tsm-console/public/3d-tiles/terrain-3dep \
            --grid-size 33
          python3 scripts/geospatial/validate-terrain-3d-tiles.py \
            --tileset tsm-console/public/3d-tiles/terrain-3dep/tileset.json
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: ${{ env.NPM_REGISTRY }}
          cache: npm
          cache-dependency-path: ${{ env.CONSOLE_DIR }}/package-lock.json
      - name: Configure public npm registry
        working-directory: ${{ env.CONSOLE_DIR }}
        run: npm config set registry ${{ env.NPM_REGISTRY }}
      - name: Verify lockfile registry provenance
        working-directory: ${{ env.CONSOLE_DIR }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const lockfile = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const violations = [];
          for (const [packagePath, metadata] of Object.entries(lockfile.packages ?? {})) {
            if (typeof metadata?.resolved !== 'string') continue;
            try {
              const url = new URL(metadata.resolved);
              if (url.hostname !== 'registry.npmjs.org') violations.push(`${packagePath}: ${metadata.resolved}`);
            } catch {
              violations.push(`${packagePath}: invalid resolved URL ${metadata.resolved}`);
            }
          }
          if (violations.length) {
            console.error('ERROR: package-lock.json contains non-public resolved package URLs.');
            for (const violation of violations.slice(0, 20)) console.error(violation);
            process.exit(1);
          }
          console.log('Lockfile provenance check passed.');
          NODE
      - name: Verify lockfile reproducibility
        working-directory: ${{ env.CONSOLE_DIR }}
        run: |
          cp package-lock.json package-lock.json.ci-baseline
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --registry=${{ env.NPM_REGISTRY }}
          diff -u package-lock.json.ci-baseline package-lock.json
          rm package-lock.json.ci-baseline
      - name: Install locked dependencies
        working-directory: ${{ env.CONSOLE_DIR }}
        run: npm ci --ignore-scripts --no-audit --no-fund --registry=${{ env.NPM_REGISTRY }}
      - name: Vendor pinned CesiumJS static runtime
        run: node scripts/ci/install-cesium-static.mjs
      - name: Setup Node.js for geospatial tooling
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tsm-console/package-lock.json

      - name: Install locked dependencies for geospatial tooling
        working-directory: tsm-console
        run: npm ci --ignore-scripts

      - name: Install pinned CI tooling for geospatial build
        env:
          TSM_INSTALL_EXTERNAL_TOOLING: 'true'
        run: node scripts/ci/install-external-tooling.mjs

      - name: Build deterministic building 3D Tiles for Pages
        shell: bash
        run: |
          set -euo pipefail
          # Extract OBSERVED LiDAR heights (3DEP EPT Class 6)
          python3 scripts/geospatial/extract_lidar_heights.py --geojson /tmp/tsm-igio/posey-buildings-igio-enriched.geojson --out /tmp/tsm-igio/posey-buildings-lidar-enriched.geojson
          python3 - <<'PY'
          import json
          p="/tmp/tsm-igio/posey-buildings-lidar-enriched.geojson"
          f=json.load(open(p))["features"]
          ok=sum(1 for x in f if x.get("properties",{}).get("lidarHeightStatus")=="OK")
          print(f"OBSERVED heights (3DEP EPT Class 6): {ok}/23082")
          PY
          # Generate Indiana 2020 COPC tile list for gap buildings (DERIVED).
          # 5000-ft SPW tile grid; name encodes SW corner in thousands of feet
          # (e.g. IN2020_26850945_12 covers E 2,685,000-2,690,000 / N 945,000-950,000).
          python3 - <<'PY'
          import json
          from pyproj import Transformer
          t = Transformer.from_crs("EPSG:4326", "EPSG:2968", always_xy=True)
          base = "https://giselevationingov.s3.amazonaws.com/copc/statewide/2020/SPW/ql2"
          def tile_name(ex, ny):
              te = int(ex // 5000) * 5
              tn = int(ny // 5000) * 5
              return f"IN2020_{te:04d}{tn:04d}_12.copc.laz"
          feats = json.load(open("/tmp/tsm-igio/posey-buildings-lidar-enriched.geojson"))["features"]
          tiles = set()
          gaps = 0
          for ft in feats:
              if ft.get("properties", {}).get("lidarHeightStatus") == "OK":
                  continue
              gaps += 1
              g = ft["geometry"]
              coords = g["coordinates"][0] if g["type"] == "Polygon" else max((p[0] for p in g["coordinates"]), key=len)
              cx = sum(c[0] for c in coords) / len(coords)
              cy = sum(c[1] for c in coords) / len(coords)
              ex, ny = t.transform(cx, cy)
              sw_e, sw_n = int(ex // 5000) * 5000, int(ny // 5000) * 5000
              for dx, dy in [(0, 0), (5000, 0), (-5000, 0), (0, 5000), (0, -5000)]:
                  if dx > 0 and (sw_e + 5000) - ex > 60:
                      continue
                  if dx < 0 and ex - sw_e > 60:
                      continue
                  if dy > 0 and (sw_n + 5000) - ny > 60:
                      continue
                  if dy < 0 and ny - sw_n > 60:
                      continue
                  tiles.add(tile_name(ex + dx, ny + dy))
          urls = sorted(f"{base}/{tn}" for tn in tiles)
          with open("/tmp/tsm-igio/copc-tile-list.txt", "w") as f:
              f.write("# Indiana 2020 COPC tiles covering gap-building centroids\n")
              for u in urls:
                  f.write(u + "\n")
          print(f"Gap buildings: {gaps}, COPC tiles: {len(urls)}")
          PY
          # Extract DERIVED heights from Indiana 2020 COPC (footprint-clipped Class 1)
          mkdir -p /tmp/tsm-igio/copc-tiles
          python3 scripts/geospatial/extract_derived_heights_copc.py \
            --geojson /tmp/tsm-igio/posey-buildings-lidar-enriched.geojson \
            --tile-list /tmp/tsm-igio/copc-tile-list.txt \
            --tile-dir /tmp/tsm-igio/copc-tiles \
            --out /tmp/tsm-igio/posey-buildings-height-merged.geojson \
            --tile-manifest /tmp/tsm-igio/copc-tile-manifest.json
          # FAIL-CLOSED gate: 23,082 source == 23,082 height-linked (OBSERVED + DERIVED)
          python3 - <<'PY'
          import json, sys
          p="/tmp/tsm-igio/posey-buildings-height-merged.geojson"
          d=json.load(open(p)); f=d["features"]
          if len(f) != 23082:
              raise SystemExit(f"FAIL-CLOSED: feature count {len(f)} != 23082")
          ok=[x for x in f if x.get("properties",{}).get("lidarHeightStatus")=="OK"]
          obs=sum(1 for x in ok if x["properties"].get("heightProvenance")=="OBSERVED")
          der=sum(1 for x in ok if x["properties"].get("heightProvenance")=="DERIVED")
          print(f"Height-linked: {len(ok)}/23082 ({obs} OBSERVED [3DEP EPT Class 6] + {der} DERIVED [2020 COPC Class 1])")
          if len(ok) != 23082:
              raise SystemExit(f"FAIL-CLOSED: {23082-len(ok)} buildings lack heights; 23,082 acceptance NOT met")
          print("ACCEPTANCE MET: 23,082/23,082 height-linked")
          PY
          mv /tmp/tsm-igio/posey-buildings-height-merged.geojson /tmp/tsm-igio/posey-buildings-lidar-authoritative.geojson
          # Build 3D tiles from the full 23,082 OBSERVED+DERIVED height-linked set
          EXPECTED_BUILDINGS=23082 HLOD_MAX_ITEMS=50 HLOD_MAX_DEPTH=6 bash scripts/geospatial/build-building-3d-tiles-pipeline.sh /tmp/tsm-buildings /tmp/tsm-igio/posey-buildings-lidar-authoritative.geojson
          rm -rf tsm-console/public/3d-tiles/buildings
          mkdir -p tsm-console/public/3d-tiles/buildings
          cp -R /tmp/tsm-buildings/compressed/. tsm-console/public/3d-tiles/buildings/
          python3 scripts/geospatial/validate-building-3d-tiles.py --tileset tsm-console/public/3d-tiles/buildings/tileset.json --tiles-dir tsm-console/public/3d-tiles/buildings --expected-buildings 23082 --require-draco --strict-hlod


      - name: Repository integrity gate
        working-directory: ${{ env.CONSOLE_DIR }}
        run: npm run check:integrity
      - name: Parse gate
        working-directory: ${{ env.CONSOLE_DIR }}
        run: npm run check:parse
      - name: TypeScript gate
        working-directory: ${{ env.CONSOLE_DIR }}
        run: npm run check:type
      - name: Test suite
        working-directory: ${{ env.CONSOLE_DIR }}
        run: npm run test:all
      - name: Production Vite build
        working-directory: ${{ env.CONSOLE_DIR }}
        run: npm run build
      - name: Validate built 3D Tiles payload
        run: |
          set -euo pipefail
          python3 scripts/geospatial/validate-terrain-3d-tiles.py \
            --tileset tsm-console/dist/3d-tiles/terrain-3dep/tileset.json
          python3 scripts/geospatial/validate-building-3d-tiles.py \
            --tileset tsm-console/dist/3d-tiles/buildings/tileset.json \
            --tiles-dir tsm-console/dist/3d-tiles/buildings \
            --expected-buildings 23082 --require-draco --strict-hlod

      - name: Package and hash building 3D Tiles artifact
        shell: bash
        run: bash scripts/geospatial/package-building-3d-tiles.sh /tmp/tsm-buildings/compressed /tmp/tsm-building-artifacts v1 "$GITHUB_SHA"
      - name: Upload verified building 3D Tiles artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: tsm-buildings-3d-tiles-${{ github.sha }}
          path: |
            /tmp/tsm-building-artifacts/*.zip
            /tmp/tsm-building-artifacts/*.zip.sha256
          retention-days: 90
          compression-level: 0
          if-no-files-found: error

      - name: Package and hash 3D Tiles artifact
        shell: bash
        run: |
          set -euo pipefail
          cd tsm-console/dist
          zip -qr /tmp/tsm-terrain-3d-tiles.zip 3d-tiles/terrain-3dep
          sha256sum /tmp/tsm-terrain-3d-tiles.zip > /tmp/tsm-terrain-3d-tiles.zip.sha256

      - name: Upload verified 3D Tiles artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tsm-terrain-3d-tiles
          path: |
            /tmp/tsm-terrain-3d-tiles.zip
            /tmp/tsm-terrain-3d-tiles.zip.sha256
          if-no-files-found: error

      - name: Prepare GitHub Pages SPA fallback
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.deploy_pages) || (github.event_name == 'issue_comment' && github.event.issue.pull_request == null && github.event.comment.body == '/deploy-pages' && github.event.comment.user.login == github.repository_owner) || (github.event_name == 'issues' && github.event.action == 'opened' && github.event.issue.pull_request == null && github.event.issue.title == 'TSM Pages deployment dispatch' && github.event.issue.body == 'DEPLOY_PAGES_REQUEST' && github.event.issue.user.login == github.repository_owner) }}
        working-directory: ${{ env.CONSOLE_DIR }}
        # rafgraph/spa-github-pages pattern: 404.html captures the deep-link
        # path into ?/path and redirects; public/spa-redirect.js (loaded by
        # index.html) restores it via history.replaceState before the router
        # boots. A bare `cp index.html 404.html` serves the shell but leaves
        # the router on the wrong path.
        run: node scripts/generate-spa-fallback.mjs --out dist/404.html --base "${{ env.VITE_PAGES_BASE_PATH }}"
      - name: Validate production artifact
        working-directory: ${{ env.CONSOLE_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -s dist/404.html
          test -s dist/spa-redirect.js
          test -f dist/manifest.json
          grep -Fq '/Tri-State-Systems-Manager/' dist/index.html
          grep -Fq '/Tri-State-Systems-Manager/' dist/404.html
          test -s dist/3d-tiles/terrain-3dep/tileset.json
          test -s dist/3d-tiles/terrain-3dep/SHA256SUMS
          test -s dist/3d-tiles/buildings/tileset.json
          test -s dist/3d-tiles/buildings/SHA256SUMS
          test -s dist/vendor/cesium/Cesium.js
          test -s dist/vendor/cesium/Widgets/widgets.css
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const html = fs.readFileSync('dist/index.html', 'utf8');
          const assets = [...html.matchAll(/(?:src|href)="([^"]+)"/g)]
            .map(([, value]) => value)
            .filter((value) => value.startsWith('/Tri-State-Systems-Manager/'));
          if (!assets.length) throw new Error('No Pages-base-path assets found in index.html');
          for (const asset of assets) {
            const relative = asset.replace('/Tri-State-Systems-Manager/', '');
            if (relative && !relative.includes('?') && !fs.existsSync(path.join('dist', relative))) {
              throw new Error('Missing production asset: ' + relative);
            }
          }
          console.log('Pages asset existence gate passed.');
          NODE
          echo 'Pages artifact gate passed.'

      - name: Upload production artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tsm-console-production
          path: ${{ env.CONSOLE_DIR }}/dist
          if-no-files-found: error
      - name: Configure GitHub Pages
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.deploy_pages) || (github.event_name == 'issue_comment' && github.event.issue.pull_request == null && github.event.comment.body == '/deploy-pages' && github.event.comment.user.login == github.repository_owner) || (github.event_name == 'issues' && github.event.action == 'opened' && github.event.issue.pull_request == null && github.event.issue.title == 'TSM Pages deployment dispatch' && github.event.issue.body == 'DEPLOY_PAGES_REQUEST' && github.event.issue.user.login == github.repository_owner) }}
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload Pages artifact when deployment is requested
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.deploy_pages) || (github.event_name == 'issue_comment' && github.event.issue.pull_request == null && github.event.comment.body == '/deploy-pages' && github.event.comment.user.login == github.repository_owner) || (github.event_name == 'issues' && github.event.action == 'opened' && github.event.issue.pull_request == null && github.event.issue.title == 'TSM Pages deployment dispatch' && github.event.issue.body == 'DEPLOY_PAGES_REQUEST' && github.event.issue.user.login == github.repository_owner) }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ env.CONSOLE_DIR }}/dist

  deploy:
    name: Deploy production console
    needs: build
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.deploy_pages) }}
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
      actions: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Verify published site
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          [[ -n "${PAGE_URL}" ]] || { echo 'deploy-pages did not return page_url.' >&2; exit 1; }
          curl --fail --silent --show-error --location --max-time 30 "${PAGE_URL}" --output /tmp/tsm-pages-response.html
          grep -Eiq '<title>[^<]+</title>' /tmp/tsm-pages-response.html
          echo "Published Pages endpoint responded successfully: ${PAGE_URL}"
          base="${PAGE_URL%/}/3d-tiles/terrain-3dep"
          curl --fail --silent --show-error --location --retry 8 --retry-all-errors --retry-delay 3 --max-time 60 "${base}/tileset.json" -o /tmp/published-tileset.json
          curl --fail --silent --show-error --location --retry 8 --retry-all-errors --retry-delay 3 --max-time 60 "${base}/SHA256SUMS" -o /tmp/published-SHA256SUMS
          building_base="${PAGE_URL%/}/3d-tiles/buildings"
          curl --fail --silent --show-error --location --retry 8 --retry-all-errors --retry-delay 3 --max-time 60 "${building_base}/tileset.json" -o /tmp/published-building-tileset.json
          curl --fail --silent --show-error --location --retry 8 --retry-all-errors --retry-delay 3 --max-time 60 "${building_base}/SHA256SUMS" -o /tmp/published-building-SHA256SUMS
          curl --fail --silent --show-error --location --retry 8 --retry-all-errors --retry-delay 3 --max-time 60 "${PAGE_URL%/}/vendor/cesium/Cesium.js" -o /tmp/published-Cesium.js
          test -s /tmp/published-Cesium.js
          BASE_URL="${base}" python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          from time import sleep
          from urllib.error import HTTPError, URLError
          from urllib.request import urlopen
          base = os.environ["BASE_URL"].rstrip("/") + "/"
          out = Path("/tmp/published-3d-tiles")

          def fetch_bytes(url):
              for attempt in range(1, 9):
                  try:
                      with urlopen(url, timeout=60) as response:
                          return response.read()
                  except (HTTPError, URLError):
                      if attempt == 8:
                          raise
                      sleep(min(3 * attempt, 15))
              raise RuntimeError("unreachable")
          out.mkdir(exist_ok=True)
          lines = Path("/tmp/published-SHA256SUMS").read_text().splitlines()
          for line in lines:
              digest, rel = line.split("  ", 1)
              target = out / rel
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(fetch_bytes(base + rel))
              actual = hashlib.sha256(target.read_bytes()).hexdigest()
              if actual != digest:
                  raise SystemExit(f"SHA-256 mismatch for published {rel}: {actual} != {digest}")
          print(f"Published 3D Tiles integrity verified: {len(lines)} files")
          building_lines = Path("/tmp/published-building-SHA256SUMS").read_text().splitlines()
          building_root = Path("/tmp/published-building-3d-tiles"); building_root.mkdir(exist_ok=True)
          building_base = os.environ["PAGE_URL"].rstrip("/") + "/3d-tiles/buildings/"
          for line in building_lines:
              digest, rel = line.split("  ", 1)
              target = building_root / rel; target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(fetch_bytes(building_base + rel))
              actual = hashlib.sha256(target.read_bytes()).hexdigest()
              if actual != digest:
                  raise SystemExit(f"Building SHA-256 mismatch for published {rel}: {actual} != {digest}")
          print(f"Published building 3D Tiles integrity verified: {len(building_lines)} files")
          PY
      - name: Verify production API readiness (informational)
        shell: bash
        continue-on-error: true
        env:
          TSM_API_BASE_URL: ${{ vars.TSM_API_BASE_URL }}
        run: |
          set -euo pipefail
          # The public console is local-first: it runs without the API. Live river
          # data and login are dropped from production requirements, so this probe
          # is informational only and never fails the Pages deployment.
          if [[ "${TSM_API_BASE_URL}" != https://* ]]; then
            echo "TSM_API_BASE_URL is not an https:// origin; skipping API readiness probe."
            exit 0
          fi
          expected_sha="${GITHUB_SHA}"
          if curl --fail --silent --location --max-time 30 "${TSM_API_BASE_URL%/}/ready" --output /tmp/tsm-api-ready.json; then
            test -s /tmp/tsm-api-ready.json
            EXPECTED_SHA="${expected_sha}" node <<'NODE'
          const fs = require('node:fs');
          const expected = process.env.EXPECTED_SHA;
          const body = JSON.parse(fs.readFileSync('/tmp/tsm-api-ready.json', 'utf8'));
          console.log(JSON.stringify({
            reachable: true,
            build_sha: body.build_sha,
            sha_converged: body.build_sha === expected,
            ready: body.ready,
            auth_disabled: body.auth_disabled,
            offline_mode: body.offline_mode,
            oidc_configured: body.required_internal_dependencies?.oidc,
          }, null, 2));
          NODE
          else
            echo "Production API is not reachable; the static console deploys without it."
          fi
          exit 0
      - name: Purge stale Pages workflow artifacts after deployment
        if: always()
        continue-on-error: true
        uses: jimschubert/delete-artifacts-action@f5cb1978980f2e189a2b3484d430f8810860ba38 # v1.0.4
        with:
          artifact_name: github-pages
          active_duration: 1h
          min_bytes: '0'
          log_level: info
      - name: Purge stale production bundle artifacts after deployment
