name: TSM Production Build & Pages Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_pages:
        description: "Run the GitHub Pages deployment after production verification"
        required: false
        default: true
        type: boolean
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  NPM_REGISTRY: https://registry.npmjs.org
  CONSOLE_DIR: tsm-console

jobs:
  build:
    name: Verify and build production console
    if: ${{ github.event_name != 'issue_comment' || (github.event.issue.pull_request == null && github.event.comment.body == '/deploy-pages' && github.event.comment.user.login == github.repository_owner) }}
    runs-on: ubuntu-24.04
    env:
      VITE_TSM_API_BASE_URL: ${{ vars.VITE_TSM_API_BASE_URL }}
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Validate public API binding
        if: vars.TSM_PAGES_ENABLED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${VITE_TSM_API_BASE_URL}" ]] || { echo 'Missing VITE_TSM_API_BASE_URL repository variable for live production data.' >&2; exit 1; }
          [[ "${VITE_TSM_API_BASE_URL}" == https://* ]] || { echo 'VITE_TSM_API_BASE_URL must use HTTPS for production Pages deployments.' >&2; exit 1; }
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: ${{ env.NPM_REGISTRY }}
          cache: npm
          cache-dependency-path: ${{ env.CONSOLE_DIR }}/package-lock.json
      - name: Configure public npm registry
        working-directory: ${{ env.CONSOLE_DIR }}
        run: npm config set registry ${{ env.NPM_REGISTRY }}
      - name: Verify lockfile registry provenance
        working-directory: ${{ env.CONSOLE_DIR }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const lockfile = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const violations = [];
          for (const [packagePath, metadata] of Object.entries(lockfile.packages ?? {})) {
            if (typeof metadata?.resolved !== 'string') continue;
            try {
              const url = new URL(metadata.resolved);
              if (url.hostname !== 'registry.npmjs.org') violations.push(`${packagePath}: ${metadata.resolved}`);
            } catch {
              violations.push(`${packagePath}: invalid resolved URL ${metadata.resolved}`);
            }
          }
          if (violations.length) {
            console.error('ERROR: package-lock.json contains non-public resolved package URLs.');
            for (const violation of violations.slice(0, 20)) console.error(violation);
            process.exit(1);
          }
          console.log('Lockfile provenance check passed.');
          NODE
      - name: Verify lockfile reproducibility
        working-directory: ${{ env.CONSOLE_DIR }}
        run: |
          cp package-lock.json package-lock.json.ci-baseline
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --registry=${{ env.NPM_REGISTRY }}
          diff -u package-lock.json.ci-baseline package-lock.json
          rm package-lock.json.ci-baseline
      - name: Install locked dependencies
        working-directory: ${{ env.CONSOLE_DIR }}
        run: npm ci --ignore-scripts --no-audit --no-fund --registry=${{ env.NPM_REGISTRY }}
      - name: Repository integrity gate
        working-directory: ${{ env.CONSOLE_DIR }}
        run: npm run check:integrity
      - name: Parse gate
        working-directory: ${{ env.CONSOLE_DIR }}
        run: npm run check:parse
      - name: TypeScript gate
        working-directory: ${{ env.CONSOLE_DIR }}
        run: npm run check:type
      - name: Test suite
        working-directory: ${{ env.CONSOLE_DIR }}
        run: npm run test:all
      - name: Production Vite build
        working-directory: ${{ env.CONSOLE_DIR }}
        run: npm run build
      - name: Prepare GitHub Pages SPA fallback
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.deploy_pages) || (github.event_name != 'workflow_dispatch' && vars.TSM_PAGES_ENABLED == 'true') || (github.event_name == 'issue_comment' && github.event.issue.pull_request == null && github.event.comment.body == '/deploy-pages' && github.event.comment.user.login == github.repository_owner) }}
        working-directory: ${{ env.CONSOLE_DIR }}
        run: cp dist/index.html dist/404.html
      - name: Validate production artifact
        working-directory: ${{ env.CONSOLE_DIR }}
        run: |
          test -f dist/index.html
          if [[ "${{ ((github.event_name == 'workflow_dispatch' && inputs.deploy_pages) || (github.event_name != 'workflow_dispatch' && vars.TSM_PAGES_ENABLED == 'true') || (github.event_name == 'issue_comment' && github.event.issue.pull_request == null && github.event.comment.body == '/deploy-pages' && github.event.comment.user.login == github.repository_owner)) }}" == "true" ]]; then
            test -f dist/404.html
          fi
      - name: Upload production artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tsm-console-production
          path: ${{ env.CONSOLE_DIR }}/dist
          if-no-files-found: error
      - name: Configure GitHub Pages when deployment is requested
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.deploy_pages) || (github.event_name != 'workflow_dispatch' && vars.TSM_PAGES_ENABLED == 'true') || (github.event_name == 'issue_comment' && github.event.issue.pull_request == null && github.event.comment.body == '/deploy-pages' && github.event.comment.user.login == github.repository_owner) }}
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload Pages artifact when deployment is requested
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.deploy_pages) || (github.event_name != 'workflow_dispatch' && vars.TSM_PAGES_ENABLED == 'true') || (github.event_name == 'issue_comment' && github.event.issue.pull_request == null && github.event.comment.body == '/deploy-pages' && github.event.comment.user.login == github.repository_owner) }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ env.CONSOLE_DIR }}/dist

  deploy:
    name: Deploy production console
    needs: build
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.deploy_pages) || (github.event_name != 'workflow_dispatch' && vars.TSM_PAGES_ENABLED == 'true') || (github.event_name == 'issue_comment' && github.event.issue.pull_request == null && github.event.comment.body == '/deploy-pages' && github.event.comment.user.login == github.repository_owner) }}
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Verify published site
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          [[ -n "${PAGE_URL}" ]] || { echo 'deploy-pages did not return page_url.' >&2; exit 1; }
          curl --fail --silent --show-error --location --max-time 30 "${PAGE_URL}" --output /tmp/tsm-pages-response.html
          grep -q '<title>' /tmp/tsm-pages-response.html
          echo "Published Pages endpoint responded successfully: ${PAGE_URL}"

  notify-command:
    name: Report owner-triggered Pages dispatch
    needs: [build, deploy]
    if: ${{ always() && github.event_name == 'issue_comment' && github.event.issue.pull_request == null && github.event.comment.body == '/deploy-pages' && github.event.comment.user.login == github.repository_owner }}
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - name: Post result to dispatch issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          body="TSM Pages dispatch: build=${BUILD_RESULT}; deploy=${DEPLOY_RESULT}.\n\nRun: ${RUN_URL}"
          if [[ -n "${PAGE_URL}" ]]; then
            body+="\nPublished URL: ${PAGE_URL}"
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -f body="${body}"
