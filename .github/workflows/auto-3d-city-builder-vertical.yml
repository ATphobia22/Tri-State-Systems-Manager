name: Mount Vernon LiDAR reconstruction bridge
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/geospatial/auto-3d-city-builder/src/citybuilder/vertical_bridge.py'
      - '.github/workflows/auto-3d-city-builder-vertical.yml'
permissions:
  contents: read
jobs:
  vertical-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install reconstruction and point-cloud tools
        run: python -m pip install -e 'scripts/geospatial/auto-3d-city-builder[test]' 'laspy==2.6.1' 'lazrs==0.7.0'
      - name: Test reconstruction contracts
        run: python -m pytest scripts/geospatial/auto-3d-city-builder/tests -q
      - name: Acquire official bounded pilot scene
        run: python scripts/geospatial/build_mount_vernon_scene.py --bbox -87.900 37.929 -87.892 37.938 --output vertical-review/source
      - name: Retrieve EPT metadata and verify explicit vertical datum before sampling
        run: |
          set -euo pipefail
          curl --fail --retry 3 --max-time 90 'https://s3-us-west-2.amazonaws.com/usgs-lidar-public/USGS_LPC_IN_WT_B12_Posey_2013_LAS_2016/ept.json' -o vertical-review/ept.json
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('vertical-review')
          meta=json.loads((root/'ept.json').read_bytes())
          srs=meta.get('srs',{})
          if not isinstance(srs,dict) or srs.get('authority')!='EPSG' or str(srs.get('vertical'))!='5703':
              raise SystemExit('BLOCKED: EPT metadata lacks explicit NAVD88 metre CRS EPSG:5703')
          scene=json.loads((root/'source/scene.json').read_bytes())
          (root/'footprints.geojson').write_text(json.dumps(scene['buildings']))
          PY
      - name: Sample classified LiDAR returns with existing TSM extractor
        run: |
          python scripts/geospatial/extract_lidar_heights.py --geojson vertical-review/footprints.geojson --out vertical-review/lidar.geojson --ept-url 'https://s3-us-west-2.amazonaws.com/usgs-lidar-public/USGS_LPC_IN_WT_B12_Posey_2013_LAS_2016/ept.json' --allow-zero-heights
      - name: Build geoid-adjusted candidates, no assumed heights
        run: |
          set -euo pipefail
          python -m citybuilder.vertical_bridge vertical-review/source vertical-review/lidar.geojson vertical-review/candidate --lidar-sha256 "$(sha256sum vertical-review/lidar.geojson | cut -d' ' -f1)" --metadata vertical-review/ept.json --metadata-sha256 "$(sha256sum vertical-review/ept.json | cut -d' ' -f1)" --grid data/geo/geoid18/g2018u0.bin
      - name: Preserve source and candidate diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mount-vernon-vertical-reconstruction-review
          path: vertical-review/
          if-no-files-found: warn
          retention-days: 30
