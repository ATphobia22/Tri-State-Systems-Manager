name: UACF Kernel CI

on:
  push:
    branches: [main, feature/uacf-kernel]
    paths:
      - "packages/**"
      - "providers/**"
      - "apps/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - "turbo.json"
      - "tsconfig*.json"
      - ".github/workflows/uacf-ci.yml"
  pull_request:
    paths:
      - "packages/**"
      - "providers/**"
      - "apps/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - "turbo.json"
      - "tsconfig*.json"
      - ".github/workflows/uacf-ci.yml"

permissions:
  contents: read

jobs:
  kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (pinned 2026-09-30)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 (pinned 2026-09-30)
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@10.9.2
      - run: npm install --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
      - run: npm run verify:uacf
