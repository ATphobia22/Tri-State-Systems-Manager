name: UACF Kernel CI

on:
  push:
    branches: [main, feature/uacf-kernel]
    paths:
      - "packages/**"
      - "providers/**"
      - "apps/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - "turbo.json"
      - "tsconfig*.json"
      - ".github/workflows/uacf-ci.yml"
  pull_request:
    paths:
      - "packages/**"
      - "providers/**"
      - "apps/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - "turbo.json"
      - "tsconfig*.json"
      - ".github/workflows/uacf-ci.yml"

permissions:
  contents: read

jobs:
  kernel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4 (pinned 2026-09-30)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4 (pinned 2026-09-30)
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@10.9.2
      - run: npm install --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
      - run: npm run verify:uacf
