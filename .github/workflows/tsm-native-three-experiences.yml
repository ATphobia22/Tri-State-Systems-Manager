name: TSM Native Three Experiences Contracts

on:
  pull_request:
    paths:
      - 'tsm-native/Source/TSMNative/TSMExperienceSubsystem.*'
      - 'tsm-native/Source/TSMNative/TSMEngineeringHUD.cpp'
      - 'scripts/native/three-experiences-source-contract.test.mjs'
      - '.github/workflows/tsm-native-three-experiences.yml'
      - 'scripts/native/verify-evidence-storyboard*.mjs'
      - 'schemas/native/tsm-evidence-storyboard.schema.json'
  push:
    branches: [main]
    paths:
      - 'tsm-native/Source/TSMNative/TSMExperienceSubsystem.*'
      - 'tsm-native/Source/TSMNative/TSMEngineeringHUD.cpp'
      - 'scripts/native/three-experiences-source-contract.test.mjs'
      - '.github/workflows/tsm-native-three-experiences.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  three-experiences-source:
    name: Three Experience Source Contract (not Shipping)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Check native experience source contract
        run: node --test scripts/native/three-experiences-source-contract.test.mjs scripts/native/verify-evidence-storyboard.test.mjs
      - name: Explicit gate boundary
        shell: bash
        run: |
          echo 'PASS: static source integration and mathematical screening contract'
          echo 'NOT VERIFIED: Unreal Header Tool, UE 5.8 C++ compile, cook, Win64 Shipping, signing, clean offline Windows 11 runtime'
