name: Posey FEMA effective geometry receipt and parcel review

on:
  pull_request:
    paths:
      - tools/geospatial_exchange/posey_nfhl_effective_geometry.py
      - tests/geospatial_exchange/test_posey_nfhl_effective_geometry.py
      - .github/workflows/posey-nfhl-effective-geometry.yml
      - docs/regulatory/loma/POSEY-NFHL-EFFECTIVE-GEOMETRY-RECEIPT.md
  push:
    branches: [main]
    paths:
      - tools/geospatial_exchange/posey_nfhl_effective_geometry.py
      - tests/geospatial_exchange/test_posey_nfhl_effective_geometry.py
      - .github/workflows/posey-nfhl-effective-geometry.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-evidence-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Install pinned geometry dependencies
        run: python -m pip install shapely==2.0.6 numpy==2.1.3
      - name: Compile evidence CLI and run synthetic, offline tests
        run: |
          python -m py_compile tools/geospatial_exchange/posey_nfhl_effective_geometry.py
          PYTHONPATH=. python -m unittest discover \
            -s tests/geospatial_exchange -p test_posey_nfhl_effective_geometry.py -v

  live-fema-evidence-artifact:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    needs: offline-evidence-regressions
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Install pinned geometry dependencies
        run: python -m pip install shapely==2.0.6 numpy==2.1.3
      - name: Acquire FEMA layer 3 and 28 by Posey DFIRM ID and receipt every chunk
        run: |
          python tools/geospatial_exchange/posey_nfhl_effective_geometry.py acquire \
            --out "$RUNNER_TEMP/posey-nfhl-effective-geometry" --page-size 10
      - name: Verify all source bytes and FEMA source OBJECTIDs
        run: |
          python tools/geospatial_exchange/posey_nfhl_effective_geometry.py verify \
            --snapshot "$RUNNER_TEMP/posey-nfhl-effective-geometry"
      - name: Screen 2025 Posey parcels against effective FEMA polygon geometry
        run: |
          python tools/geospatial_exchange/posey_nfhl_effective_geometry.py screen \
            --snapshot "$RUNNER_TEMP/posey-nfhl-effective-geometry" \
            --parcels data/posey-county/parcels/posey-parcels-2025.geojson \
            --registry data/posey-county/offline/2026-09-30/fema-effective-firm-panels-18129C.json \
            --out "$RUNNER_TEMP/posey-nfhl-parcel-review.json"
      - name: Keep source inventory drift visible
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import os
          root = Path(os.environ["RUNNER_TEMP"])
          a = json.loads((root / "posey-nfhl-parcel-review.json").read_text())
          counts = a["nfhlLayerCounts"]
          print("Observed source layer counts:", counts)
          print("Panel registry reconciliation:", a["sourcePanelInventory"])
          print("Parcel screening status counts:", a["statusCounts"])
          if a["sourcePanelInventory"]["status"] != "MATCH":
              raise SystemExit("FEMA live panel inventory changed from pinned 35-panel registry; manual review needed")
          if counts["firmPanels"] != 35:
              raise SystemExit("Unexpected FEMA effective panel count; do not claim complete parcel review")
          if a["regulatoryEligibilityEstablished"] is not False:
              raise SystemExit("Prohibited unsurveyed LOMA eligibility claim")
          PY
      - name: Upload downloaded FEMA geometries and immutable parcel-evidence receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: posey-nfhl-effective-geometry-evidence-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            ${{ runner.temp }}/posey-nfhl-effective-geometry/
            ${{ runner.temp }}/posey-nfhl-parcel-review.json
