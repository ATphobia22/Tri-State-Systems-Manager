name: Open-Source Adoption Register Validation

on:
  push:
    branches: [main, feat/apple-developer-forums-hardening-20261024]
    paths:
      - 'integrations/open-source-candidate-register.json'
      - 'docs/research/OPEN-SOURCE-ECOSYSTEM-ADOPTION-REVIEW.md'
      - 'tests/contracts/open-source-adoption-register.test.mjs'
      - '.github/workflows/open-source-adoption-register-validation.yml'
  pull_request:
    paths:
      - 'integrations/open-source-candidate-register.json'
      - 'docs/research/OPEN-SOURCE-ECOSYSTEM-ADOPTION-REVIEW.md'
      - 'tests/contracts/open-source-adoption-register.test.mjs'
      - '.github/workflows/open-source-adoption-register-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v4
        with:
          node-version: 22
      - name: Validate candidate register and adoption gates
        run: node --test tests/contracts/open-source-adoption-register.test.mjs
