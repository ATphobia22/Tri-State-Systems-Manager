name: TSM Coolify Deployment Trigger

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tsm-coolify-deploy
  cancel-in-progress: false

jobs:
  trigger:
    name: Trigger self-hosted Coolify deployment
    runs-on: ubuntu-24.04
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Trigger Coolify webhook when configured
        env:
          COOLIFY_DEPLOY_WEBHOOK_URL: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK_URL }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${COOLIFY_DEPLOY_WEBHOOK_URL}" ]]; then
            echo "Coolify auto-deploy must be configured through the Coolify GitHub integration."
            echo "No provider credentials are stored in this repository."
            exit 0
          fi
          curl --fail --silent --show-error --location --max-time 30 \
            --request POST \
            --header 'Content-Type: application/json' \
            --data '{"branch":"main"}' \
            "${COOLIFY_DEPLOY_WEBHOOK_URL}"
          echo "Coolify deployment webhook triggered for ${GITHUB_SHA}."          fi
