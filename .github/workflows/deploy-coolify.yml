name: TSM Coolify Deployment Trigger

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tsm-coolify-deploy
  cancel-in-progress: false

jobs:
  trigger:
    name: Trigger self-hosted Coolify deployment
    runs-on: ubuntu-24.04
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      # Coolify deploy API (path B): GET /api/v1/deploy?uuid=... with Bearer token.
      # Native Git provider webhooks (path A) need no secrets here — soft-skip when URL unset.
      - name: Trigger Coolify webhook when configured
        env:
          COOLIFY_DEPLOY_WEBHOOK_URL: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${COOLIFY_DEPLOY_WEBHOOK_URL}" ]]; then
            echo "Coolify auto-deploy must be configured through the Coolify GitHub integration."
            echo "No provider credentials are stored in this repository."
            exit 0
          fi
          if [[ -z "${COOLIFY_API_TOKEN}" ]]; then
            echo "COOLIFY_DEPLOY_WEBHOOK_URL is set but COOLIFY_API_TOKEN is missing." >&2
            echo "Create a deploy-scoped API token in Coolify (Keys & Tokens) and store it as a repository secret." >&2
            exit 1
          fi
          curl --fail --silent --show-error --location --max-time 30 \
            --request GET \
            --header "Authorization: Bearer ${COOLIFY_API_TOKEN}" \
            "${COOLIFY_DEPLOY_WEBHOOK_URL}"
          echo "Coolify deployment webhook triggered for ${GITHUB_SHA}"
