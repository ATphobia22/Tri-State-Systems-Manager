name: PTDT Geodetic AOI and Point Cloud Evidence Gate

on:
  pull_request:
    paths:
      - 'scripts/geospatial/ptdt_geodetic_clip.py'
      - 'scripts/geospatial/test_ptdt_geodetic_clip.py'
      - 'docs/geodesy/PTDT-AOI-AND-LIDAR-CONTROLS.md'
      - '.github/workflows/ptdt-geodetic-aoi.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/geospatial/ptdt_geodetic_clip.py'
      - 'scripts/geospatial/test_ptdt_geodetic_clip.py'
      - 'docs/geodesy/PTDT-AOI-AND-LIDAR-CONTROLS.md'
      - '.github/workflows/ptdt-geodetic-aoi.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  geodetic-evidence-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install geodetic data QA tools
        run: python -m pip install --disable-pip-version-check 'pyproj>=3.6,<4' 'shapely>=2,<3' 'laspy>=2.5,<3' 'numpy>=1.26,<3'
      - name: Compile geodetic clipping and adversarial tests
        run: python -m py_compile scripts/geospatial/ptdt_geodetic_clip.py scripts/geospatial/test_ptdt_geodetic_clip.py
      - name: Verify invalid supplied coordinates are rejected and LAS evidence is preserved
        run: python -m unittest scripts.geospatial.test_ptdt_geodetic_clip -v
