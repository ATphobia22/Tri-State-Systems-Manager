name: Building Geometry and Identity Smoke

on:
  pull_request:
    paths:
      - 'scripts/geospatial/build-building-3d-tiles.py'
      - 'scripts/geospatial/test-building-3d-tiles-geometry.py'
      - '.github/workflows/building-geometry-source-id-tests.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/geospatial/build-building-3d-tiles.py'
      - 'scripts/geospatial/test-building-3d-tiles-geometry.py'
      - '.github/workflows/building-geometry-source-id-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  topology-provenance-regression:
    name: Topology, LiDAR height and OBJECTID gate
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install pinned footprint topology dependency
        run: python -m pip install --disable-pip-version-check --no-input 'numpy==2.1.3' 'shapely==2.0.6'
      - name: Compile building generator and test script
        run: python -m py_compile scripts/geospatial/build-building-3d-tiles.py scripts/geospatial/test-building-3d-tiles-geometry.py
      - name: Verify 3D footprint holes, all polygons, LiDAR heights, unique IDs
        run: python scripts/geospatial/test-building-3d-tiles-geometry.py
