name: TSM Public GeoTruth and Foundry Ledger Integration

on:
  pull_request:
    paths:
      - 'tsm-console/src/lib/geotruth-map-layer.ts'
      - 'tsm-console/src/components/GeoTruthLayerControl.tsx'
      - 'tsm-console/src/components/FoundryLedgerReview.tsx'
      - 'tsm-console/src/components/RealWorldTwinMap.tsx'
      - 'tsm-console/src/components/TriStateDigitalTwinMap.tsx'
      - 'tsm-console/src/routes/LedgerView.tsx'
      - 'tsm-console/tests/geotruth-qa-map.test.mjs'
      - 'tsm-console/tests/foundry-ledger-review.test.mjs'
      - 'tsm-console/src/lib/foundry-ledger-review.ts'
      - 'tsm-native/Source/TSMNative/TSMEngineeringHUD.cpp'
      - 'tests/innovation/test_native_passport_export_wiring.py'
      - 'scripts/government/foundry_ledger_queue.py'
      - 'tests/government/test_foundry_ledger_queue.py'
      - 'tsm-native/Source/TSMNative/TSMEngineeringHUD.cpp'
      - '.github/workflows/tsm-geotruth-ledger-native.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  headless-integration-contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v6.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Test source-ID, privacy and height QA handling
        run: node --experimental-strip-types --test tsm-console/tests/geotruth-qa-map.test.mjs tsm-console/tests/foundry-ledger-review.test.mjs
      - name: Test Foundry ledger review state and hash binding
        run: python -m unittest discover -s tests/government -p test_foundry_ledger_queue.py -v
      - name: Native HUD wiring contract (not a Windows compile)
        run: python -m unittest discover -s tests/innovation -p test_native_passport_export_wiring.py -v
      - name: Preserve existing triad and evidence assurance
        run: |
          python -m unittest discover -s tests/innovation -p 'test_*.py' -v
          python -m unittest discover -s scripts/public_interest -p test_evidence_kit.py -v
      - name: Produce local advisory ledger queue (not immutable ledger mutation)
        run: |
          python scripts/government/contract_foundry.py \
            --catalog data/schemas/tsm-indiana-data-catalog-v1.json \
            --output dist/innovation/current-source-contracts.json
          python scripts/government/foundry_ledger_queue.py \
            --foundry dist/innovation/current-source-contracts.json \
            --output dist/innovation/foundry-ledger-review.json
      - name: Upload review-only evidence artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: geotruth-ledger-integration-review
          path: dist/innovation/foundry-ledger-review.json
          if-no-files-found: error
