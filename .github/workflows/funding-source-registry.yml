name: Government Funding Source Registry QA
on:
  pull_request:
    paths:
      - "data/registries/tsm-official-funding-portals-2026-10-26.json"
      - "scripts/grants/**"
      - ".github/workflows/funding-source-registry.yml"
  push:
    branches: [main]
    paths:
      - "data/registries/tsm-official-funding-portals-2026-10-26.json"
      - "scripts/grants/**"
      - ".github/workflows/funding-source-registry.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  registry-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Validate portal roles and prohibit unsupported award/submission claims
        run: |
          python3 scripts/grants/validate_funding_source_registry.py
          python3 scripts/grants/test_funding_source_registry.py -v
