name: TSM Native Installer Distribution Integrity
on:
  pull_request:
    paths:
      - 'tsm-native/Installer/TSM-Native.iss'
      - 'scripts/native/Build-TSMNativeWindows.ps1'
      - 'scripts/release/create_native_winget_manifest.py'
      - 'tests/native/test_installer_distribution_policy.py'
      - '.github/workflows/tsm-native.yml'
      - '.github/workflows/native-installer-distribution.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  installer-distribution-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Verify signed offline Inno and WinGet manifest generation contracts
        run: python -m unittest discover -s tests/native -p test_installer_distribution_policy.py -v
