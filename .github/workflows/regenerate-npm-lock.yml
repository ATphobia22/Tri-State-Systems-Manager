name: Temporary npm lockfile regeneration

on:
  push:
    branches: [fix/3d-tiles-hlod-renderer-hardening]
    paths:
      - '.github/workflows/regenerate-npm-lock.yml'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/3d-tiles-hlod-renderer-hardening
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - name: Regenerate package lock from package.json
        working-directory: tsm-console
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
      - name: Verify generated lockfile is in sync
        working-directory: tsm-console
        run: npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org --dry-run
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: tsm-regenerated-package-lock
          path: tsm-console/package-lock.json
          if-no-files-found: error
          retention-days: 1

      - name: Commit regenerated lockfile to the working branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tsm-console/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile is already current."
            exit 0
          fi
          git commit -m "fix(deps): regenerate npm lockfile"
          git push origin HEAD:fix/3d-tiles-hlod-renderer-hardening
