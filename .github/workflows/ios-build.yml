# =============================================================================
# TSM iOS build — macOS CI pipeline
#
# Produces a signed Tri-State-Systems.ipa from tsm-console/ via Capacitor 8.
#
# REQUIRED REPOSITORY SECRETS (repo owner must add these before the first run;
# Settings → Secrets and variables → Actions → New repository secret):
#
#   APPLE_DISTRIBUTION_CERT_P12      Base64-encoded Apple Distribution .p12
#                                    (certificate + private key, exported from
#                                    Keychain Access on the Mac that created it)
#   APPLE_DISTRIBUTION_CERT_PASSWORD Password used when exporting the .p12
#   APPLE_PROVISIONING_PROFILE       Base64-encoded .mobileprovision profile for
#                                    App ID org.tristate.tsm.ios
#                                    (App Store profile for TestFlight/App Store,
#                                    or Ad Hoc profile for direct distribution)
#   APPLE_TEAM_ID                    10-character Apple Developer Team ID
#   APP_STORE_CONNECT_API_KEY_ID     App Store Connect API Key ID (optional,
#   APP_STORE_CONNECT_API_ISSUER_ID  only needed for automated TestFlight upload)
#   APP_STORE_CONNECT_API_KEY_P8     Base64-encoded .p8 API key (optional,
#                                    only needed for automated TestFlight upload)
#
# The job fails fast with a clear message when the signing secrets are absent.
# Manual (unsigned) local builds are documented in docs/BUILD-IOS.md.
# =============================================================================

name: tsm-ios-build

on:
  workflow_dispatch:
    inputs:
      export_method:
        description: "Export method for the .ipa"
        required: true
        default: "app-store"
        type: choice
        options:
          - app-store
          - ad-hoc
  push:
    tags:
      - "ios-v*"

permissions:
  contents: read

env:
  APP_BUNDLE_ID: org.tristate.tsm.ios

jobs:
  build-ipa:
    name: Build signed .ipa
    runs-on: macos-15
    defaults:
      run:
        working-directory: tsm-console
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tsm-console/package-lock.json
          registry-url: https://registry.npmjs.org

      - name: Pin npm CLI
        run: npm install --global npm@10.9.2 --no-audit --no-fund

      - name: Verify signing secrets are present
        run: |
          missing=""
          for s in APPLE_DISTRIBUTION_CERT_P12 APPLE_DISTRIBUTION_CERT_PASSWORD \
                   APPLE_PROVISIONING_PROFILE APPLE_TEAM_ID; do
            if [ -z "${!s}" ]; then missing="$missing $s"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing required secrets:$missing"
            echo "Add them under Settings → Secrets and variables → Actions."
            echo "See the comment block at the top of .github/workflows/ios-build.yml"
            echo "and docs/BUILD-IOS.md for how to create each one."
            exit 1
          fi
        env:
          APPLE_DISTRIBUTION_CERT_P12: ${{ secrets.APPLE_DISTRIBUTION_CERT_P12 }}
          APPLE_DISTRIBUTION_CERT_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERT_PASSWORD }}
          APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Install dependencies from lockfile
        run: npm ci --no-audit --no-fund

      - name: Type-check
        run: npm run check:type

      - name: Build web bundle
        run: npm run build

      - name: Sync Capacitor iOS project
        run: npx --no-install cap sync ios

      - name: Import signing certificate
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/tsm-ios.keychain-db"
          echo "${{ secrets.APPLE_DISTRIBUTION_CERT_P12 }}" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/dist.p12" \
            -k "$KEYCHAIN" -P "$APPLE_DISTRIBUTION_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/xcodebuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | tr -d '"')
          echo "KEYCHAIN_PATH=$KEYCHAIN" >> "$GITHUB_ENV"
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERT_PASSWORD }}
          APPLE_DISTRIBUTION_CERT_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERT_PASSWORD }}

      - name: Install provisioning profile
        run: |
          set -euo pipefail
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "${{ secrets.APPLE_PROVISIONING_PROFILE }}" | base64 --decode \
            > "$HOME/Library/MobileDevice/Provisioning Profiles/tsm-ios.mobileprovision"

      - name: Write ExportOptions.plist
        run: |
          METHOD="${{ inputs.export_method || 'app-store' }}"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>${METHOD}</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>uploadSymbols</key><true/>
            <key>compileBitcode</key><false/>
          </dict>
          </plist>
          EOF
          echo "Export method: $METHOD"

      - name: Archive with xcodebuild
        run: |
          set -euo pipefail
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/TSM.xcarchive" \
            archive

      - name: Export signed .ipa
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/TSM.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          ls -la "$RUNNER_TEMP/export"

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Tri-State-Systems-ios
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error
          retention-days: 30
