name: Temporary compatible dependency lockfile regeneration

on:
  push:
    branches:
      - integration/console-deps-compatible-mainline-20261022

permissions:
  contents: write

concurrency:
  group: tsm-console-lockfile-regeneration
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: \${{ github.ref_name }}
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tsm-console/package-lock.json
      - name: Regenerate lockfile with compatible Three.js pin
        working-directory: tsm-console
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile
        shell: bash
        run: |
          if git diff --quiet -- tsm-console/package-lock.json; then
            echo "package-lock.json is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tsm-console/package-lock.json
          git commit -m "chore(deps): regenerate compatible console lockfile"
          git push origin "HEAD:\${{ github.ref_name }}"
