name: Mount Vernon Official City Scene Snapshot

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/geospatial/build_mount_vernon_scene.py'
      - '.github/workflows/mount-vernon-official-city-scene.yml'

permissions:
  contents: read

jobs:
  acquire-source-city:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install bounded test dependency
        run: python -m pip install 'pytest>=8,<10'
      - name: Verify scene generator contracts (offline)
        run: python -m pytest -q backend/tests/test_mount_vernon_scene.py backend/tests/test_mount_vernon_deployment.py
      - name: Acquire official Indiana GIO planimetric context for Mount Vernon
        run: |
          python scripts/geospatial/build_mount_vernon_scene.py --output city-artifact/mount-vernon-scene
      - name: Validate archive checksum, counts, source IDs, and no structural-height assertion
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path('city-artifact/mount-vernon-scene')
          raw=(root/'scene.json').read_bytes()
          receipt=json.loads((root/'scene.receipt.json').read_bytes())
          scene=json.loads(raw)
          assert hashlib.sha256(raw).hexdigest()==receipt['sha256']
          assert len(raw)==receipt['byte_length']
          assert scene['crs']=='EPSG:4326'
          for layer,kind in [('buildings','building'),('roads','road')]:
              collection=scene[layer]['features']
              assert len(collection)==receipt['feature_counts'][layer]
              assert all(f['properties']['tsm_id']==f'IGIO:{kind}:{f["properties"]["source_objectid"]}' for f in collection)
              assert all(f['properties']['engineering_approved'] is False and f['properties']['height_m'] is None for f in collection)
          print('Archive SHA-256:',receipt['sha256'])
          print('Reference-only official building geometries:',receipt['feature_counts']['buildings'])
          print('Reference-only official road geometries:',receipt['feature_counts']['roads'])
          print('No survey, structural height, vertical datum, regulatory, or engineering validation claimed.')
          PY
      - name: Upload unsigned governmental reference scene as evidence artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mount-vernon-governmental-reference-scene
          path: city-artifact/mount-vernon-scene/
          if-no-files-found: error
          retention-days: 30

      # This stage puts the exact source-acquisition bytes in the actual viewer
      # build. It does not upgrade source geometry to surveyed status.
      - name: Stage verified-byte city reference archive in the viewer
        run: |
          set -euo pipefail
          install -d tsm-console/public/mount-vernon-scene
          cp city-artifact/mount-vernon-scene/scene.json tsm-console/public/mount-vernon-scene/scene.json
          cp city-artifact/mount-vernon-scene/scene.receipt.json tsm-console/public/mount-vernon-scene/scene.receipt.json
          cmp city-artifact/mount-vernon-scene/scene.json tsm-console/public/mount-vernon-scene/scene.json
          cmp city-artifact/mount-vernon-scene/scene.receipt.json tsm-console/public/mount-vernon-scene/scene.receipt.json

      - name: Setup pinned Node runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.16.0'

      - name: Install console dependencies from lockfile
        working-directory: tsm-console
        run: npm ci --no-audit --no-fund --registry=https://registry.npmjs.org

      - name: Verify TypeScript city viewer contracts
        working-directory: tsm-console
        run: |
          npm run check:type
          ./node_modules/.bin/vitest run tests/mount-vernon-city-scene.test.ts
          node --test tests/mount-vernon-city-scene-contract.test.mjs

      - name: Build playable web scene with embedded source archive
        working-directory: tsm-console
        env:
          VITE_PAGES_BASE_PATH: /Tri-State-Systems-Manager/
        run: npm run build

      - name: Validate immutable scene is present in the built viewer
        run: |
          set -euo pipefail
          test -s tsm-console/dist/index.html
          python - <<'PY'
          import json, hashlib
          from pathlib import Path
          root=Path('tsm-console/dist/mount-vernon-scene')
          raw=(root/'scene.json').read_bytes()
          receipt=json.loads((root/'scene.receipt.json').read_bytes())
          scene=json.loads(raw)
          assert len(raw)==receipt['byte_length']
          assert hashlib.sha256(raw).hexdigest()==receipt['sha256']
          for name in ('buildings','roads'):
              assert len(scene[name]['features'])==receipt['feature_counts'][name]
          assert receipt['review']=='NOT_EVIDENCED' and receipt['regulatory_approval'] is False
          print('Built city viewer includes exactly verified-bytes reference scene',receipt['feature_counts'])
          PY

      - name: Generate and independently verify reproducible viewer deployment manifest
        run: |
          set -euo pipefail
          python scripts/geospatial/verify_mount_vernon_deployment.py --viewer-dir tsm-console/dist
          python scripts/geospatial/verify_mount_vernon_deployment.py --viewer-dir tsm-console/dist --verify
          test -s tsm-console/dist/mount-vernon-deployment.manifest.json
          echo 'Scope: verified byte-integrity web reference viewer; no native, terrain datum, or surveyed-height claim.'

      - name: Upload standalone Mount Vernon viewer build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mount-vernon-city-viewer-with-official-source-context
          path: tsm-console/dist/
          if-no-files-found: error
          retention-days: 30
