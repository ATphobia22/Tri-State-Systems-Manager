name: TSM Production Verification Watch
on:
  schedule:
    - cron: '7,27,47 * * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/production-verification-watch.yml'
      - 'scripts/release/test_production_watch_workflow.py'
permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read
concurrency:
  group: tsm-production-verification-watch-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false
jobs:
  validate-candidate:
    # A PR validates its own source; it cannot repair an already deployed main.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Validate candidate monitoring contract (not deployment evidence)
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --no-input 'PyYAML==6.0.3'
          python scripts/release/test_production_watch_workflow.py -v
  verify:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      SITE: https://atphobia22.github.io/Tri-State-Systems-Manager/
    steps:
      - name: Resolve immutable current main
        id: main
        shell: bash
        run: |
          set -euo pipefail
          sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.main.outputs.sha }}
          persist-credentials: false
      - name: Snapshot exact-main CI and open PRs
        env:
          MAIN_SHA: ${{ steps.main.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tsm-watch"
          out="$RUNNER_TEMP/tsm-watch"
          test "$(git rev-parse HEAD)" = "$MAIN_SHA"
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?branch=main&head_sha=$MAIN_SHA&per_page=100" |
            jq -s '[.[].workflow_runs[] | select(.name != "TSM Production Verification Watch" and (.event == "push" or .event == "workflow_dispatch"))] | group_by(.workflow_id) | map(max_by([.created_at,.run_attempt])) | map({id,name,head_sha,status,conclusion,event,html_url})' > "$out/main-workflows.json"
          gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$MAIN_SHA/check-runs?filter=latest&per_page=100" |
            jq -s '[.[].check_runs[] | select(.name != "verify") | {name,status,conclusion,details_url}]' > "$out/main-checks.json"
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" |
            jq -s '[.[][] | {number,head_sha:.head.sha,base_sha:.base.sha,draft,html_url}]' > "$out/open-prs.json"
          jq -n --arg sha "$MAIN_SHA" --arg time "$(date -u +%FT%TZ)" '{mainSha:$sha,checkedAtUtc:$time}' > "$out/snapshot.json"
          {
            printf '### Current main: `%s`\n' "$MAIN_SHA"
            echo "Exact-main workflow results (PR checks are not deployment proof):"
            echo '| Workflow | State | Conclusion |'
            echo '|---|---|---|'
            jq -r '.[] | [(.name | gsub("[|\r\n]";" ")),.status,(.conclusion // "pending")] | "| "+join(" | ")+" |"' "$out/main-workflows.json"
            echo "Open PRs: $(jq length "$out/open-prs.json")"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Independently probe anonymous publication
        env:
          MAIN_SHA: ${{ steps.main.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/tsm-watch"
          for route in '' atlas/ cesium/; do
            label="${route%/}"; label="${label:-root}"
            if code="$(curl --fail --silent --show-error --max-time 25 --max-filesize 4194304 --proto '=https' --write-out '%{http_code}' --output "$RUNNER_TEMP/tsm-watch-$label.html" "$SITE$route")" && [[ "$code" == 200 ]] && test -s "$RUNNER_TEMP/tsm-watch-$label.html"; then
              printf '%s HTTP_REACHABLE\n' "$label" >> "$out/public-probe.txt"
            else
              printf '%s HTTP_PROBE_FAILED\n' "$label" >> "$out/public-probe.txt"
            fi
          done
          # A build-pinned receipt is fetched from the exact main deployment run,
          # never from the public site being checked. PR runs cannot qualify.
          run="$(jq -r '[.[] | select(.name=="TSM Production Build & Pages Deploy" and .conclusion=="success")] | first | .id // empty' "$out/main-workflows.json")"
          if [[ -n "$run" ]]; then
            mkdir -p "$out/build-receipt"
            if gh run download "$run" --repo "$GITHUB_REPOSITORY" --name "tsm-cesium-release-receipt-$MAIN_SHA" --dir "$out/build-receipt"; then
              receipt="$out/build-receipt/cesium-release-receipt.json"
              expected="$(sha256sum "$receipt" | cut -d' ' -f1)"
              if python3 scripts/release/cesium_published_receipt.py verify-published --base-url "$SITE" --expected-git-sha "$MAIN_SHA" --expected-receipt-sha "$expected" --sample cesium/index.html --sample data/cesium-regional/terrain/layer.json --sample 3d-tiles/tileset.json --output "$out/publication-proof.json"; then
                echo REMOTE_SAMPLES_MATCH_BUILD > "$out/publication-status.txt"
              else
                echo PUBLICATION_VERIFICATION_FAILED > "$out/publication-status.txt"
              fi
            else
              echo BUILD_RECEIPT_UNAVAILABLE > "$out/publication-status.txt"
            fi
          else
            echo EXACT_MAIN_DEPLOYMENT_NOT_EVIDENCED > "$out/publication-status.txt"
          fi
          cat "$out/public-probe.txt" "$out/publication-status.txt" >> "$GITHUB_STEP_SUMMARY"
      - name: Record all 15 release acceptance gates
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/tsm-watch"; mkdir -p "$out"
          cat > "$out/release-gates.tsv" <<'EOF'
          01	Authoritative acquisition and checksums	Independent source and inventory receipts required
          02	Cross-state CRS and vertical datum	Independent transformation controls required
          03	Terrain and bathymetry	Seam and submerged survey evidence required
          04	Building inventory and geometry	Authoritative per-ID height and mesh parity required
          05	Semantic identities and relationships	Integration and topology evidence required
          06	Historical and live observations	Source timestamps and datum-bound replay required
          07	Non-destructive earthwork	Baseline invariance and volume benchmark required
          08	Hydraulic and geotechnical benchmarks	Independent calibrated solver evidence required
          09	Infrastructure topology and uncertainty	Authorized inventory and uncertainty review required
          10	3D Tiles and GLB integrity	Complete referenced-asset audit required
          11	Headed cinematic navigation	Real headed GPU render evidence required
          12	Anonymous public access	HTTP probe only; full anonymous runtime test required
          13	Windows 11 offline Shipping	Clean network-disabled UE Shipping receipt required
          14	Independent CI and deployment	Exact-main workflow and publication sample receipts collected separately
          15	Human engineering review	Qualified human review and agency determinations required
          EOF
          {
            echo '### Release evidence ledger'
            echo 'No gate is automatically certified by this watch. HTTP checks and sampled bytes are not full acceptance.'
            echo '| Gate | Scope | Outstanding evidence / verification boundary |'
            echo '|---|---|---|'
            awk -F '\t' '{print "| "$1" | "$2" | "$3" |"}' "$out/release-gates.tsv"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve verification receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: tsm-verification-watch-${{ github.run_id }}
          path: ${{ runner.temp }}/tsm-watch/
          retention-days: 3
          if-no-files-found: error
      - name: Surface confirmed failures without changing code
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/tsm-watch"
          test -s "$out/main-workflows.json"
          test -s "$out/public-probe.txt"
          test -s "$out/publication-status.txt"
          failed="$(jq 'any(.[]; .conclusion == "failure" or .conclusion == "timed_out" or .conclusion == "action_required")' "$out/main-workflows.json")"
          if [[ "$failed" == true ]] || grep -q HTTP_PROBE_FAILED "$out/public-probe.txt" || grep -q PUBLICATION_VERIFICATION_FAILED "$out/publication-status.txt"; then
            {
              echo '### Confirmed CI or publication failures'
              jq -r '.[] | select(.conclusion == "failure" or .conclusion == "timed_out" or .conclusion == "action_required") | [.name,.conclusion,.html_url] | @tsv' "$out/main-workflows.json"
              cat "$out/public-probe.txt" "$out/publication-status.txt"
            } | tee -a "$GITHUB_STEP_SUMMARY" >&2
            echo 'Confirmed CI or publication failure; inspect preserved receipts.' >&2
            exit 1
          fi
          echo 'Watch completed; inspect the ledger for unproven gates.'
