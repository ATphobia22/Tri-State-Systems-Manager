name: Tri-State Eight-County Offline GIS Assets
on:
  pull_request:
    paths:
      - 'scripts/geospatial/compile_tri_state_offline_layers.py'
      - 'tests/offline_gis/**'
      - '.github/workflows/tri-state-offline-gis.yml'
  push:
    paths:
      - 'scripts/geospatial/compile_tri_state_offline_layers.py'
      - 'tests/offline_gis/**'
      - '.github/workflows/tri-state-offline-gis.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-auditable-layers:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/geospatial/requirements-offline-gis.txt
      - name: Install pinned GIS wheel dependencies
        run: python -m pip install -r scripts/geospatial/requirements-offline-gis.txt
      - name: Compile and test converters without network access
        run: |
          python -m py_compile scripts/geospatial/compile_tri_state_offline_layers.py tests/offline_gis/test_compiler.py
          python -m unittest discover -s tests/offline_gis -v
      - name: Compile all eight existing county roads/water and the Posey DEM
        run: |
          python scripts/geospatial/compile_tri_state_offline_layers.py \
            --repo-root . --output "${{ runner.temp }}/tsm-eight-county-offline-gis"
      - name: Combine eight-county line layers into offline GeoPackage
        run: |
          python scripts/geospatial/build_tri_state_geopackage.py \
            --manifest "${{ runner.temp }}/tsm-eight-county-offline-gis/offline-layers-manifest.json"
      - name: Verify all produced files against manifest SHA-256
        run: |
          python scripts/geospatial/verify_tri_state_offline_layers.py \
            --manifest "${{ runner.temp }}/tsm-eight-county-offline-gis/offline-layers-manifest.json"
      - name: Upload generated unreviewed offline assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tsm-eight-county-offline-gis-unreviewed
          path: "${{ runner.temp }}/tsm-eight-county-offline-gis"
          if-no-files-found: error
          retention-days: 14
