name: 3D Buildings Height-Gap Evidence Contract

on:
  push:
    branches: [main]
    paths:
      - "scripts/geospatial/emit_building_height_gap_evidence.py"
      - "scripts/geospatial/test_emit_building_height_gap_evidence.py"
      - ".github/workflows/building-height-gap-evidence.yml"
      - ".github/workflows/building-3d-tiles.yml"
      - "scripts/geospatial/test_building_tiles_checkpoint_workflow.py"
  pull_request:
    paths:
      - "scripts/geospatial/emit_building_height_gap_evidence.py"
      - "scripts/geospatial/test_emit_building_height_gap_evidence.py"
      - ".github/workflows/building-height-gap-evidence.yml"
      - ".github/workflows/building-3d-tiles.yml"
      - "scripts/geospatial/test_building_tiles_checkpoint_workflow.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-height-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Parse evidence contracts
        run: python -m py_compile scripts/geospatial/emit_building_height_gap_evidence.py scripts/geospatial/test_emit_building_height_gap_evidence.py
      - name: Run 12 synthetic provenance and privacy tests
        run: python scripts/geospatial/test_emit_building_height_gap_evidence.py -v
      - name: Verify heavy production workflow checkpoint and no redundant rebuilds
        run: python scripts/geospatial/test_building_tiles_checkpoint_workflow.py -v
