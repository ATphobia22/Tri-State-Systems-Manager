name: TSM Workflow Artifact Cleanup

on:
  schedule:
    - cron: '17 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: tsm-artifact-cleanup
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Remove stale GitHub Pages deployment artifacts
        uses: jimschubert/delete-artifacts-action@a6a85fe6cc7f54a2abb2aff7440825d98b8eb6e4 # v1.0.3
        with:
          artifact_name: github-pages
          active_duration: 1h
          min_bytes: '0'
          log_level: info

      - name: Remove stale production build artifacts
        uses: jimschubert/delete-artifacts-action@a6a85fe6cc7f54a2abb2aff7440825d98b8eb6e4 # v1.0.3
        with:
          artifact_name: tsm-console-production
          active_duration: 1h
          min_bytes: '0'
          log_level: info
