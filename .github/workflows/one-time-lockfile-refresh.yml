name: One-time npm lockfile refresh

on:
  push:
    branches: [feat/apple-developer-forums-hardening-20261024]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'tsm-console/package.json'
      - 'tsm-console/package-lock.json'
      - 'apps/**/package.json'
      - 'packages/**/package.json'
      - 'providers/**/package.json'
      - 'plugins/**/package.json'
      - '.github/workflows/one-time-lockfile-refresh.yml'

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/apple-developer-forums-hardening-20261024'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: feat/apple-developer-forums-hardening-20261024
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Refresh npm lockfile from committed manifests
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
      - name: Refresh TSM console lockfile
        run: npm --prefix tsm-console install --package-lock-only --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
      - name: Commit lockfiles only when they changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json tsm-console/package-lock.json; then
            echo 'package-lock.json is already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json tsm-console/package-lock.json
          git commit -m 'chore: synchronize npm lockfile'
          git push origin HEAD:feat/apple-developer-forums-hardening-20261024
