name: TSM Reliability Maintenance

on:
  pull_request:
    paths:
      - '.github/workflows/reliability-maintenance.yml'
      - 'tsm-console/package.json'
      - 'tsm-console/package-lock.json'
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tsm-reliability-maintenance
  cancel-in-progress: true

jobs:
  npm-health:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tsm-console
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tsm-console/package-lock.json
          registry-url: https://registry.npmjs.org
      - name: Pin npm CLI
        run: npm install --global npm@10.9.2 --no-audit --no-fund
      - name: Verify pinned Node.js and npm environment
        run: |
          test "$(node --version | cut -d. -f1)" = "v22"
          test "$(npm --version)" = "10.9.2"
          npm config set registry https://registry.npmjs.org/
          test "$(npm config get registry)" = "https://registry.npmjs.org/"
      - name: Verify npm cache integrity
        run: npm cache verify
