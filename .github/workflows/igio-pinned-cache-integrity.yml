name: IGIO Pinned Offline Cache Integrity

on:
  pull_request:
    paths:
      - 'scripts/geospatial/verify_igio_footprint_cache.py'
      - 'scripts/geospatial/test_verify_igio_footprint_cache.py'
      - 'scripts/geospatial/acquire-and-enrich-igio-posey-buildings.py'
      - 'offline_packages/README.md'
      - '.github/workflows/igio-pinned-cache-integrity.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/geospatial/verify_igio_footprint_cache.py'
      - 'scripts/geospatial/test_verify_igio_footprint_cache.py'
      - 'scripts/geospatial/acquire-and-enrich-igio-posey-buildings.py'
      - 'offline_packages/README.md'
      - '.github/workflows/igio-pinned-cache-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  igio-offline-cache:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install pinned IGIO geometry acquisition dependencies
        run: python -m pip install --disable-pip-version-check --no-input 'numpy==2.1.3' 'rasterio==1.4.3' 'shapely==2.0.6'
      - name: Compile IGIO verifier and acquisition code
        run: |
          python -m py_compile \
            scripts/geospatial/verify_igio_footprint_cache.py \
            scripts/geospatial/acquire-and-enrich-igio-posey-buildings.py \
            scripts/geospatial/test_verify_igio_footprint_cache.py
      - name: Validate pinned offline cache and outage behavior
        run: python -m unittest scripts.geospatial.test_verify_igio_footprint_cache -v
