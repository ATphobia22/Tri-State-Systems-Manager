name: TSM Buildings 3D Tiles Artifact

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: tsm-buildings-3d-tiles-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tsm-console/package-lock.json
      - name: Install locked console dependencies
        working-directory: tsm-console
        run: npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
      - name: Install pinned CI-only external tooling
        env:
          TSM_INSTALL_EXTERNAL_TOOLING: 'true'
        run: node scripts/ci/install-external-tooling.mjs
      - name: Validate external tooling
        env:
          TSM_REQUIRE_EXTERNAL_TOOLING: 'true'
        run: node scripts/ci/validate-external-tooling.mjs
      - name: Build, stitch, compress and validate building tiles
        env:
          EXPECTED_BUILDINGS: '4121'
          HLOD_MAX_ITEMS: '50'
          HLOD_MAX_DEPTH: '6'
        run: scripts/geospatial/build-building-3d-tiles-pipeline.sh /tmp/tsm-buildings
      - name: Validate with Cesium 3D Tiles validator
        working-directory: tsm-console
        run: npx --no-install 3d-tiles-validator --tilesetFile /tmp/tsm-buildings/compressed/tileset.json
      - name: Validate final GLBs with glTF Transform
        working-directory: tsm-console
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            ./node_modules/.bin/gltf-transform validate "$file" --limit 1
          done < <(find /tmp/tsm-buildings/compressed -type f -name '*.glb' -print0 | sort -z)
      - name: Package versioned artifact
        env:
          ARTIFACT_VERSION: v1
        run: scripts/geospatial/package-building-3d-tiles.sh /tmp/tsm-buildings/compressed /tmp/tsm-artifacts "$ARTIFACT_VERSION" "$GITHUB_SHA"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tsm-buildings-3d-tiles-${{ github.sha }}
          path: |
            /tmp/tsm-artifacts/*.zip
            /tmp/tsm-artifacts/*.zip.sha256
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
