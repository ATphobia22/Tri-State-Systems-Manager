name: Canonical Twin Contracts
on:
  pull_request:
    paths:
      - 'schemas/core/**'
      - 'schemas/assets/**'
      - 'tests/test_canonical_contracts.py'
      - '.github/workflows/canonical-twin-contracts.yml'
  push:
    branches: [main]
    paths:
      - 'schemas/core/**'
      - 'schemas/assets/**'
      - 'tests/test_canonical_contracts.py'
      - '.github/workflows/canonical-twin-contracts.yml'
permissions:
  contents: read
jobs:
  schema-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'jsonschema[format]>=4.22,<5'
      - run: python -m unittest discover -s tests -p test_canonical_contracts.py -v
