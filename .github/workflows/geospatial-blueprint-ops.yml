name: Geospatial Blueprint Ops

on:
  push:
    branches: [main]
    paths:
      - 'scripts/geospatial/**'
      - 'tsm-console/src/geospatial/**'
      - 'tsm-console/src/lib/**'
      - 'tsm-console/src/gpu/**'
      - 'tsm-console/src/components/WebGpuTerrainCanvas.tsx'
      - 'tsm-console/src/components/ThreeDTilesLayer.tsx'
      - 'tsm-console/tests/**'
      - '.github/workflows/geospatial-blueprint-ops.yml'
  pull_request:
    paths:
      - 'scripts/geospatial/**'
      - 'tsm-console/src/geospatial/**'
      - 'tsm-console/src/lib/**'
      - 'tsm-console/src/gpu/**'
      - 'tsm-console/src/components/WebGpuTerrainCanvas.tsx'
      - 'tsm-console/src/components/ThreeDTilesLayer.tsx'
      - 'tsm-console/tests/**'
      - '.github/workflows/geospatial-blueprint-ops.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geospatial-blueprint-ops-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-ops:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install minimal Python deps
        run: pip install --quiet numpy
      - name: Install raster evidence dependencies
        run: pip install --quiet rasterio shapely
      - name: Transvoxel class tables
        run: python3 scripts/geospatial/transvoxel_tables.py
      - name: Regenerate Lengyel tables from MIT upstream
        run: python3 scripts/geospatial/regenerate_lengyel_tables.py
      - name: Compile DEM-to-Transvoxel bridge and consumers
        run: python3 -m py_compile scripts/geospatial/dem_to_transvoxel.py scripts/geospatial/transvoxel_complete.py scripts/geospatial/transvoxel_stitch_poc.py
      - name: Test production DEM bridge contract and synthetic pipeline
        run: python3 -m unittest scripts/geospatial/test_dem_to_transvoxel_api.py
      - name: Test Transvoxel JSON adapter
        run: python3 -m unittest scripts/geospatial/test_dem_to_transvoxel_cli.py
      - name: Test bounded provider retry and fail-closed behavior
        run: python3 -m unittest scripts/geospatial/test_posey_3dep_provider_recovery.py
      - name: Download real USGS 3DEP terrain for Posey County ZIP 47620
        id: terrain
        shell: bash
        run: |
          output_dir="$RUNNER_TEMP/tsm-posey-47620-evidence"
          if python3 scripts/geospatial/acquire-posey-47620-3dep.py --output-dir "$output_dir"; then
            echo "real_data_available=true" >> "$GITHUB_OUTPUT"
            echo "### Live 3DEP: REAL_DATA_SCREENING_ONLY (unapproved AOI; not survey-grade)" >> "$GITHUB_STEP_SUMMARY"
          else
            status=$?
            if [[ "$status" -eq 75 && -f "$output_dir/posey-county-47620-source-unavailable.json" ]]; then
              echo "real_data_available=false" >> "$GITHUB_OUTPUT"
              echo "### Live 3DEP: SOURCE_UNAVAILABLE (not verified)" >> "$GITHUB_STEP_SUMMARY"
              echo "No real-DEM benchmark is authorized. See the negative-evidence artifact. Local deterministic validations will still run." >> "$GITHUB_STEP_SUMMARY"
              echo "::warning::Authoritative terrain acquisition unavailable after bounded retries; no terrain verification or approval claimed"
            else
              echo "::error::Terrain acquisition/data-validation failure (exit $status); not classified as an upstream outage"
              exit "$status"
            fi
          fi
      - name: Audit complete CRS and vertical-datum catalog
        run: node scripts/geospatial/report-crs-datum-catalog.mjs "$RUNNER_TEMP/tsm-posey-47620-evidence/crs-datum-catalog-report.json"
      - name: Run real-DEM Transvoxel transition benchmark
        if: steps.terrain.outputs.real_data_available == 'true'
        run: >-
          python3 scripts/geospatial/benchmark-real-dem-transvoxel.py
          --raster "$RUNNER_TEMP/tsm-posey-47620-evidence/posey-county-47620-usgs-3dep-screening.tif"
          --evidence "$RUNNER_TEMP/tsm-posey-47620-evidence/posey-county-47620-terrain-evidence.json"
          --output "$RUNNER_TEMP/tsm-posey-47620-evidence/real-dem-transvoxel-benchmark.json"
      - name: Upload Posey County ZIP 47620 terrain bundle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: posey-county-47620-terrain-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/tsm-posey-47620-evidence/
          retention-days: 30
      - name: Transition mesh self-test
        run: python3 scripts/geospatial/transvoxel_transition_mesh.py --self-test
      - name: Synthetic DEM Transvoxel Stage 1–2
        run: python3 scripts/geospatial/dem_to_transvoxel_selftest.py
      - name: CityJSON → 3D Tiles chain self-test
        run: python3 scripts/geospatial/cityjson_to_3d_tiles.py --self-test
      - name: Live SSE cert (published tileset)
        run: python3 scripts/geospatial/sse_live_cert.py

  console-stream-types:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tsm-console/package-lock.json
      - name: Pin npm
        run: npm install --global npm@10.9.2 --no-audit --no-fund
      - name: Install
        working-directory: tsm-console
        run: npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
      - name: Typecheck geospatial stream modules
        working-directory: tsm-console
        run: npx --no-install tsc --noEmit
      - name: Tile-stream unit tests
        working-directory: tsm-console
        run: node --test src/geospatial/tile-stream-controller.test.mjs
      - name: Exhaustive TypeScript Transvoxel mesher tests
        working-directory: tsm-console
        run: npx --no-install vitest run tests/transvoxel-stitcher.test.ts
      - name: WebGPU capability probe tests
        working-directory: tsm-console
        run: node --experimental-strip-types --test tests/webgpu-capabilities.test.mjs tests/terrain-benchmark.test.mjs
      - name: GPU H-Z culling contract and conservative-coverage tests
        working-directory: tsm-console
        run: npx --no-install vitest run tests/webgpu-hz-cull.test.ts tests/webgpu-hz-reference.test.ts
      - name: Production console build
        working-directory: tsm-console
        run: npm run build
