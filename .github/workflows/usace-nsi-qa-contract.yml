name: USACE NSI 2026 cross-source QA contract

on:
  push:
    branches: [main]
    paths:
      - scripts/geospatial/reconcile_usace_nsi_2026.py
      - scripts/geospatial/test_reconcile_usace_nsi_2026.py
      - .github/workflows/usace-nsi-qa-contract.yml
  pull_request:
    paths:
      - scripts/geospatial/reconcile_usace_nsi_2026.py
      - scripts/geospatial/test_reconcile_usace_nsi_2026.py
      - .github/workflows/usace-nsi-qa-contract.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa-synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install pinned geometry libraries
        run: python -m pip install --disable-pip-version-check --no-cache-dir --no-input 'numpy==2.1.3' 'shapely==2.0.6'
      - name: Compile source-validation scripts
        run: python -m py_compile scripts/geospatial/reconcile_usace_nsi_2026.py scripts/geospatial/test_reconcile_usace_nsi_2026.py
      - name: Run 13 synthetic NSI-vs-IGIO checks
        run: python scripts/geospatial/test_reconcile_usace_nsi_2026.py -v
