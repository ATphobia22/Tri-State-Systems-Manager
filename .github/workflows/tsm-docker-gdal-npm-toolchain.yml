name: TSM Docker GDAL npm DNS Toolchain

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tsm-console/**'
      - 'data/**'
      - 'scripts/geospatial/**'
      - 'scripts/ci/**'
      - '.github/workflows/tsm-docker-gdal-npm-toolchain.yml'
  push:
    branches: [main]
    paths:
      - 'tsm-console/**'
      - 'data/**'
      - 'scripts/geospatial/**'
      - 'scripts/ci/**'
      - '.github/workflows/tsm-docker-gdal-npm-toolchain.yml'

permissions:
  contents: read

concurrency:
  group: tsm-toolchain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-gdal-npm:
    name: Docker + GDAL + npm/GitHub DNS
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tsm-console/package-lock.json
          registry-url: https://registry.npmjs.org

      - name: Pin npm CLI
        run: npm install --global npm@10.9.2 --no-audit --no-fund

      - name: Verify Node/npm
        run: |
          set -euo pipefail
          test "$(node --version | cut -d. -f1)" = "v22"
          test "$(npm --version)" = "10.9.2"
          node --version
          npm --version

      - name: Verify DNS resolution
        run: |
          set -euo pipefail
          for host in github.com api.github.com registry.npmjs.org registry-1.docker.io ghcr.io; do
            echo "== DNS: $host =="
            getent hosts "$host"
          done

      - name: Verify npm registry connectivity
        working-directory: tsm-console
        run: |
          set -euo pipefail
          npm config set registry https://registry.npmjs.org
          npm config get registry
          npm ping --registry=https://registry.npmjs.org
          npm view react version --registry=https://registry.npmjs.org

      - name: Install locked npm dependencies
        working-directory: tsm-console
        run: npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org

      - name: Verify Docker engine
        run: |
          set -euo pipefail
          docker version
          docker info --format 'Server={{.ServerVersion}} Storage={{.Driver}}'

      - name: Verify GDAL container
        env:
          GDAL_IMAGE: ghcr.io/osgeo/gdal:ubuntu-small-3.12.3
        run: |
          set -euo pipefail
          docker pull "${GDAL_IMAGE}"
          docker run --rm "${GDAL_IMAGE}" gdalinfo --version
          docker run --rm "${GDAL_IMAGE}" ogrinfo --version
          docker run --rm "${GDAL_IMAGE}" projinfo --version || true

      - name: Validate committed GeoTIFF with GDAL
        env:
          GDAL_IMAGE: ghcr.io/osgeo/gdal:ubuntu-small-3.12.3
        run: |
          set -euo pipefail
          test -s data/posey-county/elevation/posey-county-dem-30m.tif
          docker run --rm -v "${GITHUB_WORKSPACE}:/workspace:ro" "${GDAL_IMAGE}" \
            gdalinfo /workspace/data/posey-county/elevation/posey-county-dem-30m.tif

      - name: Validate committed GeoJSON with OGR
        env:
          GDAL_IMAGE: ghcr.io/osgeo/gdal:ubuntu-small-3.12.3
        run: |
          set -euo pipefail
          test -s data/posey-county/parcels/posey-parcels-2025.geojson
          docker run --rm -v "${GITHUB_WORKSPACE}:/workspace:ro" "${GDAL_IMAGE}" \
            ogrinfo -ro -so /workspace/data/posey-county/parcels/posey-parcels-2025.geojson

      - name: Build TSM production Docker image
        run: |
          set -euo pipefail
          docker build --pull -f tsm-console/Dockerfile -t tsm-console:toolchain-gate .

      - name: Inspect resulting image
        run: |
          set -euo pipefail
          docker image inspect tsm-console:toolchain-gate --format '{{.Id}} {{.Size}}'
