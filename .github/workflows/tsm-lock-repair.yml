name: TSM Lockfile Verification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tsm-console/package.json'
      - 'tsm-console/package-lock.json'
  pull_request:
    branches: [main]
    paths:
      - 'tsm-console/package.json'
      - 'tsm-console/package-lock.json'
      - '.github/workflows/tsm-lock-repair.yml'

permissions:
  contents: read

concurrency:
  group: tsm-lock-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tsm-console
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tsm-console/package-lock.json
          registry-url: https://registry.npmjs.org

      - name: Configure public npm registry
        run: npm config set registry https://registry.npmjs.org

      - name: Verify locked install
        run: npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org

      - name: Verify lockfile has no private mirror URLs
        run: |
          if grep -Eqi '35\.245\.43\.102|http://[^ ]*/npm/' package-lock.json; then
            echo 'ERROR: package-lock.json contains a private or insecure package mirror URL.'
            grep -Ein '35\.245\.43\.102|http://[^ ]*/npm/' package-lock.json | head -20
            exit 1
          fi

      - name: Verify package metadata and lockfile are synchronized
        run: |
          cp package-lock.json /tmp/tsm-package-lock.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
          if ! cmp -s package-lock.json /tmp/tsm-package-lock.json; then
            echo 'ERROR: package-lock.json is not synchronized with package.json.'
            git --no-pager diff -- package-lock.json
            exit 1
          fi
