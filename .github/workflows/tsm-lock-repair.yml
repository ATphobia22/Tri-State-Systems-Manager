name: TSM Lockfile Repair

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tsm-console/package.json'

permissions:
  contents: write

concurrency:
  group: tsm-lock-repair-main
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tsm-console
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Configure public npm registry
        run: npm config set registry https://registry.npmjs.org
      - name: Recreate lockfile from scratch
        run: |
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
      - name: Verify locked install
        run: npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
      - name: Verify lockfile has no private mirror URLs
        run: |
          if grep -Eqi '35\.245\.43\.102|http://[^ ]*/npm/' package-lock.json; then
            echo 'ERROR: package-lock.json still contains a private package mirror URL.'
            grep -Ein '35\.245\.43\.102|http://[^ ]*/npm/' package-lock.json | head -20
            exit 1
          fi
      - name: Commit repaired lockfile
        working-directory: .
        run: |
          if git diff --quiet -- tsm-console/package-lock.json; then
            echo 'Lockfile already synchronized with the public registry.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tsm-console/package-lock.json
          git commit -m 'build: regenerate npm lockfile from public registry'
          git push
