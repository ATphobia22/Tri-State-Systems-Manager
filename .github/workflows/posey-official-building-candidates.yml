name: Posey Official Building Identity Recovery Candidates
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/geospatial/recover_posey_missing_building_candidates.py'
      - 'backend/tests/test_posey_live_building_candidates.py'
      - 'scripts/geospatial/verify_posey_candidate_reconciliation.py'
      - 'backend/tests/test_posey_merkle_reconciliation.py'
      - 'backend/tests/test_posey_screening_inventory_staging.py'
      - 'scripts/geospatial/stage_posey_screening_inventory.py'
      - '.github/workflows/posey-official-building-candidates.yml'
  schedule:
    - cron: '41 7 * * 1'
permissions:
  contents: read
concurrency:
  group: posey-official-building-candidates-${{ github.ref }}
  cancel-in-progress: false
jobs:
  contract-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: python -m py_compile scripts/geospatial/recover_posey_missing_building_candidates.py scripts/geospatial/stage_posey_screening_inventory.py backend/tests/test_posey_live_building_candidates.py backend/tests/test_posey_screening_inventory_staging.py
      - run: python -m unittest backend.tests.test_posey_live_building_candidates backend.tests.test_posey_screening_inventory_staging -v
  retrieve-unverified-candidates:
    needs: contract-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Fetch exact missing IDs from official Indiana Geoportal
        run: |
          python scripts/geospatial/recover_posey_missing_building_candidates.py \
            --output "${RUNNER_TEMP}/posey-official-missing-candidates.geojson"
          python - <<'PY'
          import hashlib,json,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'posey-official-missing-candidates.geojson'
          manifest=json.loads(pathlib.Path(str(p)+'.provenance.json').read_text())
          assert hashlib.sha256(p.read_bytes()).hexdigest()==manifest['sha256']
          assert manifest['regulatoryUse'] is False and manifest['engineeringUse'] is False
          assert manifest['validationStatus']=='UNVERIFIED'
          print('OFFICIAL_SOURCE_CANDIDATES_RETRIEVED_NOT_PUBLISHED')
          PY
      - name: Acquire hash-pinned archived baseline and stage complete 2D ID coverage
        shell: bash
        run: |
          set -euo pipefail
          BASELINE="${RUNNER_TEMP}/posey-archived-23082.geojson"
          # The anonymous release CDN occasionally responds with 504 even when
          # the release asset exists. Prefer authenticated GitHub API download.
          downloaded=0
          for attempt in 1 2 3; do
            if GH_TOKEN="${{ github.token }}" gh release download igio-posey-20261006 \
                --repo ATphobia22/Tri-State-Systems-Manager \
                --pattern posey-buildings-igio-23082.geojson \
                --dir "${RUNNER_TEMP}" --clobber; then
              mv "${RUNNER_TEMP}/posey-buildings-igio-23082.geojson" "$BASELINE"
              downloaded=1
              break
            fi
            sleep $((attempt * 5))
          done
          if [ "$downloaded" -ne 1 ]; then
            echo "::error::Archived official Posey baseline release asset unavailable after authenticated retries; screening inventory NOT verified"
            exit 1
          fi
          echo "d8a46b86616becfdea9c9164e7a219317d5963b86fba47e4c1f8f880ccbb559f  $BASELINE" | sha256sum --check -
          python scripts/geospatial/stage_posey_screening_inventory.py \
            --published tsm-console/public/3d-tiles/buildings-3d.json \
            --archived "$BASELINE" \
            --candidates "${RUNNER_TEMP}/posey-official-missing-candidates.geojson" \
            --delta data/buildings/POSEY-ARCHIVED-IGIO-IDENTITY-DELTA-2026-10-25.json \
            --output "${RUNNER_TEMP}/posey-2d-screening-23082.geojson"
      - name: Upload 2D screening-only inventory and candidate review evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: posey-2d-screening-coverage-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/posey-2d-screening-23082.geojson
            ${{ runner.temp }}/posey-2d-screening-23082.geojson.manifest.json
          if-no-files-found: warn
          retention-days: 30
      - name: Upload official candidates for geometry and lineage review
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: posey-building-candidates-${{ github.run_id }}
          path: ${{ runner.temp }}/posey-official-missing-candidates.geojson*
          if-no-files-found: warn
          retention-days: 30
