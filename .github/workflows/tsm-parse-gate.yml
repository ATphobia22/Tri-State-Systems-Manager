name: TSM Parse Gate

on:
  push:
  pull_request:

jobs:
  parse-and-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tsm-console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tsm-console/package.json
      - run: npm ci --ignore-scripts
      - run: npm run check:parse
      - run: npm run check:type
