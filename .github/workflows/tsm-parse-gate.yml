name: TSM Parse Gate

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tsm-parse-gate-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  NPM_VERSION: '10.9.2'
  NPM_REGISTRY: 'https://registry.npmjs.org'

jobs:
  parse-type-build-test:
    name: Parse / Typecheck / Geospatial Contract / Build / Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tsm-console
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: ${{ env.NPM_REGISTRY }}
          cache: npm
          cache-dependency-path: tsm-console/package-lock.json
      - name: Pin npm toolchain
        run: npm install --global "npm@${NPM_VERSION}"
      - name: Verify toolchain
        run: |
          node --version
          npm --version
          test "$(npm --version)" = "$NPM_VERSION"
      - name: Configure public npm registry
        run: npm config set registry "$NPM_REGISTRY"
      - name: Verify lockfile registry provenance
        run: |
          node <<'NODE'
          const fs = require('fs');
          const lockfile = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const violations = [];
          for (const [packagePath, metadata] of Object.entries(lockfile.packages ?? {})) {
            if (typeof metadata?.resolved !== 'string') continue;
            try {
              const url = new URL(metadata.resolved);
              if (url.hostname !== 'registry.npmjs.org') violations.push(`${packagePath}: ${metadata.resolved}`);
            } catch {
              violations.push(`${packagePath}: invalid resolved URL ${metadata.resolved}`);
            }
          }
          if (violations.length) {
            console.error('ERROR: package-lock.json contains non-public resolved package URLs.');
            for (const violation of violations.slice(0, 20)) console.error(violation);
            process.exit(1);
          }
          console.log('Lockfile provenance check passed.');
          NODE
      - name: Verify lockfile reproducibility
        run: |
          cp package-lock.json package-lock.json.ci-baseline
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --registry="$NPM_REGISTRY"
          diff -u package-lock.json.ci-baseline package-lock.json
          rm package-lock.json.ci-baseline
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund --registry="$NPM_REGISTRY"
      - name: Repository integrity gate
        run: npm run check:integrity
      - name: Site consistency gate
        run: npm run check:site-consistency
      - name: Geospatial processing contract gate
        run: npm run check:geospatial
      - name: Parse diagnostic report
        if: always()
        run: |
          mkdir -p artifacts
          set +e
          npm run check:parse > artifacts/parse-gate.txt 2>&1
          status=$?
          set -e
          cat artifacts/parse-gate.txt
          if [ "$status" -ne 0 ]; then echo "Parse diagnostic captured; authoritative parse gate remains fail-closed."; fi
      - name: Parse gate
        run: npm run check:parse
      - name: Upload parse diagnostic
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tsm-parse-diagnostic
          path: tsm-console/artifacts/parse-gate.txt
          if-no-files-found: warn
      - name: Typecheck
        run: npm run check:type
      - name: Production build
        run: npm run build
      - name: Test suite diagnostic report
        if: always()
        run: |
          mkdir -p artifacts
          set +e
          npm run test:all > artifacts/test-all.txt 2>&1
          status=$?
          set -e
          cat artifacts/test-all.txt
          if [ "$status" -ne 0 ]; then echo "Test diagnostic captured; authoritative test suite remains fail-closed."; fi
      - name: Test suite
        run: npm run test:all
