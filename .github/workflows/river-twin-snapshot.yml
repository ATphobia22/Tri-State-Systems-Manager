name: Ohio–Wabash river twin evidence
on:
  pull_request:
    paths:
      - scripts/hydrology/river_twin_snapshot.py
      - backend/engineering/stage_calibration_gate.py
      - tests/test_river_twin_snapshot.py
      - .github/workflows/river-twin-snapshot.yml
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  river-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Verify synchronized snapshot and offline comparison
        run: python -m unittest discover -s tests -p test_river_twin_snapshot.py -v
      - name: Capture authoritative USGS responses
        if: github.event_name != 'pull_request'
        run: python scripts/hydrology/river_twin_snapshot.py capture river-snapshot
      - name: Export captured source as a portable community COP layer
        if: github.event_name != 'pull_request'
        working-directory: services/living-twin
        run: |
          docker compose build consumer
          docker compose run --rm -T --no-deps -v "$GITHUB_WORKSPACE/river-snapshot:/snapshot:ro" consumer sh -ec '
            python -m twin.offline_bundle build /snapshot /tmp/cop-bundle >&2
            python -m twin.community_cop /tmp/cop-bundle /tmp/community-cop.geojson >&2
            cat /tmp/community-cop.geojson
          ' > "$RUNNER_TEMP/community-cop.geojson"
          mkdir -p "$GITHUB_WORKSPACE/community-cop"
          mv "$RUNNER_TEMP/community-cop.geojson" "$GITHUB_WORKSPACE/community-cop/"
          cd "$GITHUB_WORKSPACE/community-cop"
          sha256sum community-cop.geojson > SHA256SUMS
      - name: Retain local observation layer for review
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: community-cop-observation-layer
          path: community-cop/
          if-no-files-found: error
          retention-days: 30
      - name: Verify observations through Redpanda, PostGIS and the projection kernel
        if: github.event_name != 'pull_request'
        working-directory: services/living-twin
        run: |
          docker compose up -d --build consumer kernel
          docker compose run --rm -T --no-deps -v "$GITHUB_WORKSPACE/river-snapshot:/snapshot:ro" consumer python -m twin.project_usgs /snapshot > "$RUNNER_TEMP/river-projection.json"
          mv "$RUNNER_TEMP/river-projection.json" "$GITHUB_WORKSPACE/river-snapshot/projection-receipt.json"
      - name: Stop disposable verification stack
        if: always() && github.event_name != 'pull_request'
        working-directory: services/living-twin
        run: docker compose down --volumes
      - name: Preserve snapshot and station availability
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ohio-wabash-river-observations
          path: river-snapshot/
          if-no-files-found: error
          retention-days: 30
