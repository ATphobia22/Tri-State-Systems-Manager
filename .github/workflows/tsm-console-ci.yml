name: TSM Console CI

on:
  push:
    branches: [main]
    paths:
      - 'tsm-console/**'
      - '.github/workflows/tsm-console-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tsm-console/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tsm-console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tsm-console/package-lock.json
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Parse gate
        run: npm run check:parse
      - name: Typecheck
        run: npm run check:type
      - name: Production build
        run: npm run build
      - name: Upload dist
        uses: actions/upload-artifact@v7
        with:
          name: tsm-console-dist
          path: tsm-console/dist
