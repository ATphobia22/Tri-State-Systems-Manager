name: TSM Console CI

on:
  push:
    branches: [main]
    paths:
      - 'tsm-console/**'
      - '.github/workflows/tsm-console-ci.yml'
      - '.github/workflows/tsm-lock-repair.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tsm-console/**'
      - '.github/workflows/tsm-console-ci.yml'
      - '.github/workflows/tsm-lock-repair.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tsm-console-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tsm-console
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: tsm-console/package-lock.json
      - name: Configure public npm registry
        run: npm config set registry https://registry.npmjs.org
      - name: Verify lockfile registry provenance
        run: |
          node <<'NODE'
          const fs = require('fs');
          const lockfile = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const violations = [];
          for (const [packagePath, metadata] of Object.entries(lockfile.packages ?? {})) {
            if (typeof metadata?.resolved !== 'string') continue;
            try {
              const url = new URL(metadata.resolved);
              if (url.hostname !== 'registry.npmjs.org') violations.push(`${packagePath}: ${metadata.resolved}`);
            } catch {
              violations.push(`${packagePath}: invalid resolved URL ${metadata.resolved}`);
            }
          }
          if (violations.length) {
            console.error('ERROR: package-lock.json contains non-public resolved package URLs.');
            for (const violation of violations.slice(0, 20)) console.error(violation);
            process.exit(1);
          }
          console.log('Lockfile provenance check passed.');
          NODE
      - name: Verify lockfile reproducibility
        run: |
          cp package-lock.json package-lock.json.ci-baseline
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
          diff -u package-lock.json.ci-baseline package-lock.json
          rm package-lock.json.ci-baseline
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
      - name: Parse gate
        run: npm run check:parse
      - name: Typecheck
        run: npm run check:type
      - name: Production build
        run: npm run build
      - name: Test suite
        run: npm run test:all
      - name: Upload dist
        uses: actions/upload-artifact@v6
        with:
          name: tsm-console-dist
          path: tsm-console/dist
          if-no-files-found: error
