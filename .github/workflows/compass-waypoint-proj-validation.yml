name: Compass Waypoint PROJ Evidence Gate

on:
  pull_request:
    paths:
      - 'schemas/compass-waypoint.schema.json'
      - 'scripts/geospatial/validate_compass_waypoints.py'
      - 'scripts/geospatial/test_validate_compass_waypoints.py'
      - '.github/workflows/compass-waypoint-proj-validation.yml'
  push:
    branches: [main]
    paths:
      - 'schemas/compass-waypoint.schema.json'
      - 'scripts/geospatial/validate_compass_waypoints.py'
      - 'scripts/geospatial/test_validate_compass_waypoints.py'
      - '.github/workflows/compass-waypoint-proj-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  waypoint-datum:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PROJ_NETWORK: 'OFF'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install pinned CRS and schema validators
        run: python -m pip install --disable-pip-version-check --no-input 'pyproj==3.8.0' 'jsonschema==4.23.0'
      - name: Compile geodetic validator and tests
        run: python -m py_compile scripts/geospatial/validate_compass_waypoints.py scripts/geospatial/test_validate_compass_waypoints.py
      - name: Reject incompatible datums and validate safe public diagnostics
        run: python -m unittest scripts.geospatial.test_validate_compass_waypoints -v
