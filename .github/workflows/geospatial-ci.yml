name: TSM Geospatial Capability CI

on:
  workflow_dispatch:
    inputs:
      cityengine_build:
        description: 'Run the licensed CityEngine/Unreal build on a dedicated runner'
        required: true
        default: false
        type: boolean
  pull_request:
    paths:
      - 'backend/geospatial/**'
      - 'backend/engineering/**'
      - 'backend/tests/test_geospatial_contracts.py'
      - 'backend/tests/test_hec_ras_worker.py'
      - 'backend/tests/test_hecras_geometry.py'
      - 'integrations/geospatial/**'
      - 'integrations/cityengine/**'
      - 'integrations/routing/**'
      - 'integrations/engineering/**'
      - 'integrations/open-world/**'
      - 'integrations/authoring/**'
      - 'integrations/unity-mcp/**'
      - 'integrations/runtime/**'
      - 'integrations/third-party-toolchain.json'
      - 'ops/osrm-routing.Dockerfile'
      - 'ops/cadquery-worker.Dockerfile'
      - 'integrations/registry/**'
      - 'scripts/geospatial/**'
      - 'scripts/geo/**'
      - 'tsm-console/tests/supabase-parcel-bbox.test.ts'
      - 'tsm-console/tests/supabase-parcel-bbox-contract.test.mjs'
      - 'tsm-console/src/lib/supabase-parcel-bbox.ts'
      - 'tsm-console/src/lib/pmtiles-overlay.ts'
      - 'tsm-console/src/components/RealWorldTwinMap.tsx'
      - 'tsm-console/.env.example'
      - 'supabase/migrations/**'
      - 'scripts/ci/**'
      - 'packages/geo/**'
      - 'docs/fabrics/nfhl-geometry-types.json'
      - 'tsm-console/package.json'
      - 'tsm-console/package-lock.json'
      - 'tsm-console/src/integrations/mapillary/**'
      - 'tsm-console/src/lib/nfhl/**'
      - 'tsm-console/tests/mapillary-evidence-contract.test.ts'
      - 'tsm-console/tests/nfhl-registry-contract.test.mjs'
      - 'data/fabrics/earth-observation-research-integration-v1.json'
      - 'scripts/ci/validate-earth-observation-research-integration.mjs'
      - 'tsm-console/tests/earth-observation-research-integration.test.ts'
      - '.github/workflows/geospatial-ci.yml'
      - 'artifacts/tsm-geospatial-tile-fabric-v1.json'
      - 'tsm-console/server/ingestion/**'
      - 'tsm-console/src/lib/data-fabric-registry.ts'
      - 'tsm-console/src/lib/map-layers.ts'
      - 'tsm-console/tests/data-fabric-registry.test.ts'
      - 'data/engineering/**'
      - 'data/schemas/engineering-evidence-pipeline-v1.schema.json'
      - 'data/schemas/hec-ras-2d-boundary-conditions.schema.json'
      - 'data/grants/tsm-v35-grant-rules-v1.json'
      - 'docs/ENGINEERING-EVIDENCE-PIPELINE.md'
      - 'scripts/ci/validate-engineering-pipeline.mjs'
      - 'scripts/ci/install-external-tooling.mjs'
      - 'scripts/ci/validate-external-tooling.mjs'
      - 'scripts/ci/validate-3d-tiles-tools.mjs'
  push:
    branches: [main]
    paths:
      - 'backend/geospatial/**'
      - 'backend/engineering/**'
      - 'backend/tests/test_geospatial_contracts.py'
      - 'backend/tests/test_hec_ras_worker.py'
      - 'integrations/geospatial/**'
      - 'integrations/cityengine/**'
      - 'integrations/routing/**'
      - 'integrations/engineering/**'
      - 'integrations/open-world/**'
      - 'integrations/authoring/**'
      - 'integrations/unity-mcp/**'
      - 'integrations/runtime/**'
      - 'integrations/third-party-toolchain.json'
      - 'ops/osrm-routing.Dockerfile'
      - 'ops/cadquery-worker.Dockerfile'
      - 'integrations/registry/**'
      - 'scripts/geospatial/**'
      - 'scripts/geo/**'
      - 'tsm-console/tests/supabase-parcel-bbox.test.ts'
      - 'tsm-console/tests/supabase-parcel-bbox-contract.test.mjs'
      - 'tsm-console/src/lib/supabase-parcel-bbox.ts'
      - 'tsm-console/src/lib/pmtiles-overlay.ts'
      - 'tsm-console/src/components/RealWorldTwinMap.tsx'
      - 'tsm-console/.env.example'
      - 'supabase/migrations/**'
      - 'scripts/ci/**'
      - 'packages/geo/**'
      - 'docs/fabrics/nfhl-geometry-types.json'
      - 'tsm-console/package.json'
      - 'tsm-console/package-lock.json'
      - 'tsm-console/src/integrations/mapillary/**'
      - 'tsm-console/src/lib/nfhl/**'
      - 'tsm-console/tests/nfhl-registry-contract.test.mjs'
      - 'tsm-console/tests/mapillary-evidence-contract.test.ts'
      - 'data/fabrics/earth-observation-research-integration-v1.json'
      - 'scripts/ci/validate-earth-observation-research-integration.mjs'
      - 'tsm-console/tests/earth-observation-research-integration.test.ts'
      - '.github/workflows/geospatial-ci.yml'

permissions:
  contents: read

concurrency:
  group: tsm-geospatial-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tsm-console/package-lock.json
      - name: Install locked console dependencies
        working-directory: tsm-console
        run: npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
      - name: Validate exact-county Esri geometry normalization
        run: node --test scripts/geo/validate-exact-county-arcgis-json.test.mjs
      - name: Validate Supabase PostGIS parcel contract
        working-directory: tsm-console
        run: node --test tests/supabase-parcel-bbox-contract.test.mjs
      - name: Validate Supabase parcel viewport unit tests
        working-directory: tsm-console
        run: ./node_modules/.bin/vitest run tests/supabase-parcel-bbox.test.ts
      - name: Validate capability registry
        run: node scripts/ci/validate-capability-registry.mjs
      - name: Run full-tree hardening gate
        run: python3 scripts/ci/full-tree-hardening.py
      - name: Install pinned CI-only external geospatial tooling
        env:
          TSM_INSTALL_EXTERNAL_TOOLING: 'true'
        run: node scripts/ci/install-external-tooling.mjs
      - name: Validate external capability toolchain
        env:
          TSM_REQUIRE_EXTERNAL_TOOLING: 'true'
        run: node scripts/ci/validate-external-tooling.mjs
      - name: Validate 3D Tiles tool contract
        run: node scripts/ci/validate-3d-tiles-tools.mjs
      - name: Validate open-source engine registry
        run: node scripts/ci/validate-open-source-engine-registry.mjs
      - name: Test open-source engine registry contract
        run: node --test scripts/ci/validate-open-source-engine-registry.test.mjs
      - name: Validate hydrology engine adapter registry
        run: node scripts/ci/validate-hydrology-engine-adapters.mjs
      - name: Test hydrology engine adapter contract
        run: node --test scripts/ci/validate-hydrology-engine-adapters.test.mjs
      - name: Validate Cesium Story publication manifest
        run: node scripts/ci/validate-cesium-story-manifest.mjs
      - name: Test Cesium Story publication safety gates
        run: node --test scripts/ci/validate-cesium-story-manifest.test.mjs
      - name: Validate station datum modernization policy
        run: node scripts/ci/validate-station-datum-policy.mjs
      - name: Validate FEMA BLE advisory layer separation
        run: node scripts/ci/validate-fema-ble-layer-contract.mjs
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Build PMTiles builder contract tests
        run: python3 -m unittest scripts.geospatial.test_build_pmtiles
      - name: Validate PMTiles v3 header integrity contract
        run: python3 -m unittest scripts.geospatial.test_validate_pmtiles
      - name: Install backend engineering dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r backend/requirements.txt
      - name: Test HLOD geometric-error propagation
        run: python3 scripts/geospatial/test_build_hlod_geometric_error.py
      - name: Test Transvoxel DEM production bridge and transition cell API
        run: |
          python3 -m py_compile scripts/geospatial/dem_to_transvoxel.py scripts/geospatial/transvoxel_complete.py scripts/geospatial/transvoxel_stitch_poc.py
          python3 -m unittest scripts.geospatial.test_dem_to_transvoxel_api scripts.geospatial.test_dem_to_transvoxel_cli -v
      - name: Verify published building screening count without fabricating missing IDs
        run: |
          python3 -m unittest scripts.geospatial.test_reconcile_published_buildings -v
          python3 scripts/geospatial/reconcile_published_buildings.py \
            --published tsm-console/public/3d-tiles/buildings-3d.json \
            --expected-count 23082 \
            --output "${RUNNER_TEMP}/posey-buildings-identity-audit.json"
      - name: Upload deterministic building identity audit
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # pinned
        with:
          name: posey-screening-building-identity-audit
          path: ${{ runner.temp }}/posey-buildings-identity-audit.json
          if-no-files-found: error
          retention-days: 14
      - name: Run geospatial backend contract tests
        run: python3 -m unittest backend.tests.test_geospatial_contracts backend.tests.test_hec_ras_worker backend.tests.test_hecras_geometry
      - name: Run Mapillary evidence contract tests
        working-directory: tsm-console
        run: npm run test:mapillary
      - name: NFHL registry contract (offline)
        working-directory: tsm-console
        run: node --test tests/nfhl-registry-contract.test.mjs
      - name: NFHL live MapServer drift validate
        # Pure Node — no root npm install / tsx required (CI only installs tsm-console)
        run: node packages/geo/src/nfhl/cli/validate-nfhl.mjs
      - name: Verify Docker engine and public registry DNS
        run: |
          set -euo pipefail
          docker version
          for host in registry.npmjs.org registry-1.docker.io ghcr.io github.com; do
            getent hosts "$host"
          done
          docker info --format 'Server={{.ServerVersion}} Storage={{.Driver}}'

      - name: Verify GDAL/OGR toolchain in container
        env:
          GDAL_IMAGE: ghcr.io/osgeo/gdal:ubuntu-small-3.12.3
        run: |
          set -euo pipefail
          docker pull "$GDAL_IMAGE"
          docker run --rm "$GDAL_IMAGE" gdalinfo --version
          docker run --rm "$GDAL_IMAGE" ogrinfo --version
          test -s data/posey-county/elevation/posey-county-dem-30m.tif
          test -s data/posey-county/parcels/posey-parcels-2025.geojson
          docker run --rm -v "$GITHUB_WORKSPACE:/workspace:ro" "$GDAL_IMAGE"             gdalinfo /workspace/data/posey-county/elevation/posey-county-dem-30m.tif
          docker run --rm -v "$GITHUB_WORKSPACE:/workspace:ro" "$GDAL_IMAGE"             ogrinfo -ro -so /workspace/data/posey-county/parcels/posey-parcels-2025.geojson

      - name: Validate satellite Earth-observation research source contract
        run: node scripts/ci/validate-earth-observation-research-integration.mjs
      - name: Test satellite Earth-observation research source contract
        working-directory: tsm-console
        run: ./node_modules/.bin/vitest run tests/earth-observation-research-integration.test.ts
      - name: Validate 3D asset manifests
        run: node scripts/ci/validate-artifact-manifests.mjs
      - name: Validate geospatial processing contract
        working-directory: tsm-console
        run: npm run check:geospatial
      - name: Validate evidence-gated engineering pipeline
        working-directory: tsm-console
        run: npm run check:engineering-pipeline

  cityengine-build:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.cityengine_build == true }}
    runs-on: [self-hosted, windows, cityengine]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate CityEngine environment
        shell: pwsh
        run: |
          if (-not (Test-Path integrations/cityengine)) { throw 'CityEngine integration directory is missing.' }
          Write-Host 'Dedicated CityEngine runner selected. Licensed Esri software must be provisioned by the operator.'
      - name: Execute configured licensed build
        shell: pwsh
        run: |
          if (-not $env:TSM_CITYENGINE_BUILD_COMMAND) {
            Write-Host 'No licensed build command configured; contract-only execution completed.'
            exit 0
          }
          & $env:TSM_CITYENGINE_BUILD_COMMAND
