name: Evidence catalog verification
on:
  push:
    branches: [main]
    paths: ['tools/evidence_catalog/**', 'tests/evidence_catalog/**', '.github/workflows/evidence-catalog.yml']
  pull_request:
    paths: ['tools/evidence_catalog/**', 'tests/evidence_catalog/**', '.github/workflows/evidence-catalog.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  catalog:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests/evidence_catalog -v
