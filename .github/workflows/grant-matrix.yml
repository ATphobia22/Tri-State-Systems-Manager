# 47620 / Posey County grant matrix integrity + refresh scaffold.
# Does NOT submit applications. Human authority remains final.
name: Grant Matrix

on:
  workflow_dispatch:
    inputs:
      note:
        description: "Operator note (optional)"
        required: false
        default: ""
  schedule:
    # Mondays 14:17 UTC — weekly integrity check of grant docs
    - cron: "17 14 * * 1"
  push:
    branches: [main]
    paths:
      - "docs/grants/**"
      - "scripts/ci/validate-grant-matrix.mjs"
      - ".github/workflows/grant-matrix.yml"
  pull_request:
    paths:
      - "docs/grants/**"
      - "scripts/ci/validate-grant-matrix.mjs"
      - ".github/workflows/grant-matrix.yml"

permissions:
  contents: read

concurrency:
  group: grant-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate grant matrix artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Validate grant matrix
        run: node scripts/ci/validate-grant-matrix.mjs

      - name: Summary
        if: always()
        run: |
          echo "## Grant matrix gate" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Path: \`docs/grants/\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Rule: TSM tracks deadlines and evidence packets only; **no auto-submit**." >> "$GITHUB_STEP_SUMMARY"
          echo "- Operator note: ${{ inputs.note || 'n/a' }}" >> "$GITHUB_STEP_SUMMARY"
          if [ -f docs/grants/DEADLINE-CALENDAR-30-60-90-2026-10-08.md ]; then
            echo "- Calendar present" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f docs/grants/47620-Grant-Master-Matrix-2026-10-08.xlsx ]; then
            echo "- Workbook present" >> "$GITHUB_STEP_SUMMARY"
          fi
