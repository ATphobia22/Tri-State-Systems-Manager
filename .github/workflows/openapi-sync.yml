name: OpenAPI Contract Sync

# Read-only drift validation. Generated contract changes require code review;
# no bot commit may advance main to a [skip ci] SHA without required checks.
on:
  pull_request:
    paths:
      - "backend/app/**"
      - "backend/api/**"
      - "backend/gov/**"
      - "backend/requirements.txt"
      - "scripts/ci/generate-openapi.py"
      - ".github/workflows/openapi-sync.yml"
  push:
    branches: [main]
    paths:
      - "backend/app/**"
      - "backend/api/**"
      - "backend/gov/**"
      - "backend/requirements.txt"
      - "scripts/ci/generate-openapi.py"
      - ".github/workflows/openapi-sync.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openapi-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: python -m pip install --disable-pip-version-check --no-input -r backend/requirements.txt

      - name: Check committed contract against live FastAPI routes
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/ci/generate-openapi.py --check --candidate "$RUNNER_TEMP/tsm-openapi-generated.json"

      - name: Upload comparison artifact when drift is detected
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # pinned
        with:
          name: openapi-contract-candidate
          path: ${{ runner.temp }}/tsm-openapi-generated.json
          if-no-files-found: ignore
          retention-days: 7
