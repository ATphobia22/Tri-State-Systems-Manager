name: OpenAPI Contract Sync

on:
  push:
    branches: [main]
    paths:
      - "backend/app/**"
      - "backend/api/**"
      - "backend/gov/**"
      - "backend/requirements.txt"
      - ".github/workflows/openapi-sync.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: openapi-sync-main
  cancel-in-progress: false

jobs:
  sync:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6.1.0
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: python -m pip install --disable-pip-version-check --no-input -r backend/requirements.txt

      - name: Generate OpenAPI from the live FastAPI route tree
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from backend.app.main import app

          output = Path("backend/app/openapi.json")
          schema = app.openapi()
          output.write_text(json.dumps(schema, indent=2) + "\n", encoding="utf-8")
          print(f"Generated {len(schema['paths'])} OpenAPI paths -> {output}")
          PY

      - name: Verify OpenAPI route inventory
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from backend.app.main import app

          committed = json.loads(Path("backend/app/openapi.json").read_text())
          live = app.openapi()
          assert committed["paths"] == live["paths"], "committed OpenAPI paths differ from FastAPI"
          assert committed["components"] == live["components"], "committed OpenAPI schemas differ from FastAPI"
          assert len(committed["paths"]) >= 17
          print(f"OpenAPI synchronized: {len(committed['paths'])} paths")
          PY

      - name: Commit synchronized OpenAPI
        run: |
          if git diff --quiet -- backend/app/openapi.json; then
            echo "OpenAPI already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/openapi.json
          git commit -m "chore(api): synchronize generated OpenAPI contract [skip ci]"
          git push
