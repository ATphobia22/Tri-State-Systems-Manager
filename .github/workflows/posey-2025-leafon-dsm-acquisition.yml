name: Indiana 2025 Official Four County Imagery And DSM Sample Acquisition

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/geospatial/acquire_posey_2025_leafon.py'
      - 'backend/tests/test_posey_2025_leafon_acquisition.py'
      - '.github/workflows/posey-2025-leafon-dsm-acquisition.yml'
      - 'scripts/geospatial/chunk_igio_tiff_for_drive.py'
      - 'backend/tests/test_chunk_igio_tiff_for_drive.py'
  push:
    branches: [main]
    paths:
      - 'scripts/geospatial/acquire_posey_2025_leafon.py'
      - 'backend/tests/test_posey_2025_leafon_acquisition.py'
      - '.github/workflows/posey-2025-leafon-dsm-acquisition.yml'
      - 'scripts/geospatial/chunk_igio_tiff_for_drive.py'
      - 'backend/tests/test_chunk_igio_tiff_for_drive.py'

permissions:
  contents: read

jobs:
  acquire-official-imagery-and-dsm:
    name: in2025-${{ matrix.county }}-paired-original-tile
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - county: Posey
            fips: "18129"
            stem: in2025_27179775_06
            expected: 2179
          - county: Gibson
            fips: "18051"
            stem: in2025_26901095_06
            expected: 2520
          - county: Vanderburgh
            fips: "18163"
            stem: in2025_27721000_06
            expected: 1246
          - county: Warrick
            fips: "18173"
            stem: in2025_28371012_06
            expected: 1966
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install GIS inspector and pinned unit tests
        run: python -m pip install --disable-pip-version-check rasterio==1.4.3 pytest==8.3.5
      - name: Verify official source allowlisting and raster horizontal CRS tests
        run: python -m pytest -q backend/tests/test_posey_2025_leafon_acquisition.py backend/tests/test_chunk_igio_tiff_for_drive.py
      - name: Download and inspect one actual official imagery/DSM TIFF pair
        run: |
          python scripts/geospatial/acquire_posey_2025_leafon.py \
            --county ${{ matrix.county }} \
            --output in2025-${{ matrix.fips }} \
            --tile-stem ${{ matrix.stem }} \
            --max-tiles 1 \
            --max-total-mib 700 \
            --max-file-mib 350 \
            --raster-inspect
      - name: Verify original TIFF SHA256 and source-vintage evidence
        env:
          TSM_FIPS: ${{ matrix.fips }}
          TSM_COUNTY: ${{ matrix.county }}
          TSM_STEM: ${{ matrix.stem }}
          TSM_EXPECTED: ${{ matrix.expected }}
        run: |
          python - <<'PY'
          import os
          import json
          import hashlib
          from pathlib import Path
          fips=os.environ['TSM_FIPS']
          root=Path(f"in2025-{fips}")
          r=json.loads((root/'acquisition-receipt.json').read_text())
          assert r['county_fips']==fips and r['county']==os.environ['TSM_COUNTY']
          assert r['selected_tile_stems']==[os.environ['TSM_STEM']]
          assert r['tile_stems_verified_countywide']==int(os.environ['TSM_EXPECTED'])
          assert len(r['downloaded_objects'])==4
          assert set(v['role'] for v in r['downloaded_objects']) == {'imagery2025','dsm2025','county_inventory'}
          for item in r['downloaded_objects']:
              p=Path(item['file'])
              assert p.is_file() and p.stat().st_size==item['bytes']
              assert hashlib.sha256(p.read_bytes()).hexdigest()==item['sha256']
          raster=r['raster_metadata'][os.environ['TSM_STEM']]
          assert set(raster)=={'imagery2025','dsm2025'}
          assert all(v['vertical_datum_verified'] is False for v in raster.values())
          assert r['horizontal_alignment'][os.environ['TSM_STEM']]['overlap'] is True
          assert r['engineering_approved'] is False
          assert r['complete_city_coverage_verified'] is False
          assert r['source_authenticity_independently_attested'] is False
          print({'county':fips,'downloaded_original_files':4,
                 'bytes':sum(item['bytes'] for item in r['downloaded_objects']),
                 'engineering_approved':False})
          PY
      - name: Split original imagery TIFF into two Drive-safe SHA256 chunks
        run: |
          python scripts/geospatial/chunk_igio_tiff_for_drive.py \
            --source-dir in2025-${{ matrix.fips }} \
            --output in2025-chunks-${{ matrix.fips }} \
            --chunk-mib 60
      - name: Verify reassembly byte integrity and metadata preservation
        env:
          TSM_FIPS: ${{ matrix.fips }}
        run: |
          python - <<'PY'
          import os,json,hashlib
          from pathlib import Path
          root=Path('in2025-chunks-'+os.environ['TSM_FIPS'])
          m=json.loads((root/'metadata'/'part-manifest.json').read_text())
          assert m['original_county_fips']==os.environ['TSM_FIPS']
          assert len(m['image_parts'])==2
          assert not m['engineering_approved']
          d=hashlib.sha256()
          n=0
          for part in m['image_parts']:
              p=root/part['relative_path']
              assert p.is_file() and p.stat().st_size==part['bytes']
              raw=p.read_bytes()
              assert hashlib.sha256(raw).hexdigest()==part['sha256']
              n+=len(raw)
              d.update(raw)
          assert d.hexdigest()==m['original_image_sha256']
          assert n==m['original_image_bytes']
          assert len(list((root/'metadata'/'dsm2025').glob('*.tif')))==1
          PY
      - name: Publish original DSM, inventory CSVs, source receipts and image-parts manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: in2025-source-evidence-${{ matrix.fips }}-${{ github.sha }}
          path: in2025-chunks-${{ matrix.fips }}/metadata/
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
      - name: Publish orthoimage part 00 (60 MiB max)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: in2025-ortho-part00-${{ matrix.fips }}-${{ github.sha }}
          path: in2025-chunks-${{ matrix.fips }}/part00/
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
      - name: Publish orthoimage part 01 (60 MiB max)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: in2025-ortho-part01-${{ matrix.fips }}-${{ github.sha }}
          path: in2025-chunks-${{ matrix.fips }}/part01/
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
