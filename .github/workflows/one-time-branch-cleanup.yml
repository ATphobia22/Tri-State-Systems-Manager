name: One-time stale branch cleanup

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Delete stale branches already reconciled into main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for branch in \
            'feat/coolify-community-data-fabric' \
            'feat/external-capability-fabric-2026-09-28' \
            'fix/windows-rolldown-spawn'
          do
            echo "Deleting stale branch: $branch"
            gh api -X DELETE "repos/${REPO}/git/refs/heads/${branch}" || true
          done

      - name: Remove one-time cleanup workflow
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          SHA="$(gh api "repos/${REPO}/contents/.github/workflows/one-time-branch-cleanup.yml" --jq '.sha')"
          gh api -X DELETE "repos/${REPO}/contents/.github/workflows/one-time-branch-cleanup.yml" \
            -f message='chore: remove one-time branch cleanup workflow' \
            -f sha="${SHA}"
