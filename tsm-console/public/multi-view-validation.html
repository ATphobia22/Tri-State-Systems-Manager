<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PTDT v35 Multi-View Validation</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #020617; font-family: monospace; }
    #canvas-viewport { width: 100vw; height: 100vh; display: block; }
    #hud {
      position: absolute; top: 12px; left: 12px; z-index: 10;
      background: rgba(9,15,30,0.85); border: 1px solid #1e293b;
      color: #38bdf8; font-size: 11px; padding: 10px; border-radius: 4px;
      pointer-events: none; line-height: 1.45;
    }
  </style>
  <script type="importmap">
  { "imports": { "three": "https://unpkg.com/three@0.170.0/build/three.module.js" } }
  </script>
</head>
<body>
  <div id="hud">
    <strong>PTDT v35 MULTI-VIEW</strong><br />
    EPSG:2966 | NAVD88 | BFE 375.0 / LAG 377.2<br />
    CID 180209 | FIXED camera arrays
  </div>
  <canvas id="canvas-viewport"></canvas>
  <script type="module">
    import * as THREE from "three";

    const canvas = document.getElementById("canvas-viewport");
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x030712);
    scene.fog = new THREE.FogExp2(0x030712, 0.015);

    const terrainGeo = new THREE.PlaneGeometry(120, 120, 64, 64);
    const pos = terrainGeo.attributes.position;
    for (let i = 0; i < pos.count; i++) {
      const x = pos.getX(i), y = pos.getY(i);
      pos.setZ(i, Math.sin(x * 0.06) * Math.cos(y * 0.06) * 3.5);
    }
    terrainGeo.computeVertexNormals();
    const terrain = new THREE.Mesh(
      terrainGeo,
      new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.85 })
    );
    terrain.rotation.x = -Math.PI / 2;
    scene.add(terrain);

    const water = new THREE.Mesh(
      new THREE.PlaneGeometry(115, 115),
      new THREE.MeshStandardMaterial({ color: 0x0284c7, transparent: true, opacity: 0.62, roughness: 0.1 })
    );
    water.rotation.x = -Math.PI / 2;
    water.position.y = 0.5;
    scene.add(water);

    scene.add(new THREE.DirectionalLight(0xfff4e0, 1.5).translateX(30).translateY(45).translateZ(20));
    scene.add(new THREE.AmbientLight(0x1e293b, 0.6));

    // FIXED camera position arrays (no empty camPos/look)
    const views = [
      { left: 0,   bottom: 0.5, width: 0.5, height: 0.5, camPos: [0, 100, 0],   look: [0, 0, 0] }, // Nadir
      { left: 0.5, bottom: 0.5, width: 0.5, height: 0.5, camPos: [50, 50, 50],  look: [0, 0, 0] }, // Isometric
      { left: 0,   bottom: 0,   width: 0.5, height: 0.5, camPos: [-45, 15, 45], look: [0, 5, 0] }, // Confluence
      { left: 0.5, bottom: 0,   width: 0.5, height: 0.5, camPos: [10, 5, 10],   look: [0, 2, 0] }, // Lot close-in
    ];

    const cameras = views.map((v) => {
      const cam = new THREE.PerspectiveCamera(
        45,
        (window.innerWidth * v.width) / (window.innerHeight * v.height),
        0.1,
        1000
      );
      cam.position.set(...v.camPos);
      cam.lookAt(...v.look);
      return cam;
    });

    const clock = new THREE.Clock();
    // For visual regression: set FREEZE_TIME to a constant instead of elapsed
    const FREEZE_TIME = null; // e.g. 1.25 for deterministic snapshots

    function animate() {
      requestAnimationFrame(animate);
      const t = FREEZE_TIME ?? clock.getElapsedTime();

      const wPos = water.geometry.attributes.position;
      for (let i = 0; i < wPos.count; i++) {
        const wx = wPos.getX(i), wz = wPos.getY(i);
        wPos.setZ(i, Math.sin(wx * 0.2 + t) * 0.15 + Math.cos(wz * 0.2 + t) * 0.1);
      }
      wPos.needsUpdate = true;

      const W = window.innerWidth, H = window.innerHeight;
      views.forEach((view, index) => {
        const left = Math.floor(W * view.left);
        const bottom = Math.floor(H * view.bottom);
        const width = Math.floor(W * view.width);
        const height = Math.floor(H * view.height);
        renderer.setViewport(left, bottom, width, height);
        renderer.setScissor(left, bottom, width, height);
        renderer.setScissorTest(true);
        const cam = cameras[index];
        cam.aspect = width / height;
        cam.updateProjectionMatrix();
        if (index === 1 && FREEZE_TIME === null) {
          cam.position.x = Math.cos(t * 0.15) * 50;
          cam.position.z = Math.sin(t * 0.15) * 50;
          cam.lookAt(0, 0, 0);
        }
        renderer.render(scene, cam);
      });
    }

    window.addEventListener("resize", () => {
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
    animate();
  </script>
</body>
</html>
