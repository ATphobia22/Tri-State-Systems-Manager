[package]
name = "tsm-desktop"
version = "0.2.1"
description = "Tri-State Systems Manager desktop application"
authors = ["Tri-State Systems Manager"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "tsm_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-updater = "2.11.0"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
