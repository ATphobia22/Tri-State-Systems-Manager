# Tri-State Systems Manager — portable local stack
#
# Profiles:
#   (default)     API + web  (file-backed evidence)
#   --profile db  adds PostgreSQL for Prisma path
#
# Examples:
#   docker compose up
#   docker compose --profile db up
#   docker compose up api
#
# No proprietary low-code runtime required.

name: tsm

services:
  # ── Evidence / token API (Phase 1) ─────────────────────────
  api:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
      - evidence_data:/app/.data
    command: sh -c "npm ci --no-audit --no-fund && node server/token-proxy.mjs"
    ports:
      - "8787:8787"
    environment:
      NODE_ENV: production
      PORT: "8787"
      ALLOW_DEMO_TOKENS: "false"
      TSM_EVIDENCE_DIR: /app/.data
      # Set when using profile db:
      # DATABASE_URL: postgresql://tsm:tsm@db:5432/tsm_evidence
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/api/policies"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  # ── Vite console (preview) ────────────────────────────────
  web:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    command: sh -c "npm ci --no-audit --no-fund && npm run build && npm run preview -- --host 0.0.0.0 --port 3000"
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:8787
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  # ── Optional Postgres (Prisma) ─────────────────────────────
  db:
    profiles: ["db"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tsm
      POSTGRES_PASSWORD: tsm
      POSTGRES_DB: tsm_evidence
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tsm -d tsm_evidence"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  evidence_data:
  node_modules:
  pg_data:
