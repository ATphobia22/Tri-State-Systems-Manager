# Tri-State Systems Manager — portable local/hosted stack
#
# Default profile: API + web
# Optional: --profile db adds PostgreSQL for future persistent-storage integrations.
#
# Local usage:
#   docker compose up --build
#   open http://localhost:3000
#
# Hosted usage:
#   publish the `api` service on HTTPS and set VITE_TSM_API_BASE_URL on the web build
#   to the public API origin. Keep CORS_ORIGIN restricted to the deployed web origin.

name: tsm

services:
  api:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./:/app:ro
      - node_modules:/app/node_modules
      - evidence_data:/app/.data
    command: sh -c "npm ci --no-audit --no-fund && node server/token-proxy.mjs"
    ports:
      - "8787:8787"
    environment:
      NODE_ENV: production
      PORT: "8787"
      CORS_ORIGIN: "http://localhost:3000"
      ALLOW_DEMO_TOKENS: "false"
      TSM_EVIDENCE_DIR: /app/.data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  web:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./:/app:ro
      - node_modules:/app/node_modules
    command: sh -c "npm ci --no-audit --no-fund && npm run build && npm run preview -- --host 0.0.0.0 --port 3000"
    ports:
      - "3000:3000"
    environment:
      VITE_TSM_API_BASE_URL: http://localhost:8787
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  db:
    profiles: ["db"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tsm
      POSTGRES_PASSWORD: tsm
      POSTGRES_DB: tsm_evidence
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tsm -d tsm_evidence"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  evidence_data:
  node_modules:
  pg_data:
