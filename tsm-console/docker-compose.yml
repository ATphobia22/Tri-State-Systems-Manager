# Tri-State Systems Manager — reproducible local/hosted stack
#
# Public/community use remains free. Production deployments must provide OIDC
# configuration through environment/secret injection; no credentials are stored here.
#
# Local:
#   cp .env.example .env
#   docker compose build
#   docker compose up
#
# Hosted:
#   build this image in CI, publish/attest it, and inject the required OIDC
#   environment values from the deployment platform's secret store.

name: tsm

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: tsm-console:local
    command: ["node", "server/token-proxy.mjs"]
    ports:
      - "8787:8787"
    environment:
      NODE_ENV: production
      TSM_AUTH_MODE: ${TSM_AUTH_MODE:-required}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
      OIDC_SCOPES: ${OIDC_SCOPES:-openid profile email roles}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-}
      TSM_SESSION_SECRET: ${TSM_SESSION_SECRET:-}
      TSM_BROWSER_SESSION_MAX_AGE_SEC: ${TSM_BROWSER_SESSION_MAX_AGE_SEC:-900}
      TSM_COOKIE_SAMESITE: ${TSM_COOKIE_SAMESITE:-Lax}
      TSM_COOKIE_SECURE: ${TSM_COOKIE_SECURE:-true}
      TSM_OPERATOR_ROLE: ${TSM_OPERATOR_ROLE:-tsm-operator}
      TSM_REVIEWER_ROLE: ${TSM_REVIEWER_ROLE:-tsm-reviewer}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      PORT: "8787"
      TSM_EVIDENCE_DIR: /app/.data
    volumes:
      - evidence_data:/app/.data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: tsm-console:local
    command: ["npm", "run", "preview", "--", "--host", "0.0.0.0", "--port", "3000"]
    ports:
      - "3000:3000"
    environment:
      VITE_TSM_API_BASE_URL: ${VITE_TSM_API_BASE_URL:-http://localhost:8787}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

volumes:
  evidence_data:
