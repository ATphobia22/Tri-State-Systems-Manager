<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Tri-State Systems Manager — Sovereign public-interest platform for the Tri-State River Valley" />
    <meta name="theme-color" content="#0A0F1A" />
    <!-- iOS standalone / Capacitor web-view -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tri-State Systems" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%manifest.json" />
    <title>TSM · Tri-State Systems Manager</title>
    <!-- Single Page Apps for GitHub Pages: restores deep-link routes that
         arrived via 404.html (?/path) before the router boots.
         MIT, adapted from rafgraph/spa-github-pages. -->
    <script src="%BASE_URL%spa-redirect.js"></script>
    <style>
      html, body, #root { margin: 0; padding: 0; height: 100%; background: #0f172a; }
      /* iPhone notch / Dynamic Island / home-indicator safe areas.
         env() resolves to 0px on devices without a safe area, so this is a
         no-op on desktop. The root uses 100dvh so the web view fills the
         screen behind the status bar (viewport-fit=cover). */
      body {
        padding:
          env(safe-area-inset-top, 0px)
          env(safe-area-inset-right, 0px)
          env(safe-area-inset-bottom, 0px)
          env(safe-area-inset-left, 0px);
        overscroll-behavior-y: none;
        -webkit-tap-highlight-color: transparent;
      }
      #root { height: 100dvh; }
    </style>
  </head>
  <body>
    <div id="root">
      <noscript>
        <main style="min-height:100dvh;display:grid;place-items:center;padding:2rem;color:#e5e7eb;background:#0f172a;font-family:system-ui,sans-serif;text-align:center">
          <section><h1>Tri-State Systems Manager</h1><p>JavaScript is required for the interactive engineering console.</p></section>
        </main>
      </noscript>
      <main id="boot-fallback" aria-live="polite" style="min-height:100dvh;display:grid;place-items:center;padding:2rem;color:#e5e7eb;background:#0f172a;font-family:system-ui,sans-serif;text-align:center">
        <section><h1>Tri-State Systems Manager</h1><p>Initializing the engineering console…</p></section>
      </main>
    </div>
    <script type="module" src="%BASE_URL%src/main.tsx"></script>
  </body>
</html>
