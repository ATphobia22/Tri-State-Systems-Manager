<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Tri-State Systems Manager — Sovereign public-interest platform for the Tri-State River Valley" />
    <meta name="theme-color" content="#0A0F1A" />
    <!-- iOS standalone / Capacitor web-view -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tri-State Systems" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%manifest.json" />
    <title>TSM · Tri-State Systems Manager</title>
    <style>
      html, body, #root { margin: 0; padding: 0; height: 100%; background: #0f172a; }
      /* iPhone notch / Dynamic Island / home-indicator safe areas.
         env() resolves to 0px on devices without a safe area, so this is a
         no-op on desktop. The root uses 100dvh so the web view fills the
         screen behind the status bar (viewport-fit=cover). */
      body {
        padding:
          env(safe-area-inset-top, 0px)
          env(safe-area-inset-right, 0px)
          env(safe-area-inset-bottom, 0px)
          env(safe-area-inset-left, 0px);
        overscroll-behavior-y: none;
        -webkit-tap-highlight-color: transparent;
      }
      #root { height: 100dvh; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
