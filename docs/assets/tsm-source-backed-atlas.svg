<title id="title">Tri-State 4D Engineering Atlas — registered real-world source geometry</title>
<desc id="desc">Static data-derived overview of 6 USGS gage location markers in the depicted bounding box and survey extents from a 20-feature USACE eHydro dataset. Positions are plotted using EPSG:4326 source coordinates. The diagram is not a hydrologic observation, real-time feed, elevation model or flood simulation.</desc>
