<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="570" aria-labelledby="title description" role="img" viewBox="0 0 1600 570"><title id="title">Tri-State Systems Manager: from government records to public evidence-based maps</title><desc id="description">Conceptual architecture diagram. Four phases: authoritative government records, headless geospatial processing, numerical science and evidence review, then maps and 3D visualization for the public. Shows a separation between official observations, derived analysis, scenario outputs, and regulatory authority. This diagram is not proof of complete data coverage, an operational real-time feed, or a validated hydraulic model.</desc><defs><linearGradient id="canvas" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#F8FBFD"/><stop offset="1" stop-color="#ECF5F3"/></linearGradient><filter id="shadow" width="140%" height="160%" x="-20%" y="-30%"><feDropShadow dx="0" dy="8" flood-color="#234F59" flood-opacity=".11" stdDeviation="13"/></filter></defs><rect width="1600" height="570" fill="url(#canvas)" rx="26"/><rect width="1532" height="90" x="34" y="28" fill="#FFF" stroke="#D4E7E5" rx="18"/><circle cx="85" cy="73" r="23" fill="#DCEFEB"/><path fill="none" stroke="#287D85" stroke-linecap="round" stroke-linejoin="round" stroke-width="5" d="M69 80l12-17 9 11 10-17"/><text x="128" y="67" fill="#17324D" font-family="Arial,sans-serif" font-size="35" font-weight="700">From trusted sources to understandable maps</text><text x="129" y="96" fill="#526879" font-family="Arial,sans-serif" font-size="20">A public digital twin with reproducible methods and clear evidence labels</text><g font-family="Arial,sans-serif"><rect width="348" height="280" x="43" y="155" fill="#FFF" stroke="#C9DEDA" filter="url(#shadow)" rx="20"/><rect width="105" height="34" x="58" y="170" fill="#DCEFEB" rx="17"/><text x="82" y="193" fill="#205A63" font-size="18" font-weight="700">01 · DATA</text><text x="67" y="250" fill="#17324D" font-size="29" font-weight="700">Government records</text><text x="67" y="293" fill="#526879" font-size="19">FEMA flood maps</text><text x="67" y="322" fill="#526879" font-size="19">USGS rivers and terrain</text><text x="67" y="351" fill="#526879" font-size="19">IN / IL / KY spatial sources</text><text x="67" y="380" fill="#526879" font-size="19">NOAA, USACE and NRCS</text><rect width="348" height="280" x="417" y="155" fill="#FFF" stroke="#C9DEDA" filter="url(#shadow)" rx="20"/><rect width="139" height="34" x="432" y="170" fill="#DCEFEB" rx="17"/><text x="455" y="193" fill="#205A63" font-size="18" font-weight="700">02 · PREPARE</text><text x="442" y="250" fill="#17324D" font-size="29" font-weight="700">Headless GIS</text><text x="442" y="293" fill="#526879" font-size="19">Check source date and extent</text><text x="442" y="322" fill="#526879" font-size="19">Transform CRS and datums</text><text x="442" y="351" fill="#526879" font-size="19">Validate shapes and units</text><text x="442" y="380" fill="#526879" font-size="19">Record SHA-256 lineage</text><rect width="348" height="280" x="791" y="155" fill="#FFF" stroke="#C9DEDA" filter="url(#shadow)" rx="20"/><rect width="142" height="34" x="806" y="170" fill="#DCEFEB" rx="17"/><text x="827" y="193" fill="#205A63" font-size="18" font-weight="700">03 · ANALYZE</text><text x="816" y="250" fill="#17324D" font-size="29" font-weight="700">Science and review</text><text x="816" y="293" fill="#526879" font-size="19">Rainfall–runoff calculations</text><text x="816" y="322" fill="#526879" font-size="19">Flood and terrain screening</text><text x="816" y="351" fill="#526879" font-size="19">Compare elevation and BFE</text><text x="816" y="380" fill="#526879" font-size="19">Mark unknowns and limits</text><rect width="390" height="280" x="1165" y="155" fill="#FFF" stroke="#C9DEDA" filter="url(#shadow)" rx="20"/><rect width="128" height="34" x="1180" y="170" fill="#DCEFEB" rx="17"/><text x="1200" y="193" fill="#205A63" font-size="18" font-weight="700">04 · EXPLORE</text><text x="1190" y="250" fill="#17324D" font-size="29" font-weight="700">Maps and 3D scenes</text><text x="1190" y="293" fill="#526879" font-size="19">Public map and layer controls</text><text x="1190" y="322" fill="#526879" font-size="19">Terrain, buildings, timelines</text><text x="1190" y="351" fill="#526879" font-size="19">Inspect provenance and gaps</text><text x="1190" y="380" fill="#526879" font-size="19">Headed rendering only</text><g fill="#287D85"><path d="M391 287l21 14-21 14z"/><path d="M765 287l21 14-21 14z"/><path d="M1139 287l21 14-21 14z"/></g></g><rect width="1510" height="64" x="45" y="469" fill="#17324D" rx="15"/><text x="72" y="495" fill="#F6FFFE" font-family="Arial,sans-serif" font-size="19" font-weight="700">EVIDENCE FIRST</text><text x="72" y="520" fill="#DCEFEB" font-family="Arial,sans-serif" font-size="18">OBSERVED · DERIVED · SCENARIO · REGULATORY — different classes, never interchangeable</text><text x="1513" y="508" fill="#7AE0CF" font-family="Arial,sans-serif" font-size="19" font-weight="700" text-anchor="end">HUMAN AUTHORITY FINAL</text></svg>