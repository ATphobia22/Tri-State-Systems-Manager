<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="570" viewBox="0 0 1600 570" role="img" aria-labelledby="title description">
<title id="title">Tri-State Systems Manager: from government records to public evidence-based maps</title>
<desc id="description">Conceptual architecture diagram. Four phases: authoritative government records, headless geospatial processing, numerical science and evidence review, then maps and 3D visualization for the public. Shows a separation between official observations, derived analysis, scenario outputs, and regulatory authority. This diagram is not proof of complete data coverage, an operational real-time feed, or a validated hydraulic model.</desc>
<defs>
  <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F8FBFD"/><stop offset="1" stop-color="#ECF5F3"/></linearGradient>
  <filter id="shadow" x="-20%" y="-30%" width="140%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="13" flood-color="#234F59" flood-opacity="0.11"/></filter>
</defs>
<rect width="1600" height="570" rx="26" fill="url(#canvas)"/>
<rect x="34" y="28" width="1532" height="90" rx="18" fill="#FFFFFF" stroke="#D4E7E5"/>
<circle cx="85" cy="73" r="23" fill="#DCEFEB"/><path d="M69 80l12-17 9 11 10-17" stroke="#287D85" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="128" y="67" font-family="Arial,sans-serif" font-weight="700" font-size="35" fill="#17324D">From trusted sources to understandable maps</text>
<text x="129" y="96" font-family="Arial,sans-serif" font-size="20" fill="#526879">A public digital twin with reproducible methods and clear evidence labels</text>
<g font-family="Arial,sans-serif">
  <rect x="43" y="155" width="348" height="280" rx="20" fill="#FFFFFF" stroke="#C9DEDA" filter="url(#shadow)"/>
  <rect x="58" y="170" width="105" height="34" rx="17" fill="#DCEFEB"/><text x="82" y="193" fill="#205A63" font-weight="700" font-size="18">01 · DATA</text>
  <text x="67" y="250" fill="#17324D" font-size="29" font-weight="700">Government records</text>
  <text x="67" y="293" fill="#526879" font-size="19">FEMA flood maps</text>
  <text x="67" y="322" fill="#526879" font-size="19">USGS rivers and terrain</text>
  <text x="67" y="351" fill="#526879" font-size="19">IN / IL / KY spatial sources</text>
  <text x="67" y="380" fill="#526879" font-size="19">NOAA, USACE and NRCS</text>
  <rect x="417" y="155" width="348" height="280" rx="20" fill="#FFFFFF" stroke="#C9DEDA" filter="url(#shadow)"/>
  <rect x="432" y="170" width="139" height="34" rx="17" fill="#DCEFEB"/><text x="455" y="193" fill="#205A63" font-weight="700" font-size="18">02 · PREPARE</text>
  <text x="442" y="250" fill="#17324D" font-size="29" font-weight="700">Headless GIS</text>
  <text x="442" y="293" fill="#526879" font-size="19">Check source date and extent</text>
  <text x="442" y="322" fill="#526879" font-size="19">Transform CRS and datums</text>
  <text x="442" y="351" fill="#526879" font-size="19">Validate shapes and units</text>
  <text x="442" y="380" fill="#526879" font-size="19">Record SHA-256 lineage</text>
  <rect x="791" y="155" width="348" height="280" rx="20" fill="#FFFFFF" stroke="#C9DEDA" filter="url(#shadow)"/>
  <rect x="806" y="170" width="142" height="34" rx="17" fill="#DCEFEB"/><text x="827" y="193" fill="#205A63" font-weight="700" font-size="18">03 · ANALYZE</text>
  <text x="816" y="250" fill="#17324D" font-size="29" font-weight="700">Science and review</text>
  <text x="816" y="293" fill="#526879" font-size="19">Rainfall–runoff calculations</text>
  <text x="816" y="322" fill="#526879" font-size="19">Flood and terrain screening</text>
  <text x="816" y="351" fill="#526879" font-size="19">Compare elevation and BFE</text>
  <text x="816" y="380" fill="#526879" font-size="19">Mark unknowns and limits</text>
  <rect x="1165" y="155" width="390" height="280" rx="20" fill="#FFFFFF" stroke="#C9DEDA" filter="url(#shadow)"/>
  <rect x="1180" y="170" width="128" height="34" rx="17" fill="#DCEFEB"/><text x="1200" y="193" fill="#205A63" font-weight="700" font-size="18">04 · EXPLORE</text>
  <text x="1190" y="250" fill="#17324D" font-size="29" font-weight="700">Maps and 3D scenes</text>
  <text x="1190" y="293" fill="#526879" font-size="19">Public map and layer controls</text>
  <text x="1190" y="322" fill="#526879" font-size="19">Terrain, buildings, timelines</text>
  <text x="1190" y="351" fill="#526879" font-size="19">Inspect provenance and gaps</text>
  <text x="1190" y="380" fill="#526879" font-size="19">Headed rendering only</text>
  <g fill="#287D85"><path d="M391 287l21 14-21 14z"/><path d="M765 287l21 14-21 14z"/><path d="M1139 287l21 14-21 14z"/></g>
</g>
<rect x="45" y="469" width="1510" height="64" rx="15" fill="#17324D"/>
<text x="72" y="495" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#F6FFFE">EVIDENCE FIRST</text>
<text x="72" y="520" font-family="Arial,sans-serif" font-size="18" fill="#DCEFEB">OBSERVED · DERIVED · SCENARIO · REGULATORY — different classes, never interchangeable</text>
<text x="1513" y="508" text-anchor="end" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#7AE0CF">HUMAN AUTHORITY FINAL</text>
</svg>