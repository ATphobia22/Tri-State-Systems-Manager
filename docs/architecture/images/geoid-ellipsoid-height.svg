<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="650" aria-labelledby="title desc" role="img" viewBox="0 0 1120 650"><title id="title">Ellipsoid, geoid, and orthometric height</title><desc id="desc">A not-to-scale conceptual cross-section shows a terrain point above a reference ellipsoid and an undulating geoid surface. Ellipsoidal height h is measured from the ellipsoid to the point, orthometric height H from the geoid to the point, and geoid height N between the ellipsoid and geoid. In this schematic the geoid is below the ellipsoid, consistent with the usual sign of N over much of CONUS. The relationship is h equals H plus N.</desc><defs><marker id="arrow" markerHeight="9" markerWidth="9" orient="auto-start-reverse" refX="4.5" refY="4.5"><path fill="#243447" d="M0,0 L9,4.5 L0,9 z"/></marker><linearGradient id="sky" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#f7fbff"/><stop offset="1" stop-color="#eaf3fb"/></linearGradient><linearGradient id="terrainFill" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#9ccb87"/><stop offset="1" stop-color="#dcebd1"/></linearGradient></defs><rect width="1120" height="650" fill="url(#sky)" rx="22"/><text x="52" y="52" fill="#132d46" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700">Ellipsoid, geoid, and elevation are different references</text><text x="54" y="82" fill="#38536b" font-family="Arial, Helvetica, sans-serif" font-size="16">Conceptual cross-section • vertical differences exaggerated • not to scale</text><path fill="url(#terrainFill)" d="M48 273 L128 268 L185 235 L226 250 L281 218 L340 255 L395 247 L454 198 L505 236 L571 226 L632 253 L704 242 L761 207 L816 242 L884 229 L948 255 L1070 250 L1070 535 L48 535 Z"/><path fill="none" stroke="#53824d" stroke-linejoin="round" stroke-width="4" d="M48 273 L128 268 L185 235 L226 250 L281 218 L340 255 L395 247 L454 198 L505 236 L571 226 L632 253 L704 242 L761 207 L816 242 L884 229 L948 255 L1070 250"/><text x="70" y="182" fill="#315b31" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">Terrain / point P</text><path fill="none" stroke="#315b31" stroke-width="2" d="M196 189 L268 221"/><path fill="none" stroke="#147d95" stroke-width="5" d="M48 478 C145 457 225 501 320 482 S474 459 570 484 S740 505 834 477 S976 459 1070 480"/><text x="74" y="515" fill="#09677f" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">Geoid / vertical reference surface</text><text x="74" y="535" fill="#09677f" font-family="Arial, Helvetica, sans-serif" font-size="14">(often below the ellipsoid in CONUS)</text><path fill="none" stroke="#6757a7" stroke-width="5" d="M48 421 C210 406 365 406 520 420 S825 436 1070 419"/><text x="74" y="452" fill="#51428e" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">Reference ellipsoid</text><text x="74" y="472" fill="#51428e" font-family="Arial, Helvetica, sans-serif" font-size="14">(mathematical surface tied to a named frame)</text><line x1="365" x2="365" y1="250" y2="417" stroke="#243447" stroke-width="2.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/><rect width="65" height="43" x="333" y="309" fill="#fff" stroke="#b5c3cf" rx="8"/><text x="365" y="338" fill="#243447" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="middle">h</text><text x="409" y="306" fill="#243447" font-family="Arial, Helvetica, sans-serif" font-size="16">Ellipsoidal height</text><text x="409" y="327" fill="#526577" font-family="Arial, Helvetica, sans-serif" font-size="14">(GNSS output, with frame/epoch)</text><line x1="626" x2="626" y1="247" y2="483" stroke="#243447" stroke-width="2.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/><rect width="65" height="43" x="594" y="345" fill="#fff" stroke="#b5c3cf" rx="8"/><text x="626" y="374" fill="#243447" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="middle">H</text><text x="670" y="343" fill="#243447" font-family="Arial, Helvetica, sans-serif" font-size="16">Orthometric height</text><text x="670" y="364" fill="#526577" font-family="Arial, Helvetica, sans-serif" font-size="14">(elevation relative to a named vertical datum)</text><line x1="885" x2="885" y1="421" y2="480" stroke="#243447" stroke-width="2.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/><rect width="65" height="43" x="853" y="428" fill="#fff" stroke="#b5c3cf" rx="8"/><text x="885" y="457" fill="#243447" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="middle">N</text><text x="922" y="428" fill="#243447" font-family="Arial, Helvetica, sans-serif" font-size="16">Geoid height</text><text x="922" y="449" fill="#526577" font-family="Arial, Helvetica, sans-serif" font-size="14">(ellipsoid-to-geoid separation)</text><rect width="650" height="45" x="420" y="582" fill="#fff" stroke="#b7cadb" rx="10"/><text x="745" y="611" fill="#132d46" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="middle">h = H + N • H ≈ h − N</text></svg>