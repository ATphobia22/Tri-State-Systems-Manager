services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: uacf
      POSTGRES_USER: uacf
      POSTGRES_PASSWORD: uacf
    ports:
      - "5432:5432"
    volumes:
      - uacf_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uacf -d uacf"]
      interval: 10s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  uacf_postgres:
