[package]
name = "sovereign-dedup-engine"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Offline content-defined chunking and integrity-checked deduplicated object storage"

[dependencies]
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
