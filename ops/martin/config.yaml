# yaml-language-server: $schema=https://raw.githubusercontent.com/maplibre/martin/main/schemas/config.json
# TSM Martin tile-plane configuration.
# Secrets are supplied through environment variables; no credentials belong here.

base_path: /tiles
listen_addresses:
  - 0.0.0.0:3000
keep_alive: 75
on_invalid: abort
web_ui: disable
worker_processes: 8

cache:
  size_mb: 512

postgres:
  connection_string: ${TSM_MARTIN_DATABASE_URL}
  pool_size: 20
  auto_bounds: quick
  reload_interval: 10m
  retry_timeout: 30s
  max_feature_count: 50000
  cache:
    minzoom: 0
    maxzoom: 16

  # Explicit sources prevent accidental publication of unrelated PostGIS tables.
  # The SQL function is the public MVT contract for cadastral parcels.
  tables: {}
  functions:
    get_parcel_tiles:
      schema: public
      function: get_parcel_tiles(integer, integer, integer)
      minzoom: 12
      maxzoom: 20

pmtiles:
  paths:
    - /data/pmtiles
  recursive: true
  reload_interval: 10m

styles:
  paths:
    - /data/styles
