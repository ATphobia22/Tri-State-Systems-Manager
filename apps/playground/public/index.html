<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TSM UACF Playground</title><style>body{font-family:system-ui;background:#0b1020;color:#e5e7eb;margin:0;padding:32px}main{max-width:900px;margin:auto}textarea{width:100%;min-height:260px;background:#111827;color:#e5e7eb;border:1px solid #374151;border-radius:8px;padding:12px}button{margin-top:12px;padding:10px 16px;border-radius:8px}pre{white-space:pre-wrap}</style></head><body><main><h1>UACF Capability Playground</h1><textarea id="input">{"capability":"test.echo","input":"hello","context":{"requestId":"playground-request","permissions":{"allow":[]}}}</textarea><button id="run">Execute</button><pre id="out"></pre><script>document.querySelector('#run').onclick=async()=>{const out=document.querySelector('#out');try{const r=await fetch('/api/execute',{method:'POST',headers:{'content-type':'application/json'},body:document.querySelector('#input').value});out.textContent=JSON.stringify(await r.json(),null,2)}catch(e){out.textContent=String(e)}}</script></main></body></html>
