<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TSM UACF Dashboard</title><style>body{font-family:system-ui;background:#0b1020;color:#e5e7eb;margin:0;padding:32px}main{max-width:900px;margin:auto}article{padding:24px;border:1px solid #26314f;border-radius:12px;background:#121a2e}code{font-family:ui-monospace}#status{font-weight:700}</style></head><body><main><h1>TSM UACF Operations</h1><article><p>Gateway health: <span id="status">checking…</span></p><pre id="details"></pre></article></main><script>fetch('/api/health').then(async r=>{const d=await r.json();document.querySelector('#status').textContent=r.ok?'ONLINE':'UNAVAILABLE';document.querySelector('#details').textContent=JSON.stringify(d,null,2)}).catch(()=>{document.querySelector('#status').textContent='UNAVAILABLE'})</script></body></html>
