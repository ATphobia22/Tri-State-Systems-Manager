# LEGACY / RESEARCH STACK\n#\n# The canonical application runtime is tsm-console/docker-compose.yml.\n# This file remains only for the historical PostGIS/engineering environment.\n# Never commit populated .env values. Prefer a secret manager in hosted deployments.\n#\n# Usage:\n#   POSTGRES_USER=... POSTGRES_PASSWORD=... POSTGRES_DB=... docker compose up\n#\nservices:\n  postgis_db:\n    image: postgis/postgis:16-3.4-alpine\n    environment:\n      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}\n      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}\n      POSTGRES_DB: ${POSTGRES_DB:-ptdt_v35}\n    ports:\n      - "127.0.0.1:5432:5432"\n    volumes:\n      - ptdt_postgis_data:/var/lib/postgresql/data\n    healthcheck:\n      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]\n      interval: 5s\n      timeout: 5s\n      retries: 10\n      start_period: 10s\n    restart: unless-stopped\n\n  backend_api:\n    image: python:3.11-slim\n    working_dir: /app\n    volumes:\n      - ./backend/api:/app:ro\n    command: >\n      sh -c "python -m pip install --no-cache-dir -r /app/../requirements.txt &&\n             uvicorn server:app --host 0.0.0.0 --port 8000"\n    ports:\n      - "127.0.0.1:8000:8000"\n    environment:\n      PTDT_POSTGIS_DSN: "dbname=$${POSTGRES_DB} user=$${POSTGRES_USER} host=postgis_db port=5432 password=$${POSTGRES_PASSWORD}"\n    depends_on:\n      postgis_db:\n        condition: service_healthy\n    restart: unless-stopped\n\nvolumes:\n  ptdt_postgis_data:\n