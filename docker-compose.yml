# PTDT v35 — Local Test Stack (PostGIS + API smoke)
# Usage:
#   docker compose up -d --build
#   docker compose exec api python scripts/verify-backend-invariants.py
#   docker compose down -v

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ptdt
      POSTGRES_PASSWORD: ptdt_dev
      POSTGRES_DB: ptdt_v35
    ports:
      - "5432:5432"
    volumes:
      - ptdt_pgdata:/var/lib/postgresql/data
      - ./backend/db/postgis_raster_optimize.sql:/docker-entrypoint-initdb.d/20-raster-optimize.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ptdt -d ptdt_v35"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DATABASE_URL: postgresql://ptdt:ptdt_dev@db:5432/ptdt_v35
      PTDT_CRS: EPSG:2966
      PTDT_BFE_FT: "375.0"
      PTDT_LAG_FT: "377.2"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend:ro
      - ./scripts:/app/scripts:ro
    command: ["python", "scripts/verify-backend-invariants.py"]

volumes:
  ptdt_pgdata:
