# Opt-in regional twin DB and read API. Nothing starts in the offline Windows runtime.
# cp packages/government/.env.twin.example packages/government/.env.twin
# docker compose --env-file packages/government/.env.twin -f packages/government/docker-compose.twin.yml up -d --build
services:
  postgis:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: tsm_government
      POSTGRES_DB: tsm_government
      POSTGRES_PASSWORD: ${POSTGIS_PASSWORD:?Define POSTGIS_PASSWORD in your local secret file}
    volumes:
      - twin_pgdata:/var/lib/postgresql/data
      - ./sql/001_government_fabric_postgis.sql:/docker-entrypoint-initdb.d/001_government_fabric_postgis.sql:ro
      - ./sql/002_government_evidence_ledger.sql:/docker-entrypoint-initdb.d/002_government_evidence_ledger.sql:ro
      - ./sql/003_posey_regional_twin.sql:/docker-entrypoint-initdb.d/003_posey_regional_twin.sql:ro
    ports:
      - "127.0.0.1:5439:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tsm_government -d tsm_government"]
      interval: 5s
      timeout: 4s
      retries: 15
    restart: unless-stopped
  twin-api:
    build:
      context: ../..
      dockerfile: packages/government/Dockerfile.twin-api
    depends_on:
      postgis:
        condition: service_healthy
    environment:
      TSM_POSTGIS_DSN: postgresql://tsm_government:${POSTGIS_PASSWORD}@postgis:5432/tsm_government
    ports:
      - "127.0.0.1:8769:8769"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
volumes:
  twin_pgdata:
