# TSM Oracle Cloud deployment: login-free and gauge-independent.
# API + Caddy only; no Keycloak, no OIDC bootstrap, no live river telemetry.

name: tsm-oracle
services:
  api:
    build:
      context: ../..
      dockerfile: tsm-console/Dockerfile
    image: tsm-console-api:oracle
    restart: unless-stopped
    expose: ["8787"]
    env_file: [.env]
    environment:
      NODE_ENV: production
      PORT: "8787"
      TSM_BUILD_SHA: ${SOURCE_COMMIT:-local}
      TSM_AUTH_MODE: disabled
      TSM_PUBLIC_OPERATOR_MODE: ${TSM_PUBLIC_OPERATOR_MODE:-1}
      TSM_LOCAL_MODE: "0"
      TSM_OFFLINE: ${TSM_OFFLINE:-0}
      TSM_EVIDENCE_DIR: /app/.data
      UACF_MASTER_KEY: ${UACF_MASTER_KEY:?UACF_MASTER_KEY is required}
    volumes:
      - evidence_data:/app/.data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/ready"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 45s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_HOSTNAME: ${API_HOSTNAME:?API_HOSTNAME is required}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api]

volumes:
  evidence_data:
  caddy_data:
  caddy_config:
