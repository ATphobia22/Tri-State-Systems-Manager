name: tsm-api

services:
  api:
    build:
      context: ../..
      dockerfile: tsm-console/Dockerfile
    image: tsm-console-api:coolify
    restart: unless-stopped
    ports:
      - "8787"
    environment:
      NODE_ENV: production
      PORT: "8787"
      TSM_BUILD_SHA: ${TSM_BUILD_SHA:?TSM_BUILD_SHA must be supplied by the deployment controller}
      TSM_AUTH_MODE: ${TSM_AUTH_MODE:-required}
      OIDC_ISSUER: ${OIDC_ISSUER:?OIDC_ISSUER is required}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:?OIDC_AUDIENCE is required}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-tsm-console-bff}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?OIDC_CLIENT_SECRET is required}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:?OIDC_REDIRECT_URI is required}
      OIDC_SCOPES: ${OIDC_SCOPES:-openid profile email roles}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-}
      TSM_SESSION_SECRET: ${TSM_SESSION_SECRET:?TSM_SESSION_SECRET is required}
      TSM_BROWSER_SESSION_MAX_AGE_SEC: ${TSM_BROWSER_SESSION_MAX_AGE_SEC:-900}
      TSM_COOKIE_SAMESITE: ${TSM_COOKIE_SAMESITE:-Lax}
      TSM_COOKIE_SECURE: ${TSM_COOKIE_SECURE:-true}
      TSM_OPERATOR_ROLE: ${TSM_OPERATOR_ROLE:-tsm-operator}
      TSM_REVIEWER_ROLE: ${TSM_REVIEWER_ROLE:-tsm-reviewer}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN is required}
      TSM_EVIDENCE_DIR: /app/.data
    volumes:
      - evidence_data:/app/.data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

volumes:
  evidence_data:
