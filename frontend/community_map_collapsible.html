<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TSM Community Map — Mount Vernon / Ohio–Wabash</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root { --panel:#0f172a; --text:#e2e8f0; --muted:#94a3b8; --accent:#38bdf8; --ok:#4ade80; --warn:#fbbf24; }
    * { box-sizing:border-box; }
    html,body{margin:0;height:100%;font-family:system-ui,sans-serif;background:#020617;color:var(--text)}
    #map{position:absolute;inset:0;z-index:0}
    .sidebar{position:absolute;top:12px;left:12px;z-index:1000;width:min(320px,calc(100vw - 24px));max-height:calc(100vh - 24px);overflow:auto;background:rgba(15,23,42,.92);backdrop-filter:blur(8px);border:1px solid #334155;border-radius:12px}
    .sidebar header{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid #334155}
    .sidebar h1{margin:0;font-size:.95rem}
    .panel{border-bottom:1px solid #334155}
    .panel>button.accordion{width:100%;text-align:left;background:transparent;color:var(--text);border:0;padding:10px 14px;font-weight:600;cursor:pointer;display:flex;justify-content:space-between}
    .panel>button.accordion::after{content:"▾";color:var(--muted)}
    .panel.collapsed>button.accordion::after{content:"▸"}
    .panel .body{padding:0 14px 12px;font-size:.85rem;color:var(--muted)}
    .panel.collapsed .body{display:none}
    label.row{display:flex;align-items:center;gap:8px;margin:6px 0;color:var(--text)}
    input[type=range]{width:100%}
    .pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:.72rem;font-weight:700}
    .pill.ok{background:#14532d;color:var(--ok)}
    .kv{display:grid;grid-template-columns:1fr auto;gap:4px 12px;margin-top:6px}
    footer.note{padding:10px 14px;font-size:.72rem;color:var(--muted)}
    a{color:var(--accent)}
  </style>
</head>
<body>
  <div id="map"></div>
  <aside class="sidebar" id="sidebar">
    <header>
      <h1>TSM Community Map</h1>
      <button type="button" id="collapseAll" style="background:#1e293b;color:var(--text);border:1px solid #475569;border-radius:8px;padding:6px 10px;cursor:pointer">Collapse</button>
    </header>
    <div class="panel"><button type="button" class="accordion">Site status</button>
      <div class="body"><div class="kv"><span>BFE (NAVD88)</span><span>369.1 ft</span><span>CRS</span><span>EPSG:26916</span><span>Gates</span><span class="pill ok">PASS</span></div></div></div>
    <div class="panel"><button type="button" class="accordion">Layers</button>
      <div class="body">
        <label class="row"><input type="checkbox" id="lyrBasemap" checked/> Basemap</label>
        <label class="row"><input type="checkbox" id="lyrNwi" checked/> NWI Wetlands</label>
        <label class="row">Opacity <input type="range" id="nwiOpacity" min="0" max="100" value="55"/></label>
        <label class="row"><input type="checkbox" id="lyrBfe" checked/> BFE context</label>
      </div></div>
    <div class="panel collapsed"><button type="button" class="accordion">Wetlands note</button>
      <div class="body">NWI is screening only. Intersection ≠ USACE JD. <a href="https://www.fws.gov/program/national-wetlands-inventory/data-download" target="_blank" rel="noopener">FWS NWI</a></div></div>
    <div class="panel collapsed"><button type="button" class="accordion">Human authority</button>
      <div class="body">ADR-004: software informs; people decide. No CEII. No public indoor LoD4.</div></div>
    <footer class="note">Mount Vernon / Posey · Ohio–Wabash · community build</footer>
  </aside>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map',{zoomControl:false}).setView([37.9323,-87.895],12);
    L.control.zoom({position:'bottomright'}).addTo(map);
    const basemap = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OSM'}).addTo(map);
    let nwi = null;
    try {
      nwi = L.tileLayer.wms('https://fwspublicservices.wim.usgs.gov/wetlandsmapservice/services/Wetlands/MapServer/WMSServer',{
        layers:'1',format:'image/png',transparent:true,version:'1.3.0',opacity:0.55,
        attribution:'NWI — US FWS'
      }).addTo(map);
    } catch(e) {}
    const bfe = L.circleMarker([37.8348,-88.0142],{radius:8,color:'#38bdf8',fillColor:'#0ea5e9',fillOpacity:0.7})
      .bindPopup('<b>Site</b><br>BFE 369.1 ft NAVD88').addTo(map);
    document.getElementById('lyrBasemap').onchange = e => e.target.checked ? basemap.addTo(map) : map.removeLayer(basemap);
    document.getElementById('lyrNwi').onchange = e => { if(nwi) e.target.checked ? nwi.addTo(map) : map.removeLayer(nwi); };
    document.getElementById('nwiOpacity').oninput = e => { if(nwi) nwi.setOpacity(+e.target.value/100); };
    document.getElementById('lyrBfe').onchange = e => e.target.checked ? bfe.addTo(map) : map.removeLayer(bfe);
    document.querySelectorAll('.panel>.accordion').forEach(btn => btn.onclick = () => btn.parentElement.classList.toggle('collapsed'));
    document.getElementById('collapseAll').onclick = () => document.querySelectorAll('.panel').forEach(p => p.classList.add('collapsed'));
  </script>
</body>
</html>
