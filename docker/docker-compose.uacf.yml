services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: uacf
      POSTGRES_USER: uacf
      POSTGRES_PASSWORD: uacf
    ports: ["5432:5432"]
    volumes: [uacf_postgres:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  uacf_postgres: